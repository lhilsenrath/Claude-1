  }
  c.fillStyle = "#4a3526"; c.fillRect(W - 154, 234, 150, 4);
  // CASH ONLY placard
  c.save(); c.translate(W - 56, 176); c.rotate(-0.08);
  c.fillStyle = "#f4ead0"; c.fillRect(-30, -12, 60, 24);
  c.strokeStyle = "#1c5a3a"; c.lineWidth = 2; c.strokeRect(-30, -12, 60, 24);
  c.fillStyle = "#1c5a3a"; c.font = "bold 11px Arial"; c.textAlign = "center"; c.fillText("CASH ONLY", 0, 4);
  c.restore();
  // bar counter (floor sits at a fixed H-50 in the arena)
  const fy = H - 50;
  c.fillStyle = "#5e3c1f"; c.fillRect(0, fy - 26, W, 26);
  c.fillStyle = "#774e28"; c.fillRect(0, fy - 26, W, 5);
  c.fillStyle = "rgba(255,255,255,0.08)"; c.fillRect(0, fy - 25, W, 2);
})();

// ---------- Entity drawing ----------
function drawPlatform(p) {
  if (p.broken) return;
  const y = p.y - cameraY;
  if (y < -90 || y > H + 30) return;
  ctx.save();
  ctx.translate(p.x, y + (p.flash > 0 ? p.flash * 0.4 : 0));

  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.13)";
  ctx.beginPath(); ctx.ellipse(p.w / 2, 16, p.w / 2 - 6, 4, 0, 0, 6.28); ctx.fill();

  // boss-arena floor: worn bar planks at the Chicken Box, gold bar in PE
  if (p.type === "floor") {
    if (phase === 5) {
      ctx.fillStyle = "#6e4a28";
      ctx.beginPath(); ctx.roundRect(0, 4, p.w, 12, 2); ctx.fill();
      ctx.fillStyle = "#835b34"; ctx.fillRect(0, 4, p.w, 3);
      ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1;
      for (let i = 30; i < p.w; i += 46) { ctx.beginPath(); ctx.moveTo(i, 4); ctx.lineTo(i, 16); ctx.stroke(); }
    } else {
      ctx.fillStyle = GRADS.gold;
      ctx.beginPath(); ctx.roundRect(0, 4, p.w, 11, 3); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.fillRect(3, 5.5, p.w - 6, 2);
    }
    ctx.restore();
    return;
  }

  if (phase === 6) {
    // ----- Nantucket beach planks: white with red candy stripes -----
    const base = p.type === "moving" ? GRADS.nanMove : p.type === "wood" ? GRADS.nanWood : GRADS.nanWhite;
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.roundRect(0, 4, p.w, 11, 3); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.28)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.fillRect(3, 5.5, p.w - 6, 2);
    if (p.type === "normal") {
      ctx.save();
      ctx.beginPath(); ctx.roundRect(0, 4, p.w, 11, 3); ctx.clip();
      ctx.fillStyle = "#e0473d";
      for (let i = -6; i < p.w; i += 16) {
        ctx.beginPath(); ctx.moveTo(i, 4); ctx.lineTo(i + 7, 4); ctx.lineTo(i + 1, 15); ctx.lineTo(i - 6, 15); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    } else if (p.type === "wood") {
      ctx.strokeStyle = "rgba(80,55,30,0.5)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(8, 8); ctx.lineTo(28, 9); ctx.moveTo(36, 11); ctx.lineTo(54, 10); ctx.moveTo(30, 6); ctx.lineTo(33, 14); ctx.stroke();
    } else if (p.type === "moving") {
      ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1;
      const off = (t * p.vx * 0.8) % 10;
      for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(6 + i * 12 + off, 9); ctx.lineTo(12 + i * 12 + off, 9); ctx.stroke(); }
    }
    // trampoline: three Cisco beers on a silver platter
    if (p.type === "net") {
      const cxm = p.w / 2;
      // wide silver platter
      ctx.fillStyle = "#cfd4da";
      ctx.beginPath(); ctx.ellipse(cxm, 0, 34, 6.5, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#eef1f4";
      ctx.beginPath(); ctx.ellipse(cxm, -1, 31, 5, 0, 0, 6.28); ctx.fill();
      ctx.strokeStyle = "#aab0b8"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(cxm, 0, 34, 6.5, 0, 0, 6.28); ctx.stroke();
      // five Cisco brews of different colours (back row then front for depth)
      for (let i = -2; i <= 2; i += 2) drawBeer(cxm + i * 12, -8, BEER_COLS[i + 2]);
      for (let i = -1; i <= 1; i += 2) drawBeer(cxm + i * 12, -4, BEER_COLS[i + 2]);
    }
  } else if (phase >= 2) {
    // ----- private equity platforms -----
    ctx.fillStyle = p.type === "moving" ? GRADS.platinum :
                    p.type === "wood" ? GRADS.junk : GRADS.gold;
    ctx.beginPath(); ctx.roundRect(0, 4, p.w, 11, 3); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 1; ctx.stroke();
    // glossy highlight
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillRect(3, 5.5, p.w - 6, 2);
    // gold bar notches
    if (p.type !== "wood") {
      ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.lineWidth = 1;
      for (let i = 1; i < Math.floor(p.w / 26); i++) {
        ctx.beginPath(); ctx.moveTo(i * 26, 5); ctx.lineTo(i * 26, 14); ctx.stroke();
      }
    } else {
      // junk bond: cracked concrete
      ctx.strokeStyle = "rgba(20,20,25,0.6)"; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(10, 7); ctx.lineTo(24, 10); ctx.moveTo(40, 6); ctx.lineTo(50, 12);
      ctx.moveTo(32, 5); ctx.lineTo(34, 14);
      ctx.stroke();
    }
    // trampoline: a poor soul kneeling, head bowed, both hands raising money
    if (p.type === "net") {
      const cxm = p.w / 2;
      // folded legs tucked on the ground
      ctx.fillStyle = "#4a4a52";
      ctx.beginPath(); ctx.roundRect(cxm + 1, -4, 13, 6, 3); ctx.fill();
      ctx.fillStyle = "#2e2e34"; // worn shoe heel
      ctx.beginPath(); ctx.roundRect(cxm + 11, -4, 4, 5, 1.5); ctx.fill();
      // torso arched forward and down (worn gray shirt)
      ctx.strokeStyle = "#6e6e76"; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(cxm + 7, -4); ctx.quadraticCurveTo(cxm - 1, -13, cxm - 8, -6); ctx.stroke();
      // head bowed toward the ground
      ctx.fillStyle = "#c98c5a";
      ctx.beginPath(); ctx.arc(cxm - 12, -3, 4.5, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#3a2c20"; // hair
      ctx.beginPath(); ctx.arc(cxm - 13, -4.5, 3.6, 2.4, 6.0); ctx.fill();
      // both arms raised straight up, hands gripping the stack
      ctx.strokeStyle = "#c98c5a"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cxm - 4, -10); ctx.lineTo(cxm - 4, -19);
      ctx.moveTo(cxm + 2, -10); ctx.lineTo(cxm + 3, -19);
      ctx.stroke();
      ctx.fillStyle = "#c98c5a";
      ctx.beginPath(); ctx.arc(cxm - 4, -19, 2, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(cxm + 3, -19, 2, 0, 6.28); ctx.fill();
      drawCashStack(cxm, -22);
    }
  } else {
    // ----- lacrosse stick platforms -----
    ctx.fillStyle = p.type === "moving" ? GRADS.platMoving :
                    p.type === "wood" ? GRADS.platWood : GRADS.platNormal;
    ctx.beginPath(); ctx.roundRect(0, 5, PLAT_W - 16, 9, 4); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1; ctx.stroke();

    // butt-end cap and tape wrap on the shaft
    ctx.fillStyle = p.type === "wood" ? "#5e3c1a" : "#d8332a";
    ctx.beginPath(); ctx.roundRect(0, 4, 5, 11, 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fillRect(14, 5, 3, 9);
    ctx.fillRect(20, 5, 3, 9);

    if (p.type === "wood") {
      ctx.strokeStyle = "rgba(60,35,10,0.55)"; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(8, 8); ctx.lineTo(26, 8);
      ctx.moveTo(34, 11); ctx.lineTo(52, 11);
      ctx.moveTo(30, 5); ctx.lineTo(33, 14);
      ctx.stroke();
    }
    if (p.type === "moving") {
      ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1;
      const off = (t * p.vx * 0.8) % 12;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(8 + i * 14 + off, 7); ctx.lineTo(14 + i * 14 + off, 7); ctx.stroke();
      }
    }

    // stick head
    ctx.fillStyle = "#f7f7f7"; ctx.strokeStyle = "#8a8a8a"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(PLAT_W - 16, 1);
    ctx.quadraticCurveTo(PLAT_W + 6, -3, PLAT_W + 2, 9);
    ctx.quadraticCurveTo(PLAT_W + 6, 21, PLAT_W - 16, 17);
    ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = "#c4c4c4"; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(PLAT_W - 13 + i * 5, 2); ctx.lineTo(PLAT_W - 13 + i * 5, 16); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(PLAT_W - 14, 9); ctx.lineTo(PLAT_W + 1, 9); ctx.stroke();

    // trampoline goal on net platforms
    if (p.type === "net") {
      ctx.strokeStyle = "#ff7a1a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(14, 4); ctx.lineTo(14, -20); ctx.lineTo(PLAT_W - 30, -20); ctx.lineTo(PLAT_W - 30, 4); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(14 + i * 8, -20); ctx.lineTo(14 + i * 8, 3); ctx.stroke();
      }
      for (let j = 1; j < 3; j++) {
        ctx.beginPath(); ctx.moveTo(14, -20 + j * 8); ctx.lineTo(PLAT_W - 30, -20 + j * 8); ctx.stroke();
      }
    }
  }

  // portal hovering over the platform (sunset 'sconset bike path on ACK)
  if (p.portal) {
    const sunset = phase === 6;
    const px = PLAT_W / 2, py = -34 + Math.sin(t * 0.07 + p.x) * 2;
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = sunset ? "#ff9d5c" : "#b46cff";
    ctx.beginPath(); ctx.arc(px, py, 25, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = sunset ? "#3a1500" : "#1a0533";
    ctx.beginPath(); ctx.arc(px, py, 12, 0, 6.28); ctx.fill();
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = sunset ? (k % 2 ? "#ffd166" : "#ff7a3c") : (k % 2 ? "#5be1ff" : "#b46cff");
      ctx.lineWidth = 3 - k * 0.5;
      ctx.beginPath();
      ctx.arc(px, py, 17 - k * 4, t * 0.1 + k * 2.1, t * 0.1 + k * 2.1 + 4.2);
      ctx.stroke();
    }
    if (sunset) drawBicycle(px, py); // a little bike pedalling through the sunset
    // sparkle orbiting the portal
    const sx = px + Math.cos(t * 0.13) * 20, sy2 = py + Math.sin(t * 0.13) * 20;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(sx, sy2, 2, 0, 6.28); ctx.fill();

    // label + arrow pointing at it
    const lbl = phase === 6 ? "BIKE TO 'SCONSET" : phase >= 3 ? "LBO OPPORTUNITY" : "SEGUE PIPELINE";
    ctx.font = "bold 11px Arial"; ctx.textAlign = "center";

      ctx.save();

    } else if (p.item === "eagle" && phase >= 3) {

// ---------- Nantucket entity art (seashells, beers, dog, chariot, whales) ----------
// the scallop fan's rim points are fixed geometry — compute them once, not per shell
const SHELL_RIM = (() => {
  const N = 7, hw = 12, r = [];
  for (let i = 0; i <= N; i++) {
    const fx = -hw + 2 * hw * (i / N);
    const fy = -2 - Math.sqrt(Math.max(0, 1 - (fx / hw) * (fx / hw))) * 5.5;
    r.push({ x: fx, y: fy });
  }
  return r;
})();
function drawSeashell(x, y, s) {
  s = s || 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // wide, flat scallop fan: narrow hinge at the bottom, fluted rim up top
  const N = 7, hw = 12, baseY = 6;
  const rim = SHELL_RIM; // precomputed once — identical points for every shell
  const outline = () => {
    ctx.beginPath();
    ctx.moveTo(-3, baseY);
    ctx.quadraticCurveTo(-hw, baseY - 3, rim[0].x, rim[0].y);  // left side flares out
    for (let i = 1; i <= N; i++) {
      const mx = (rim[i - 1].x + rim[i].x) / 2, my = Math.min(rim[i - 1].y, rim[i].y) - 2; // fluted bump
      ctx.quadraticCurveTo(mx, my, rim[i].x, rim[i].y);
    }
    ctx.quadraticCurveTo(hw, baseY - 3, 3, baseY);             // right side back to hinge
    ctx.closePath();
  };
  outline(); ctx.fillStyle = "#f3889d"; ctx.fill();
  // lighter heart fanning from the hinge
  ctx.fillStyle = "rgba(255,224,233,0.5)";
  ctx.beginPath(); ctx.moveTo(0, baseY - 1); ctx.lineTo(-5, -2.5); ctx.lineTo(5, -2.5); ctx.closePath(); ctx.fill();
  // ribs radiating to each lobe
  ctx.strokeStyle = "#dd5a73"; ctx.lineWidth = 0.8;
  for (let i = 0; i <= N; i++) { ctx.beginPath(); ctx.moveTo(0, baseY - 1); ctx.lineTo(rim[i].x * 0.9, rim[i].y + 1); ctx.stroke(); }
  // small hinge umbo (the beak) at the bottom centre
  ctx.fillStyle = "#e06f88";
  ctx.beginPath(); ctx.moveTo(-3, baseY); ctx.lineTo(0, baseY + 2.6); ctx.lineTo(3, baseY); ctx.closePath(); ctx.fill();
  // crisp outline + pearly glint
  outline(); ctx.strokeStyle = "#cf4a64"; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.beginPath(); ctx.arc(-3, -1, 1.2, 0, 6.28); ctx.fill();
  ctx.restore();
}

  ctx.beginPath();

  ctx.moveTo(9, 4); ctx.lineTo(11 - gallop * 3, 9); ctx.lineTo(12 - gallop * 3, 15);
  ctx.stroke();
  // arched neck + head + muzzle
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(8, -3); ctx.quadraticCurveTo(15, -9, 18, -14);
  ctx.lineTo(22, -13); ctx.quadraticCurveTo(17, -5, 12, -1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(18, -15); ctx.lineTo(25, -14); ctx.lineTo(24, -9); ctx.lineTo(18, -10); ctx.closePath(); ctx.fill();
  // ear
  ctx.beginPath(); ctx.moveTo(17, -14); ctx.lineTo(16, -18.5); ctx.lineTo(19.5, -15); ctx.closePath(); ctx.fill();
  // flowing mane
  ctx.strokeStyle = dk; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(9, -4); ctx.quadraticCurveTo(14, -10, 18, -14); ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(6, -3); ctx.quadraticCurveTo(11, -7, 9, 0); ctx.stroke();
  // eye + nostril
  ctx.fillStyle = "#160d05"; ctx.beginPath(); ctx.arc(20, -12, 1, 0, 6.28); ctx.fill();
  ctx.fillStyle = dk; ctx.beginPath(); ctx.arc(24, -11, 0.7, 0, 6.28); ctx.fill();
  ctx.lineCap = "butt";
  ctx.restore();
}

// the one and only lacrosse ball look — used for loose balls AND platform balls
// so they're identical everywhere in the lax level
function drawLaxBall(x, y) {
  ctx.fillStyle = "#ffe34d";
  ctx.beginPath(); ctx.arc(x, y, 8, 0, 6.28); ctx.fill();
  ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.strokeStyle = "rgba(200,168,0,0.7)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x - 2, y, 6, -0.6, 0.9); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.beginPath(); ctx.arc(x - 3, y - 3, 2, 0, 6.28); ctx.fill();
}

function drawCoin(c) {
  const y = c.y - cameraY;
  if (y < -20 || y > H + 20) return;
  const bob = Math.sin(t * 0.1 + c.x) * 3;
  if (phase === 6) { drawSeashell(c.x, y + bob, 1); return; }
  if (phase >= 3) { drawCashStack(c.x, y + bob); return; }
  drawLaxBall(c.x, y + bob);
}

  // helmet: shell in the player's color, white stripe, visor, cage, chin guard

  // chin guard + strap

  ctx.beginPath(); ctx.roundRect(5, -11, 7, 5, 2); ctx.fill();

}

function drawPlayer() {
  const x = player.x, y = player.y - cameraY;

  // eagle carrying the player
  if (player.eagle > 0 && phase < 3) {
    ctx.save();
    ctx.translate(x, y - 48);
    ctx.scale(player.facing, 1);
    const flap = Math.sin(t * 0.45);
    // wings
    ctx.fillStyle = "#6b4a2b";
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.quadraticCurveTo(-30, -10 - flap * 14, -46, -2 - flap * 20);
    ctx.quadraticCurveTo(-27, 9, -6, 6);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(6, 0);
    ctx.quadraticCurveTo(30, -10 - flap * 14, 46, -2 - flap * 20);
    ctx.quadraticCurveTo(27, 9, 6, 6);
    ctx.closePath(); ctx.fill();
    // tail
    ctx.fillStyle = "#5e3f23";
    ctx.beginPath(); ctx.moveTo(-12, 3); ctx.lineTo(-22, 10); ctx.lineTo(-12, 9); ctx.closePath(); ctx.fill();
    // body
    ctx.fillStyle = "#7a5533";
    ctx.beginPath(); ctx.ellipse(0, 3, 14, 8, 0, 0, 6.28); ctx.fill();
    // white head + beak + eye
    ctx.fillStyle = "#f5f5f5";
    ctx.beginPath(); ctx.arc(13, -2, 6.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#f0a929";
    ctx.beginPath(); ctx.moveTo(18, -4); ctx.lineTo(25, -1); ctx.lineTo(18, 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(14, -4, 1.3, 0, 6.28); ctx.fill();
    // talons gripping the player
    ctx.strokeStyle = "#f0a929"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-5, 10); ctx.lineTo(-5, 19); ctx.moveTo(5, 10); ctx.lineTo(5, 19); ctx.stroke();
    ctx.restore();
  }

  if (phase === 4 && farm && farm.chilling) {
    // rocking in the chair, cigar lit
    const gy = farm.ground - cameraY;
    ctx.save();
    ctx.translate(player.x, gy);
    ctx.rotate(Math.sin(t * 0.08) * 0.07);
    ctx.translate(-player.x, -gy);
    drawPlayerSprite(x, y - 4, player.facing);
    ctx.save();
    ctx.translate(x, y - 4);
    ctx.scale(player.facing, 1);
    // a proper cigar: body, band, ash, glowing ember
    ctx.save();
    ctx.translate(5, -14); ctx.rotate(0.12);
    ctx.fillStyle = "#7a4a22";
    ctx.beginPath(); ctx.roundRect(0, -1.8, 11, 3.6, 1.8); ctx.fill();
    ctx.fillStyle = "#caa45e";
    ctx.fillRect(2.5, -1.8, 2, 3.6);
    ctx.fillStyle = "#9aa0a8";
    ctx.fillRect(11, -1.4, 2.2, 2.8);
    ctx.fillStyle = "rgba(255,107,53," + (0.7 + 0.3 * Math.sin(t * 0.3)) + ")";
    ctx.beginPath(); ctx.arc(13.8, 0, 1.6, 0, 6.28); ctx.fill();
    ctx.restore();
    ctx.restore();
    ctx.restore();
  } else if (player.eagle > 0 && (phase === 3 || phase === 5)) {
    // private jet: the player shrinks into it, flies up, then pops back out
    const e = player.eagle;
    const js = e > EAGLE_FRAMES - 12 ? (e - (EAGLE_FRAMES - 12)) / 12   // 1 -> 0 boarding
             : e < 12 ? (12 - e) / 12                                   // 0 -> 1 popping out
             : 0;                                                       // inside the jet
    const jy = y - 8 + Math.sin(t * 0.16) * 1.5;
    const drawShrunk = () => {
      if (js <= 0.03) return;
      ctx.save(); ctx.translate(x, y - 8); ctx.scale(js, js); ctx.translate(-x, -(y - 8));
      drawPlayerSprite(x, y, player.facing); ctx.restore();
    };
    if (e < 12) { drawJetTop(x, jy, 1.0); drawShrunk(); }   // emerge in front
    else { drawShrunk(); drawJetTop(x, jy, 1.0); }          // board behind
  } else if (player.eagle > 0 && phase === 6) {
    // the whole rig (rider + carriage + horses) tilts up together, leaning the
    // way you steer — up-right facing right, up-left facing left (like the stick
    // switching hands). The car is drawn after the rider so it wraps the legs.
    const f = player.facing;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(f, 1);
    ctx.rotate(-0.7);
    drawPlayerSprite(0, 0, 1);
    drawChariot(0, 6, 1.05);
    ctx.restore();
  } else {
    drawPlayerSprite(x, y, player.facing);
  }

  // carrying an egg home
  if (phase === 4 && farm && farm.carrying) {
    const ex = x + player.facing * 17, ey = y + 3;
    ctx.fillStyle = farm.carrying.golden ? "#ffd23b" : "#fdfdf5";
    ctx.beginPath(); ctx.ellipse(ex, ey, 5.5, 7, 0, 0, 6.28); ctx.fill();
    ctx.strokeStyle = farm.carrying.golden ? "#c8a020" : "#ccc"; ctx.lineWidth = 1; ctx.stroke();
  }

  // the golden retriever bounding alongside you on a leash, guarding you
  if (player.shield > 0 && phase === 6) {
    const fade = player.shield < 120 ? (Math.sin(t * 0.4) * 0.4 + 0.6) : 1;
    const f = player.facing;
    const dogX = x - f * 21, dogY = y + 3 + Math.sin(t * 0.4) * 3;
    ctx.globalAlpha = 0.12 * fade; // protective aura
    ctx.fillStyle = "#f4c869";
    ctx.beginPath(); ctx.arc(x, y - 2, 38, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "rgba(120,80,40,0.8)"; ctx.lineWidth = 1.4; // leash
    ctx.beginPath(); ctx.moveTo(x - f * 12, y + 4); ctx.quadraticCurveTo(dogX + f * 6, (y + dogY) / 2, dogX + f * 9, dogY - 4); ctx.stroke();
    ctx.globalAlpha = fade;
    drawDog(dogX, dogY, 0.95, f);
    ctx.globalAlpha = 1;
  }

  // the Peter Millar vest, worn over the suit while the shield is active —
  // quilted, with a glow that hugs the vest's own shape
  if (player.shield > 0 && phase >= 3 && phase !== 6) {
    const fade = player.shield < 120 ? (Math.sin(t * 0.4) * 0.4 + 0.6) : 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(player.facing, 1);
    ctx.globalAlpha = fade;
    // body with contoured glow
    ctx.shadowColor = "rgba(91,225,255," + (0.85 * fade) + ")";
    ctx.shadowBlur = 11 + Math.sin(t * 0.15) * 4;
    ctx.fillStyle = "#21406b";
    vestPath(ctx); ctx.fill();
    ctx.shadowBlur = 0;
    // quilted puffer stitching
    ctx.save();
    vestPath(ctx); ctx.clip();
    ctx.strokeStyle = "rgba(160,200,240,0.65)"; ctx.lineWidth = 1;
    for (let q = -4; q <= 12; q += 4) {
      ctx.beginPath(); ctx.moveTo(-11, q); ctx.quadraticCurveTo(0, q + 1.5, 11, q); ctx.stroke();
    }
    ctx.restore();
    // collar + zipper + pull
    ctx.strokeStyle = "#cfd8e8"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-4, -10.5); ctx.lineTo(0, -5.5); ctx.lineTo(4, -10.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -5.5); ctx.lineTo(0, 14); ctx.stroke();
    ctx.fillStyle = "#cfd8e8";
    ctx.fillRect(-1.2, -2, 2.4, 3.5);
    // bright rim tracing the vest outline
    ctx.strokeStyle = "rgba(155,235,255," + (0.8 * fade) + ")"; ctx.lineWidth = 1.5;
    vestPath(ctx); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // loaded ammo: seashell (ACK / box) / cash in hand (PE) / ball in stick (lax)
  if (ammo > 0 && phase !== 4) {
    if (phase === 6) {
      ctx.save();
      ctx.translate(x + player.facing * 18, y + 3);
      ctx.scale(0.85, 0.85);
      drawSeashell(0, 0, 1);
      ctx.restore();
    } else if (phase >= 3) {
      ctx.save();
      ctx.translate(x + player.facing * 18, y + 4);
      ctx.scale(0.7, 0.7);
      drawCashStack(0, 0);
      ctx.restore();
    } else {
      ctx.fillStyle = "#ffe34d";
      ctx.beginPath(); ctx.arc(x + player.facing * 28, y - 31, 4.5, 0, 6.28); ctx.fill();
      ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  // force field bubble (lacrosse phases)
  if (player.shield > 0 && phase < 3) {
    const fade = player.shield < 120 ? (Math.sin(t * 0.4) * 0.5 + 0.5) : 1;
    const r = 40 + Math.sin(t * 0.15) * 2;
    ctx.globalAlpha = 0.16 * fade;
    ctx.fillStyle = "#5be1ff";
    ctx.beginPath(); ctx.arc(x, y - 4, r, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 0.75 * fade;
    ctx.strokeStyle = "#9aefff"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y - 4, r, 0, 6.28); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawDefender(d) {
  const x = d.x, y = d.y - cameraY;
  if (y < -50 || y > H + 50) return;
  const swing = Math.sin(d.t * 2) * 0.22;
  ctx.save();
  ctx.translate(x, y);

  if (phase === 6) {
    // ----- a blue whale: wider than the other monsters, but not as tall -----
    ctx.scale(1.42, 1.42); // larger
    // tail flukes (left)
    ctx.fillStyle = "#356094";
    ctx.beginPath();
    ctx.moveTo(-17, -3); ctx.quadraticCurveTo(-27, -1, -31, -6);
    ctx.lineTo(-28, 0); ctx.lineTo(-31, 6); ctx.quadraticCurveTo(-27, 1, -17, 3); ctx.closePath(); ctx.fill();
    // body
    ctx.fillStyle = "#3f73a8";
    ctx.beginPath(); ctx.ellipse(0, 0, 21, 8.5, 0, 0, 6.28); ctx.fill();
    // lighter belly + ventral grooves
    ctx.fillStyle = "#bcd6ea";
    ctx.beginPath(); ctx.ellipse(2, 4.4, 15, 3.4, 0, 0, 3.14); ctx.fill();
    ctx.strokeStyle = "rgba(40,70,110,0.35)"; ctx.lineWidth = 0.7;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 4 + 4, 1.5); ctx.lineTo(i * 4 + 4, 6); ctx.stroke(); }
    // dorsal + pectoral fins
    ctx.fillStyle = "#356094";
    ctx.beginPath(); ctx.moveTo(-2, -8); ctx.lineTo(-7, -14); ctx.lineTo(3, -8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6, 5); ctx.lineTo(2, 12); ctx.lineTo(12, 7); ctx.closePath(); ctx.fill();
    // mouth line + eye (head on the right)
    ctx.strokeStyle = "rgba(28,52,86,0.55)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(8, 3.5); ctx.quadraticCurveTo(16, 4.5, 20.5, 1); ctx.stroke();
    ctx.fillStyle = "#0a1a2a"; ctx.beginPath(); ctx.arc(14, -1.5, 1.6, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(14.6, -2, 0.5, 0, 6.28); ctx.fill();
    // blowhole spout
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1.4;
    const sp = 3 + Math.sin(t * 0.2) * 1.6;
    ctx.beginPath(); ctx.moveTo(8, -8); ctx.lineTo(6, -8 - sp); ctx.moveTo(8, -8); ctx.lineTo(10, -8 - sp); ctx.stroke();
    // red target reticle (wide, matching the whale)
    const pw = 0.45 + 0.3 * Math.sin(t * 0.18);
    ctx.globalAlpha = ammo > 0 ? pw + 0.25 : pw * 0.6;
    ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 14, 0, 0, 6.28); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.lineTo(0, -10);
    ctx.moveTo(0, 10); ctx.lineTo(0, 20);
    ctx.moveTo(-30, 0); ctx.lineTo(-20, 0);
    ctx.moveTo(20, 0); ctx.lineTo(30, 0);
    ctx.stroke();
    ctx.fillStyle = "#ff3b30"; ctx.beginPath(); ctx.arc(0, 0, 2, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }

  if (phase >= 3) {
    // ----- a public firm: a plain office tower -----
    // tower
    ctx.fillStyle = GRADS.building;
    ctx.beginPath(); ctx.roundRect(-13, -20, 26, 40, 2); ctx.fill();
    ctx.strokeStyle = "#3c3f46"; ctx.lineWidth = 1.5; ctx.stroke();
    // rooftop ledge + antenna
    ctx.fillStyle = "#3c3f46";
    ctx.fillRect(-14, -21, 28, 3);
    ctx.beginPath(); ctx.moveTo(0, -21); ctx.lineTo(0, -28); ctx.stroke();
    ctx.fillStyle = "#d8332a";
    ctx.beginPath(); ctx.arc(0, -29, 1.8, 0, 6.28); ctx.fill();
    // lit windows
    for (let r = 0; r < 5; r++) for (let cI = 0; cI < 3; cI++) {
      ctx.fillStyle = hash(r * 3 + cI + d.y) < 0.5 ? "#ffd23b" : "#2b2e35";
      ctx.fillRect(-10 + cI * 7.5, -16 + r * 6, 5, 4);
    }
    // PUBLIC sign over the entrance
    ctx.fillStyle = "#16244a";
    ctx.fillRect(-11, 14, 22, 6);
    ctx.fillStyle = "#5be1ff"; ctx.font = "bold 5.5px Arial"; ctx.textAlign = "center";
    ctx.fillText("PUBLIC", 0, 18.8);

    // red target reticle — same as ever
    const pulse2 = 0.45 + 0.3 * Math.sin(t * 0.18);
    ctx.globalAlpha = ammo > 0 ? pulse2 + 0.25 : pulse2 * 0.6;
    ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, 6.28); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -23); ctx.lineTo(0, -13);
    ctx.moveTo(0, 13); ctx.lineTo(0, 23);
    ctx.moveTo(-23, 0); ctx.lineTo(-13, 0);
    ctx.moveTo(13, 0); ctx.lineTo(23, 0);
    ctx.stroke();
    ctx.fillStyle = "#ff3b30";
    ctx.beginPath(); ctx.arc(0, 0, 2, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }

  // long defensive pole (swinging)
  ctx.save();
  ctx.rotate(swing);
  ctx.strokeStyle = "#b5b5b5"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-32, 5); ctx.lineTo(32, -3); ctx.stroke();
  ctx.strokeStyle = "#eee"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(35, -4, 5, 8, 1.4, 0, 6.28); ctx.stroke();
  ctx.restore();

  // legs
  ctx.strokeStyle = "#e8b88a"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-4, 14); ctx.lineTo(-7, 22); ctx.moveTo(4, 14); ctx.lineTo(7, 22); ctx.stroke();

  // jersey
  ctx.fillStyle = GRADS.defJersey;
  ctx.beginPath(); ctx.roundRect(-11, -7, 22, 21, 5); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 10px Arial"; ctx.textAlign = "center";
  ctx.fillText("X", 0, 8);

  // helmet
  ctx.fillStyle = "#dfe3ec";
  ctx.beginPath(); ctx.arc(0, -15, 9, 0, 6.28); ctx.fill();
  ctx.strokeStyle = "#888"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "#2b2b34";
  ctx.beginPath(); ctx.roundRect(-9, -19, 9, 5, 2); ctx.fill();
  ctx.strokeStyle = "#16244a"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, -15, 8.5, -2.4, -0.7); ctx.stroke();

  // red target reticle — tap to shoot when you have a ball loaded
  const pulse = 0.45 + 0.3 * Math.sin(t * 0.18);
  ctx.globalAlpha = ammo > 0 ? pulse + 0.25 : pulse * 0.6;
  ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -2, 15, 0, 6.28); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -21); ctx.lineTo(0, -13);
  ctx.moveTo(0, 9); ctx.lineTo(0, 17);
  ctx.moveTo(-19, -2); ctx.lineTo(-11, -2);
  ctx.moveTo(11, -2); ctx.lineTo(19, -2);
  ctx.stroke();
  ctx.fillStyle = "#ff3b30";
  ctx.beginPath(); ctx.arc(0, -2, 2, 0, 6.28); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawShots() {
  for (const s of shots) {
    const y = s.y - cameraY;
    if (phase === 6) {
      ctx.save(); ctx.translate(s.x, y); ctx.rotate(t * 0.3); drawSeashell(0, 0, 0.9); ctx.restore();
      continue;
    }
    if (phase >= 3) {
      ctx.save();
      ctx.translate(s.x, y);
      ctx.rotate(t * 0.3);
      ctx.scale(0.7, 0.7);
      drawCashStack(0, 4);
      ctx.restore();
      continue;
    }
    ctx.fillStyle = "#ffe34d";
    ctx.beginPath(); ctx.arc(s.x, y, 5, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = "rgba(255,227,77,0.5)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(s.x - s.vx, y - s.vy); ctx.lineTo(s.x - s.vx * 2.2, y - s.vy * 2.2); ctx.stroke();
  }
}

// ---------- Boss arena drawing ----------
function drawBoss() {
  if (!boss) return;
  const x = boss.x, y = boss.y + boss.yOff - cameraY;
  ctx.save();
  ctx.translate(x, y);
  const f = player.x < boss.x ? -1 : 1;
  ctx.scale(1.8 * f, 1.8);

  if (boss.kind === "box") {
    // ----- the Chicken Box bouncer: huge, black tee, shades, goatee -----
    // legs + boots
    ctx.strokeStyle = "#2a2a2e"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-5, 14); ctx.lineTo(-7, 26); ctx.moveTo(5, 14); ctx.lineTo(8, 25); ctx.stroke();
    ctx.fillStyle = "#141418";
    ctx.beginPath(); ctx.roundRect(-14, 25, 11, 5, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(5, 24, 11, 5, 2); ctx.fill();
    // massive torso (black tee)
    ctx.fillStyle = "#1a1a1f";
    ctx.beginPath();
    ctx.moveTo(-15, -10); ctx.quadraticCurveTo(-18, -13, -12, -13);
    ctx.lineTo(12, -13); ctx.quadraticCurveTo(18, -13, 15, -10);
    ctx.lineTo(13, 16); ctx.lineTo(-13, 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#3a3a42"; ctx.fillRect(-9, -4, 18, 2); // staff lanyard badge
    ctx.fillStyle = "#c0c4cc"; ctx.fillRect(-3, -3, 6, 4);
    // thick arms — left out, right cocked back with a bottle
    ctx.strokeStyle = "#caa07a"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-13, -7); ctx.lineTo(-23, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13, -7); ctx.lineTo(21, -14); ctx.stroke();
    ctx.fillStyle = "#caa07a";
    ctx.beginPath(); ctx.arc(-24, -2, 3, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(22, -15, 3, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#3a6b3a"; // bottle in hand
    ctx.beginPath(); ctx.roundRect(21, -21, 3, 7, 1.5); ctx.fill();
    // neck + bald head
    ctx.fillStyle = "#caa07a"; ctx.fillRect(-3, -13, 6, 4);
    ctx.beginPath(); ctx.arc(0, -18, 9, 0, 6.28); ctx.fill();
    // shades + stern brow + goatee
    ctx.fillStyle = "#0a0a0c";
    ctx.beginPath(); ctx.roundRect(-7, -20, 6, 4, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(1, -20, 6, 4, 2); ctx.fill();
    ctx.strokeStyle = "#0a0a0c"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-1, -19); ctx.lineTo(1, -19); ctx.stroke();
    ctx.fillStyle = "#2a2018"; ctx.beginPath(); ctx.arc(0, -11, 2.6, 0, 3.14); ctx.fill();
    ctx.strokeStyle = "#222"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(8, -18); ctx.lineTo(9, -13); ctx.stroke(); // earpiece
  } else {
    // ----- the PE boss: charcoal suit, red power tie, lacrosse stick -----
    ctx.strokeStyle = "#15151b"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-4, 14); ctx.lineTo(-7, 25); ctx.moveTo(4, 14); ctx.lineTo(8, 24); ctx.stroke();
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.roundRect(-13, 25, 9, 4, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(5, 23, 9, 4, 2); ctx.fill();
    ctx.fillStyle = GRADS.suit;
    ctx.beginPath(); ctx.roundRect(-12, -9, 24, 26, 5); ctx.fill();
    ctx.fillStyle = "#f2f2f2";
    ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(3, -8); ctx.lineTo(2, 9); ctx.lineTo(-2, 9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#b3221b";
    ctx.beginPath(); ctx.moveTo(-1.5, -7); ctx.lineTo(1.5, -7); ctx.lineTo(1, 7); ctx.lineTo(0, 9); ctx.lineTo(-1, 7); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#15151b"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(9, -3); ctx.lineTo(16, -10); ctx.stroke();
    ctx.strokeStyle = "#b5b5b5"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(22, -22); ctx.stroke();
    ctx.strokeStyle = "#eee"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(24, -27, 5, 8, 0.45, 0, 6.28); ctx.stroke();
    ctx.fillStyle = "#e3b491";
    ctx.beginPath(); ctx.arc(0, -17, 9.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#9aa0a8";
    ctx.beginPath(); ctx.arc(0, -19, 9.5, 3.34, 6.0); ctx.fill();
    ctx.fillStyle = "#0a0a0c";
    ctx.beginPath(); ctx.roundRect(-1, -20, 6, 5, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(6, -20, 6, 5, 2); ctx.fill();
    ctx.strokeStyle = "#111"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(2, -11); ctx.lineTo(8, -12); ctx.stroke();
  }

  // white flash when hit
  if (boss.flash > 0) {
    ctx.globalAlpha = boss.flash / 10 * 0.6;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(0, -2, 26, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // target reticle on the boss
  const pulse = 0.45 + 0.3 * Math.sin(t * 0.18);
  ctx.globalAlpha = ammo > 0 ? pulse + 0.25 : pulse * 0.6;
  ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(x, y - 4, 34, 0, 6.28); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y - 46); ctx.lineTo(x, y - 30);
  ctx.moveTo(x, y + 22); ctx.lineTo(x, y + 38);
  ctx.moveTo(x - 46, y - 4); ctx.lineTo(x - 30, y - 4);
  ctx.moveTo(x + 30, y - 4); ctx.lineTo(x + 46, y - 4);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawBossHUD() {
  if (!boss) return;
  const box = boss.kind === "box";
  const hp = boss.maxHp || BOSS_HP;
  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
  ctx.fillText(box ? "THE BOUNCER" : "PRIVATE EQUITY", W / 2, 56);
  const bw = 200, bx = W / 2 - bw / 2, byy = 62;
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(bx - 2, byy - 2, bw + 4, 12);
  for (let i = 0; i < hp; i++) {
    ctx.fillStyle = i < boss.hp ? (box ? "#5be1ff" : "#d8332a") : "rgba(255,255,255,0.15)";
    ctx.fillRect(bx + i * (bw / hp) + 0.5, byy, bw / hp - 1, 8);
  }
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "11px Arial";
  ctx.fillText(box ? "grab money · tap him to throw · 20 hits"
                   : "grab balls · tap him to shoot · 10 hits", W / 2, 86);
}

function drawBossShots() {
  // red so they read instantly as hostile (yours are yellow / seashell)
  for (const b of bossShots) {
    const y = b.y - cameraY;
    ctx.fillStyle = "#e84a3a"; // red, same as the PE boss (rings included)
    ctx.beginPath(); ctx.arc(b.x, y, 7, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "#8f1812"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath(); ctx.arc(b.x - 2, y - 2, 2, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "rgba(232,74,58,0.45)"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(b.x - b.vx * 2, y - b.vy * 2); ctx.lineTo(b.x - b.vx * 5, y - b.vy * 5); ctx.stroke();
  }
}

function drawPickups() {
  for (const c of pickups) {
    const y = c.y - cameraY + Math.sin(t * 0.1 + c.x) * 3;
    if (phase === 5) { drawCashStack(c.x, y); continue; } // money at the Chicken Box
    ctx.fillStyle = "#ffe34d";
    ctx.beginPath(); ctx.arc(c.x, y, 8, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath(); ctx.arc(c.x - 3, y - 3, 2, 0, 6.28); ctx.fill();
  }
}

function drawParticles() {
  for (const q of parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y - cameraY, q.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloats() {
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    ctx.font = "bold " + f.size + "px Arial"; ctx.textAlign = "center";
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(20,40,20,0.8)";
    ctx.strokeText(f.txt, f.x, f.y - cameraY);
    ctx.fillStyle = "#fff";
    ctx.fillText(f.txt, f.x, f.y - cameraY);
  }
  ctx.globalAlpha = 1;
}

// ---------- HUD & overlays ----------
function drawHUD() {
  ctx.fillStyle = "rgba(10,20,12,0.35)";
  ctx.fillRect(0, 0, W, 38);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px Arial"; ctx.textAlign = "left";
  ctx.fillText("🥍 " + score, 12, 27);
  ctx.textAlign = "right";
  ctx.font = "13px Arial"; ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.fillText("BEST " + best, W - 44, 25);
  // pause button
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillRect(W - 30, 11, 5, 16);
  ctx.fillRect(W - 20, 11, 5, 16);

  // retire button on the farm
  if (phase === 4) {
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.beginPath(); ctx.roundRect(8, 46, 66, 24, 7); ctx.fill();
    ctx.strokeStyle = "#b3402e"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = "#b3402e";
    ctx.font = "bold 13px Arial"; ctx.textAlign = "center";
    ctx.fillText("RETIRE", 41, 63);
  }

  // ammo loaded: balls (lax) / cash stacks (PE) / seashells (ACK)
  for (let i = 0; i < (phase === 4 ? 0 : ammo); i++) {
    const ax = W / 2 - (MAX_AMMO - 1) * 8 + i * 16;
    if (phase === 6) {
      ctx.save(); ctx.translate(ax, 20); ctx.scale(0.7, 0.7); drawSeashell(0, 0, 1); ctx.restore();
    } else if (phase >= 3) {
      ctx.save(); ctx.translate(ax, 21); ctx.scale(0.6, 0.6); drawCashStack(0, 4); ctx.restore();
    } else {
      ctx.fillStyle = "#ffe34d";
      ctx.beginPath(); ctx.arc(ax, 19, 6, 0, 6.28); ctx.fill();
      ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  if (phase === 2 || phase === 5) drawBossHUD();

  // active power-up bars
  let by = 48;
  if (player && player.shield > 0) {
    ctx.fillStyle = "rgba(91,225,255,0.9)";
    ctx.font = "13px Arial"; ctx.textAlign = "left";
    ctx.fillText(phase === 6 ? "🐕" : "🛡", 10, by + 4);
    const sc = phase === 6 ? "#f4c869" : "#5be1ff";
    ctx.fillStyle = "rgba(91,225,255,0.4)"; ctx.fillRect(30, by - 5, 70, 7);
    ctx.fillStyle = sc; ctx.fillRect(30, by - 5, 70 * player.shield / SHIELD_FRAMES, 7);
    by += 20;
  }
  if (player && player.eagle > 0) {
    ctx.font = "13px Arial"; ctx.textAlign = "left"; ctx.fillStyle = "#caa472";
    ctx.fillText(phase === 6 ? "🐎" : phase >= 3 ? "✈️" : "🦅", 10, by + 4);
    ctx.fillStyle = "rgba(122,85,51,0.4)"; ctx.fillRect(30, by - 5, 70, 7);
    ctx.fillStyle = "#a87b46"; ctx.fillRect(30, by - 5, 70 * player.eagle / EAGLE_FRAMES, 7);
  }

  // a one-time nudge for the tap controls (tilt was removed)
  if (isTouch && score < 500 && phase === 1) {
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.font = "13px Arial"; ctx.textAlign = "center";
    ctx.fillText("tap left / right to move — tap defenders to shoot", W / 2, H - 16);
  }
}

function bigText(txt, x, y, size, fill, stroke) {
  ctx.font = "900 " + size + "px Arial";
  ctx.textAlign = "center";
  ctx.lineJoin = "round"; // miter joins grew spikes off letters like M
  if (stroke) { ctx.lineWidth = size / 9; ctx.strokeStyle = stroke; ctx.strokeText(txt, x, y); }
  ctx.fillStyle = fill;
  ctx.fillText(txt, x, y);
}

function drawMenuButton(cx, cy, kind) {
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.beginPath(); ctx.arc(cx, cy, 19, 0, 6.28); ctx.fill();
  ctx.strokeStyle = "#14532d"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#14532d";
  if (kind === "gear") {
    for (let i = 0; i < 8; i++) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(i * Math.PI / 4);
      ctx.fillRect(-2.2, -11.5, 4.4, 5);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cx, cy, 7.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.beginPath(); ctx.arc(cx, cy, 3.4, 0, 6.28); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy - 4.5, 4.8, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy + 10.5, 8.2, Math.PI, 0); ctx.fill();
  }
}

function menuPanel(title) {
  ctx.fillStyle = "rgba(8,30,16,0.82)";
  ctx.fillRect(0, 0, W, H);
  bigText(title, W / 2, 92, 38, "#ffd23b", "#7a4d00");
}

function menuRow(y, label, value) {
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  ctx.beginPath(); ctx.roundRect(18, y - 22, W - 36, 44, 10); ctx.fill();
  ctx.font = "bold 15px Arial"; ctx.textAlign = "left";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillText(label, 32, y + 5);
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffd23b";
  ctx.fillText(value, W - 32, y + 5);
}

function doneButton(y) {
  ctx.fillStyle = "#ffd23b";
  ctx.beginPath(); ctx.roundRect(W / 2 - 60, y - 24, 120, 42, 12); ctx.fill();
  ctx.fillStyle = "#14532d";
  ctx.font = "bold 18px Arial"; ctx.textAlign = "center";
  ctx.fillText("DONE", W / 2, y + 3);
}

function drawSettings() {
  menuPanel("SETTINGS");
  menuRow(SET_ROWS[0], "USERNAME", settings.name);
  menuRow(SET_ROWS[1], "SOUND FX", settings.sfx ? "ON" : "OFF");
  menuRow(SET_ROWS[2], "MUSIC", settings.music ? "ON" : "OFF");
  menuRow(SET_ROWS[3], "SPEED", settings.speed);
  doneButton(472);
}

function charRow(y, label, value, swatch) {
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  ctx.beginPath(); ctx.roundRect(18, y - 16, W - 36, 32, 8); ctx.fill();
  ctx.font = "bold 13px Arial"; ctx.textAlign = "left";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillText(label, 30, y + 4);
  ctx.fillStyle = "#ffd23b";
  ctx.font = "bold 17px Arial"; ctx.textAlign = "center";
  ctx.fillText("◀", 190, y + 6);
  ctx.fillText("▶", 360, y + 6);
  if (swatch) {
    ctx.fillStyle = value;
    ctx.beginPath(); ctx.roundRect(258, y - 9, 36, 18, 5); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
  } else {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px Arial";
    ctx.fillText(value, 276, y + 5);
  }
}

function drawCharacter() {
  menuPanel("YOUR PLAYER");
  ctx.save();
  ctx.translate(W / 2 - 10, 158);
  ctx.scale(1.85, 1.85);
  drawPlayerSprite(0, 0, 1);
  ctx.restore();
  charRow(CHAR_ROWS[0], "HAIR", charCfg.hair, false);
  charRow(CHAR_ROWS[1], "NUMBER", "" + charCfg.num, false);
  charRow(CHAR_ROWS[2], "JERSEY", charCfg.jersey, true);
  charRow(CHAR_ROWS[3], "HELMET", charCfg.helmet, true);
  charRow(CHAR_ROWS[4], "GLOVES", charCfg.gloves, true);
  charRow(CHAR_ROWS[5], "STICK", charCfg.stick, true);
  charRow(CHAR_ROWS[6], "SHORTS", charCfg.shorts, true);
  charRow(CHAR_ROWS[7], "SHOES", charCfg.shoes, true);
  doneButton(540);
}

function drawPaused() {
  ctx.fillStyle = "rgba(8,30,16,0.7)";
  ctx.fillRect(0, 0, W, H);
  bigText("PAUSED", W / 2, 240, 50, "#fff", "#14532d");
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.font = "16px Arial"; ctx.textAlign = "center";
  ctx.fillText("tap anywhere to resume", W / 2, 300);
  drawHomeButton();
}

function drawHomeButton() {
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.beginPath(); ctx.roundRect(HOME_BTN.x, HOME_BTN.y, HOME_BTN.w, HOME_BTN.h, 10); ctx.fill();
  ctx.fillStyle = "#14532d";
  ctx.font = "bold 17px Arial"; ctx.textAlign = "center";
  ctx.fillText("🏠 HOME", W / 2, HOME_BTN.y + 24);
}

function drawTitle() {
  ctx.fillStyle = "rgba(8,30,16,0.5)";
  ctx.fillRect(0, 0, W, H);

  const bob = Math.sin(t * 0.06) * 5;
  bigText("LAX", W / 2, 175 + bob * 0.4, 76, "#fff", "#14532d");
  bigText("JUMP", W / 2, 243 + bob * 0.4, 56, "#ffd23b", "#7a4d00");
  ctx.fillStyle = "#d4af37";
  ctx.font = "bold 15px Arial"; ctx.textAlign = "center";
  ctx.fillText("the final pipeline", W / 2, 272);

  // sprite is right-heavy (the stick), so nudge left to center its visual mass
  drawPlayerSprite(W / 2 - 9, 350 + bob, 1);

  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 0.12);
  bigText("TAP TO PLAY", W / 2, 490, 26, "#fff", "#14532d");
  ctx.globalAlpha = 1;

  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.font = "13px Arial"; ctx.textAlign = "center";
  ctx.fillText(settings.name + "  ·  best " + best, W / 2, 538);

  drawMenuButton(W - 78, 38, "gear");
  drawMenuButton(W - 32, 38, "person");
}

function drawRetired() {
  ctx.fillStyle = "rgba(8,30,16,0.6)";
  ctx.fillRect(0, 0, W, H);
  bigText("CONGRATULATIONS,", W / 2, 195, 30, "#fff", "#14532d");
  bigText("YOU RETIRED!", W / 2, 245, 42, "#ffd23b", "#7a4d00");
  ctx.font = "26px Arial"; ctx.textAlign = "center";
  ctx.fillText("🪑🌅🦢", W / 2, 300);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 30px Arial";
  ctx.fillText(score + "", W / 2, 360);
  ctx.font = "15px Arial"; ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillText("career earnings", W / 2, 385);
  if (newBest) {
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 0.2);
    bigText("🏆 NEW RECORD!", W / 2, 430, 24, "#ffd23b");
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 0.12);
  bigText("TAP FOR HOME SCREEN", W / 2, 500, 22, "#fff", "#14532d");
  ctx.globalAlpha = 1;
}

function drawGameOver() {
  ctx.fillStyle = "rgba(8,30,16,0.72)";
  ctx.fillRect(0, 0, W, H);

  // shrink the title until it fits the screen ("YOU DON'T BELONG HERE" is wide)
  let ts = overTitle.length > 10 ? 34 : 44;
  ctx.font = "900 " + ts + "px Arial";
  while (ts > 16 && ctx.measureText(overTitle).width > W - 36) { ts--; ctx.font = "900 " + ts + "px Arial"; }
  bigText(overTitle, W / 2, 104, ts, "#ffd23b", "#7a2d00");
  ctx.fillStyle = "#fff";
  ctx.font = "bold 24px Arial"; ctx.textAlign = "center";
  ctx.fillText("this round: " + score, W / 2, 146);

  // the career stats
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.font = "bold 14px Arial";
  ctx.fillText("🦑 " + stats.squids + " squids    🏢 " + stats.acq + " acquired    💰 $" +
               stats.cash.toLocaleString("en-US"), W / 2, 176);

  if (newBest) {
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 0.2);
    bigText("🏆 NEW RECORD!", W / 2, 205, 20, "#ffd23b");
    ctx.globalAlpha = 1;
  }

  // top 5 board
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  ctx.beginPath(); ctx.roundRect(40, 220, W - 80, 176, 12); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "bold 13px Arial";
  ctx.fillText("— TOP 5 —", W / 2, 242);
  for (let i = 0; i < 5; i++) {
    const e = lastBoard[i];
    const ry = 270 + i * 25;
    const mine = i === lastRank;
    ctx.font = mine ? "bold 15px Arial" : "14px Arial";
    ctx.fillStyle = mine ? "#ffd23b" : "rgba(255,255,255,0.85)";
    ctx.textAlign = "left";
    ctx.fillText((mine ? "► " : "   ") + (i + 1) + ".  " + (e ? e.n : "—"), 58, ry);
    ctx.textAlign = "right";
    ctx.fillText(e ? "" + e.s : "—", W - 58, ry);
  }
  if (lastRank < 0) {
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.font = "12px Arial"; ctx.textAlign = "center";
    ctx.fillText("this round didn't crack the top 5 — next play", W / 2, 413);
  }

  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 0.12);
  bigText("TAP SCREEN TO PLAY AGAIN", W / 2, 444, 19, "#fff", "#14532d");
  ctx.globalAlpha = 1;
  drawHomeButton();
}

// ---------- Main draw ----------
function draw() {
  drawBackground();
  if (state !== "title") {
    for (const c of coins) drawCoin(c);
    for (const p of platforms) drawPlatform(p);
    for (const d of defenders) drawDefender(d);
    if (phase === 2 || phase === 5) { drawPickups(); drawBoss(); drawBossShots(); }
    if (phase === 4 && farm) for (const g of farm.geese) drawGoose(g);
    drawShots();
    drawParticles();
    drawPlayer();
    drawFloats();
    drawHUD();
    if (callOut && state === "playing") {
      ctx.globalAlpha = clamp(callOut.life / 20, 0, 1);
      // shrink long callouts so they never run off the screen
      const cs = Math.min(34, Math.floor((W - 36) / (callOut.txt.length * 0.62)));
      bigText(callOut.txt, W / 2, 160, cs, "#ffd23b", "#7a2d00");
      ctx.globalAlpha = 1;
    }
  }
  if (state === "title") drawTitle();
  if (state === "gameover") drawGameOver();
  if (state === "retired") drawRetired();
  if (state === "paused") drawPaused();
  if (state === "settings") drawSettings();
  if (state === "character") drawCharacter();
}

// ---------- Loop ----------
// Fixed timestep: game logic always runs at 60 steps/sec regardless of the
// display refresh rate (120Hz phones were running double speed; slow frames
// were slowing the game down instead of staying constant).
const STEP = 1000 / 60;
let lastT = 0, acc = 0;
function loop(now) {
  if (now === undefined) now = lastT + STEP;
  let dt = now - lastT;
  lastT = now;
  if (dt < 0) dt = 0;
  if (dt > 250) dt = 250; // tab was backgrounded; don't fast-forward
  acc += dt * (SPEEDS[settings.speed] || 1);
  let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n === 5) acc = 0; // device can't catch up: drop the backlog, stay smooth
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);

// debug/test hook (harmless in production)
window.__lax3 = {
  getPhase: () => phase,
  getState: () => state,
  getBossHp: () => boss ? boss.hp : -1,
  jumpTo: alt => {
    if (state !== "playing") return;
    cameraY = -alt;
    player.y = cameraY + 200;
    player.vy = 0;
    score = Math.max(score, Math.floor(alt));
    platforms.push(newPlatform(clamp(player.x - PLAT_W / 2, 8, W - PLAT_W - 8), player.y + 60, "normal"));
  },
  forceWin: () => { if ((phase === 2 || phase === 5) && boss && !boss.dead) defeatBoss(); },
  giveAmmo: () => { ammo = MAX_AMMO; },
  giveEagle: () => { if (player) player.eagle = EAGLE_FRAMES; },
  giveShield: () => { if (player) player.shield = SHIELD_FRAMES; },
};

})();
</script>
