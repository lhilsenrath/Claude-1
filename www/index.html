<div id="wrap"><canvas id="game"></canvas></div>
<script>
(() => {
"use strict";

// ---------- Canvas setup ----------
const W = 400, H = 640;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

if (typeof CanvasRenderingContext2D !== "undefined" &&
    !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (typeof r === "number") r = [r, r, r, r];
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y); this.arcTo(x + w, y, x + w, y + r[1], r[1]);
    this.lineTo(x + w, y + h - r[2]); this.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
    this.lineTo(x + r[3], y + h); this.arcTo(x, y + h, x, y + h - r[3], r[3]);
    this.lineTo(x, y + r[0]); this.arcTo(x, y, x + r[0], y, r[0]);
    return this;
  };
}

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  // cap pixel density at 2x: 3x retina more than doubles the pixels drawn
  // per frame for no visible gain in this art style
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W * scale + "px";
  canvas.style.height = H * scale + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();

// gradients are position-independent (local coords), so build them once
const GRADS = (() => {
  const mk = (y0, y1, c0, c1) => {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, c0); g.addColorStop(1, c1);
    return g;
  };
  const stick = ctx.createLinearGradient(12, 8, 26, -24);
  stick.addColorStop(0, "#9a9a9a"); stick.addColorStop(1, "#d8d8d8");
  return {
    platNormal: mk(5, 14, "#e8e8e8", "#9d9d9d"),
    platMoving: mk(5, 14, "#6aa9ee", "#2c66bd"),
    platWood:   mk(5, 14, "#b07a40", "#7c4f22"),
    jersey:     mk(-10, 10, "#e8433a", "#b3221b"),
    defJersey:  mk(-8, 14, "#33508f", "#16244a"),
    gold:       mk(4, 15, "#f7e08a", "#b8860b"),
    platinum:   mk(4, 15, "#f4f6fa", "#9aa3b2"),
    junk:       mk(4, 15, "#d8d8de", "#b6b6be"),
    suit:       mk(-9, 10, "#4e4e5c", "#1e1e26"),
    building:   mk(-16, 18, "#9aa0aa", "#5e646e"),
    // ----- Nantucket platforms (white & red-striped beach planks) -----
    nanWhite:   mk(5, 14, "#ffffff", "#e2e6ea"),
    nanMove:    mk(5, 14, "#bfe6f6", "#5fa8d6"),
    nanWood:    mk(5, 14, "#cdb48f", "#9c7c54"),
    stick,
  };
})();

// ---------- Helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, f) => a + (b - a) * f;
const hash = i => { const x = Math.sin(i * 127.1) * 43758.5453; return x - Math.floor(x); };

// ---------- Player preferences (settings + character) ----------
const KEY = { best: "laxjump3_best", settings: "laxjump3_settings", char: "laxjump3_char", scores: "laxjump3_scores" };
const PALETTE = ["#d8332a", "#1c2f5e", "#1c7a3c", "#222222", "#f0f0f0", "#ff7a1a", "#7a4fbf", "#d4af37"];
const CONFETTI = ["#d8332a", "#ffd23b", "#5be1ff", "#3aa657", "#fff", "#b46cff"]; // new-record celebration burst colors
const HAIRS = ["SHORT", "FLOW", "BUZZ"];
const SPEEDS = { EASY: 0.85, NORMAL: 1, HARD: 1.2 };
function loadJSON(k, fallback) {
  try { return Object.assign({}, fallback, JSON.parse(localStorage.getItem(k)) || {}); }
  catch (e) { return Object.assign({}, fallback); }
}
let settings = loadJSON(KEY.settings, { name: "YOU", sfx: true, music: true, speed: "NORMAL" });
let charCfg = loadJSON(KEY.char, { hair: "BUZZ", num: 1, helmet: "#d8332a", gloves: "#d8332a",
                                   stick: "#f0f0f0", jersey: "#d8332a", shorts: "#f0f0f0", shoes: "#f0f0f0" });
function savePrefs() {
  localStorage.setItem(KEY.settings, JSON.stringify(settings));
  localStorage.setItem(KEY.char, JSON.stringify(charCfg));
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const cl = v => v < 0 ? 0 : v > 255 ? 255 : v;
  const r = cl(Math.round(((n >> 16) & 255) * f)), g = cl(Math.round(((n >> 8) & 255) * f)), b = cl(Math.round((n & 255) * f));
  return `rgb(${r},${g},${b})`;
}
// the jersey gradient — cached, rebuilt only when the chosen colour changes
let _jerseyGrad = null, _jerseyCol = null;
function jerseyGrad() {
  if (_jerseyCol !== charCfg.jersey) {
    _jerseyCol = charCfg.jersey;
    _jerseyGrad = ctx.createLinearGradient(0, -10, 0, 10);
    _jerseyGrad.addColorStop(0, shade(charCfg.jersey, 1.18));
    _jerseyGrad.addColorStop(1, shade(charCfg.jersey, 0.74));
  }
  return _jerseyGrad;
}

// ---------- Audio ----------
let actx = null;
function initAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.resume) actx.resume();
  } catch (e) { actx = null; }
}
function tone(freq, dur, type, vol, slide) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), actx.currentTime + dur);
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function sfx(freq, dur, type, vol, slide) {
  if (settings.sfx) tone(freq, dur, type, vol, slide);
}
// Level/boss music is a brief sting: it kicks in at each transition, plays for a
// few seconds, then stops on its own so the climb itself stays quiet. (The eagle
// flight solo below is tied to the powerup, not a transition, so it's left alone.)
const MUSIC_STING_MS = 6000;
let tuneStopTimer = null;
function autoStopTune(stopFn) {
  clearTimeout(tuneStopTimer);
  tuneStopTimer = setTimeout(stopFn, MUSIC_STING_MS);
}
// Original southern-rock style solo for the eagle flight (a Free Bird homage —
// the real recording is copyrighted, so this riff is our own).
let soloTimer = null;
const SOLO = [330, 392, 440, 392, 440, 494, 587, 494,
              440, 494, 587, 659, 587, 494, 440, 392,
              330, 392, 440, 587, 659, 784, 659, 587];
function startEagleSolo() {
  if (!actx || soloTimer || !settings.music) return;
  let i = 0;
  soloTimer = setInterval(() => {
    tone(SOLO[i % SOLO.length], 0.22, "sawtooth", 0.030, 0);
    tone(SOLO[i % SOLO.length] / 2, 0.22, "triangle", 0.020, 0);
    i++;
  }, 150);
}
function stopEagleSolo() {
  if (soloTimer) { clearInterval(soloTimer); soloTimer = null; }
}

// Slick minor-key "finance" groove: walking bass + sparse lead. Kicks in when
// the boss falls and loops through the whole private equity climb.
let financeTimer = null;
const FIN_BASS = [110, 110, 131, 131, 147, 147, 131, 131,
                  110, 110, 131, 131, 165, 165, 147, 131];
const FIN_LEAD = [0, 440, 0, 523, 0, 587, 523, 0,
                  440, 0, 523, 0, 659, 0, 587, 523];
function startFinanceTune() {
  if (!actx || financeTimer || !settings.music) return;
  stopEagleSolo();
  let i = 0;
  financeTimer = setInterval(() => {
    tone(FIN_BASS[i % 16], 0.20, "triangle", 0.045, 0);
    const lead = FIN_LEAD[i % 16];
    if (lead) tone(lead, 0.14, "square", 0.018, 0);
    if (i % 4 === 2) tone(2200, 0.04, "square", 0.008, 0); // hi-hat tick
    i++;
  }, 165);
  autoStopTune(stopFinanceTune);
}
function stopFinanceTune() {
  if (financeTimer) { clearInterval(financeTimer); financeTimer = null; }
}

// Easy, breezy island groove for the Nantucket climb — soft ukulele-style
// plucks over a warm bass. Beachy and laid back.
let beachTimer = null;
const BEACH_LEAD = [523, 0, 659, 0, 587, 0, 784, 659, 523, 0, 659, 587, 440, 0, 523, 0];
const BEACH_BASS = [131, 131, 165, 165, 147, 147, 196, 196];
function startBeachTune() {
  if (!actx || beachTimer || !settings.music) return;
  stopEagleSolo(); stopFinanceTune(); stopBarTune();
  let i = 0;
  beachTimer = setInterval(() => {
    tone(BEACH_BASS[i % BEACH_BASS.length], 0.34, "sine", 0.040, 0);
    const lead = BEACH_LEAD[i % BEACH_LEAD.length];
    if (lead) { tone(lead, 0.26, "triangle", 0.028, 0); tone(lead * 2, 0.16, "sine", 0.010, 0); }
    i++;
  }, 230);
  autoStopTune(stopBeachTune);
}
function stopBeachTune() { if (beachTimer) { clearInterval(beachTimer); beachTimer = null; } }

// Very calm, slow pad for the goose farm — almost a lullaby.
let farmTimer = null;
const FARM_NOTES = [392, 0, 0, 523, 0, 0, 494, 0, 440, 0, 0, 587, 0, 0, 523, 0];
function startFarmTune() {
  if (!actx || farmTimer || !settings.music) return;
  let i = 0;
  farmTimer = setInterval(() => {
    const n = FARM_NOTES[i % FARM_NOTES.length];
    if (n) { tone(n, 0.7, "sine", 0.032, 0); tone(n / 2, 0.7, "triangle", 0.018, 0); }
    if (i % 8 === 0) tone(196, 1.1, "sine", 0.026, 0); // low warm pad
    i++;
  }, 360);
  autoStopTune(stopFarmTune);
}
function stopFarmTune() { if (farmTimer) { clearInterval(farmTimer); farmTimer = null; } }

// Driving dive-bar groove for the Chicken Box blackout — dark and pulsing.
let barTimer = null;
const BAR_BASS = [98, 98, 0, 98, 110, 0, 98, 0, 87, 87, 0, 87, 110, 0, 98, 0];
function startBarTune() {
  if (!actx || barTimer || !settings.music) return;
  stopFinanceTune(); stopBeachTune();
  let i = 0;
  barTimer = setInterval(() => {
    const b = BAR_BASS[i % BAR_BASS.length];
    if (b) tone(b, 0.16, "sawtooth", 0.050, 0);
    if (i % 2 === 0) tone(60, 0.10, "square", 0.050, -20); // kick
    if (i % 4 === 2) tone(2400, 0.03, "square", 0.010, 0); // hat
    i++;
  }, 150);
  autoStopTune(stopBarTune);
}
function stopBarTune() { if (barTimer) { clearInterval(barTimer); barTimer = null; } }

// kills every loop in one call — used on reset, pause, game over and transitions
function stopAllTunes() { stopEagleSolo(); stopFinanceTune(); stopBeachTune(); stopFarmTune(); stopBarTune(); clearTimeout(tuneStopTimer); }

const SND = {
  bounce: () => sfx(300, 0.10, "square", 0.030, 150),
  wood:   () => sfx(120, 0.16, "sawtooth", 0.050, -60),
  shot:   () => sfx(500, 0.18, "square", 0.045, 400),
  net:    () => sfx(420, 0.20, "triangle", 0.050, 250),
  coin:   () => sfx(880, 0.08, "triangle", 0.040, 200),
  shield: () => sfx(660, 0.30, "sine", 0.050, 220),
  eagle:  () => sfx(1100, 0.28, "sawtooth", 0.035, -550),
  // the private jet spooling up and roaring off the runway
  jet: () => {
    sfx(80,  0.42, "sawtooth", 0.022, 200);
    setTimeout(() => sfx(180, 0.50, "sawtooth", 0.036, 440), 110);
    setTimeout(() => sfx(320, 0.62, "sawtooth", 0.048, 820), 250);
    setTimeout(() => sfx(900, 0.45, "square",   0.012, 700), 300);
  },
  flap:   () => sfx(180, 0.12, "triangle", 0.028, 60),
  // a cool sci-fi warp: a quick whoosh-in, a big sweep up and away, a detuned
  // shimmer, then a little ascending sparkle as you pop out the other side
  portal: () => {
    sfx(540, 0.16, "sine", 0.045, -360);
    setTimeout(() => { sfx(190, 0.52, "sine", 0.052, 880);
                       sfx(286, 0.50, "triangle", 0.024, 1040); }, 90);
    setTimeout(() => sfx(1046, 0.09, "triangle", 0.030, 240), 250);
    setTimeout(() => sfx(1318, 0.09, "triangle", 0.026, 240), 320);
    setTimeout(() => sfx(1568, 0.13, "sine", 0.024, 360), 390);
  },
  ko:     () => sfx(180, 0.15, "square", 0.050, -80),
  over:   () => sfx(240, 0.50, "sawtooth", 0.055, -180),
  // a quick two-note ruff for the golden retriever
  bark:   () => { sfx(280, 0.07, "square", 0.05, -90); setTimeout(() => sfx(200, 0.09, "square", 0.045, -70), 70); },
  horse:  () => sfx(230, 0.16, "sawtooth", 0.035, -110), // chariot giddyup
  bell:   () => sfx(920, 0.22, "triangle", 0.040, 240),  // bike bell
};

// ---------- Constants ----------
const GRAVITY = 0.32;
const JUMP_V = -10.8;
const NET_V = -17.5;
const EAGLE_FRAMES = 140;
const SHIELD_FRAMES = 600;
const MOVE_ACC = 0.6;
const MAX_VX = 6.5;
const MAX_AMMO = 5;
const PLAT_W = 78, PLAT_H = 16;
const BOSS_AT = 15000;        // private equity boss
const BOSS_HP = 10;
const NAN_BOSS_AT = 50000;    // chicken box blackout boss (the bouncer)
const BOX_HP = 20;            // the bouncer is tougher
const FARM_AT = 100000;       // goose farm retirement now waits at the very top

// milestone sayings (blimps in lax, NYSE tickers in PE, banner planes/boats in Nantucket)
const MILESTONES = [
  [1000,  "RIPPING IT!"],
  [2500,  "TOP SHELF!"],
  [5000,  "...WHERE MOMMA HIDES THE COOKIES"],
  [7500,  "BAR DOWN!"],
  [10000, "FULL FLOW MODE"],
  [12500, "LAX LEGEND"],
  [20000, "EBITDA POSITIVE"],
  [27500, "2 AND 20, ALWAYS"],
  [35000, "FUND IV CLOSED"],
  [45000, "PE LEGEND"],
  [55000, "WELCOME TO ACK"],
  [65000, "ISLAND TIME"],
  [75000, "ROSÉ SZN"],
  [85000, "ACK LEGEND"],
  [95000, "FERRY'S WARMING UP"],
];
const BLIMP_MSGS = ["GO LAX!", "BAR DOWN!", "RIP IT!", "FLOW CHECK",
                    "TOP CHEDDAR", "YARD SALE!", "WHERE BANDS?", "CELLY HARD"];
// classic buy-side ticker chatter: green prints up, red prints down
const TICKER_MSGS = [
  ["DRY POWDER AT RECORD HIGHS", 1],
  ["IT'S ACCRETIVE", 1],
  ["SYNERGIES UNLOCKED", 1],
  ["MULTIPLE EXPANSION SZN", 1],
  ["2 AND 20, ALWAYS", 1],
  ["CAP TABLE LOOKING CLEAN", 1],

];
// the private equity boss quizzes you with every shot — strictly LBO/buy-side,
// no banking technicals
const INTERVIEW = [
  "WALK ME THROUGH AN LBO",
  "WHY PRIVATE EQUITY?",
  "PAPER LBO. GO.",
  "WHAT MAKES A GOOD LBO TARGET?",
  "WHAT IRR DO YOU UNDERWRITE?",

];
// Nantucket banner sayings, pulled by planes (in town) or boats (over water)
const NAN_BANNER_MSGS = [
  "HOW ARE WE GOING TO WIN?",
  "ACK LIFE",
  "ISLAND TIME",

  "NO REPLACEMENT FOR DISPLACEMENT",

];
// the chicken box bouncer barks these as he throws (it's a cash-only dive bar)
const BOX_PHRASES = [

  "ONE IN, ONE OUT",

];
const BOX_RING_PHRASE = "YOU CAN GO TO THE PATIO IF YOU WANT TO VAPE";

// ---------- State ----------
let state = "title"; // title | playing | gameover
let player, platforms, coins, defenders, parts, shots, floats;
let clouds, birds, blimps, balloons, banners;
let cameraY, score, ammo, newBest, overAt, lastPortalY, mileIdx, t = 0;
// phase 1 = lacrosse climb, 2 = PE boss arena, 3 = private equity climb,
// 5 = chicken box boss arena, 6 = nantucket climb, 4 = goose farm (the very top)
let phase, boss, bossShots, pickups, srcDigit, tickers, farm, overTitle, startBest;
let stats; // squids, acq (businesses acquired), cash (net worth $)
let best = +(localStorage.getItem(KEY.best) || 0);
let isTouch = false;

function newPlatform(x, y, type) {
  return {
    x, y, type, // normal | moving | wood | net | floor
    w: PLAT_W,
    vx: type === "moving" ? (Math.random() < 0.5 ? -1.5 : 1.5) : 0,
    broken: false,
    item: null, // ball | shield | eagle
    portal: false,
    flash: 0,
  };
}

function difficulty() { return clamp(score / 15000, 0, 1); }

// Keep a defender from being placed somewhere unfair: on top of where the
// player just landed (portal exits / level transitions) or directly above a
// trampoline that could fling the player straight into it.
function defenderSafe(x, y) {
  if (player && Math.abs(y - player.y) < 150 && Math.abs(x - player.x) < 72) return false;
  for (const p of platforms) {
    if (p.type !== "net" || p.broken) continue;
    if (y < p.y && p.y - y < 200 && Math.abs((p.x + p.w / 2) - x) < 60) return false;
  }
  return true;
}

function spawnPlatformAt(y) {
  const d = difficulty();
  let type = "normal";
  const r = Math.random();
  if (phase >= 3) {
    // keep plenty of plain bars so items/portals have homes
    if (r < 0.16) type = "moving";
    else if (r < 0.32) type = "wood";
    else if (r < 0.40) type = "net";
  } else if (score > 400 && r < 0.12 + 0.18 * d) type = "moving";
  else if (score > 600 && r < 0.27 + 0.38 * d) type = "wood";
  else if (score > 800 && r < 0.33 + 0.38 * d) type = "net";
  const p = newPlatform(rand(8, W - PLAT_W - 8), y, type);

  if (type === "normal") {
    // One shared eagle rate for the whole game — the lacrosse eagle, the PE jet and
    // the Nantucket chariot all turn up on about 1 in 100 platforms. (Items only sit
    // on plain bars, ~60% of platforms, so the roll is scaled to land that 1-in-100.)
    const ir = Math.random();
    const eagleOdds = 0.0167;
    if (ir < eagleOdds) p.item = "eagle";
    else if (ir < 0.05) p.item = "shield";
    else if (ir < 0.14) p.item = "ball";
  }
  // portal (a few per run)
  if (type === "normal" && y < lastPortalY - 2000 && Math.random() < 0.03) {
    p.portal = true;
    p.item = null;
    lastPortalY = y;
  }
  platforms.push(p);

  if (Math.random() < 0.12) {
    coins.push({ x: rand(25, W - 25), y: y - rand(25, 65), taken: false });
  }
  if (score > 1200 && Math.random() < 0.05 + 0.05 * d) {
    const dx = rand(45, W - 45);
    if (defenderSafe(dx, y - 65)) {
      defenders.push({ x: dx, y: y - 65, t: Math.random() * 6.28, dead: false });
    }
  }
}

function reset() {
  player = { x: W / 2, y: H - 130, vx: 0, vy: JUMP_V, facing: 1, eagle: 0, shield: 0 };
  stats = { squids: 0, acq: 0, cash: 0 };
  platforms = []; coins = []; defenders = []; parts = []; shots = []; floats = [];
  clouds = []; birds = []; blimps = []; balloons = []; banners = [];
  cameraY = 0; score = 0; ammo = 0; newBest = false; mileIdx = 0;
  lastPortalY = H;
  callOut = null;
  phase = 1; boss = null; bossShots = []; pickups = []; srcDigit = 0;
  tickers = []; farm = null; overTitle = "CHECKED!"; startBest = best;
  stopAllTunes();

  platforms.push(newPlatform(W / 2 - PLAT_W / 2, H - 90, "normal"));
  let y = H - 160;
  while (y > -H) { spawnPlatformAt(y); y -= rand(56, 84); }

  for (let i = 0; i < 6; i++) {
    clouds.push({ wy: rand(-40, H * 0.8), x: rand(0, W), s: rand(0.6, 1.3), p: rand(0.5, 0.8), vx: rand(0.05, 0.2) });
  }
}

// ---------- Particles & popups ----------
function burst(x, y, n, color, speed, grav) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), v = rand(speed * 0.3, speed);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1,
                 life: rand(18, 36), max: 36, c: color, r: rand(1.5, 3.5), g: grav });
  }
}
function popup(x, y, txt, size, life, dy) {
  floats.push({ x, y, txt, size: size || 13, life: life || 50, max: life || 50,
                dy: dy === undefined ? -0.7 : dy });
}
function saveBest() {
  if (score > best) { best = score; localStorage.setItem(KEY.best, best); }
}
function tallyKill() { if (phase >= 3) stats.acq++; else stats.squids++; }
// the callout shown on every kill, whatever the method (stomp / item / dog / shot)
function killWord() { return phase === 6 ? "WHALED!" : phase >= 3 ? "ACQUIRED!" : "SQUID!"; }
function killColor() { return phase === 6 ? "#3f73a8" : "#1c2f5e"; }
// One big front-and-center saying at a time; a new one replaces the old
let callOut = null;
function callout(txt, life) { callOut = { txt, life: life || 70, max: life || 70 }; }

// ---------- Input ----------
const keys = {};
function tryStart() {
  if (state === "playing" || state === "paused" || state === "settings" || state === "character") return;
  if (state === "retired") {
    if (performance.now() - overAt < 500) return;
    reset();
    state = "title";
    return;
  }
  if (state === "gameover" && performance.now() - overAt < 700) return;
  initAudio();
  reset();
  state = "playing";
}

// ---------- Menus, pause, scoreboard ----------
let lastBoard = [], lastRank = -1;
const HOME_BTN = { x: W / 2 - 55, y: 468, w: 110, h: 36 };
function homeBtnHit(px, py) {
  return px >= HOME_BTN.x && px <= HOME_BTN.x + HOME_BTN.w &&
         py >= HOME_BTN.y && py <= HOME_BTN.y + HOME_BTN.h;
}
function goHome() { reset(); state = "title"; }
function pauseGame() { state = "paused"; stopAllTunes(); }
function resumeGame() {
  state = "playing";
  if (phase === 3) startFinanceTune();
  else if (phase === 5) startBarTune();
  else if (phase === 6) startBeachTune();
  else if (phase === 4) startFarmTune();
}

function recordScore() {
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(KEY.scores)) || []; } catch (e) {}
  const entry = { n: settings.name, s: score };
  arr.push(entry);
  arr.sort((a, b) => b.s - a.s);
  lastRank = arr.indexOf(entry);
  if (arr.length > 5) arr.length = 5;
  if (lastRank > 4) lastRank = -1;
  lastBoard = arr;
  localStorage.setItem(KEY.scores, JSON.stringify(arr));
}

function cycle(list, cur, dir) {
  let i = list.indexOf(cur);
  if (i < 0) i = 0;
  return list[(i + dir + list.length) % list.length];
}

// returns true if the tap was consumed by UI for the current state
function uiTap(px, py) {
  if (state === "title") {
    if (py < 64 && px > W - 104) {
      state = px > W - 54 ? "character" : "settings";
      return true;
    }
    return false;
  }
  if (state === "settings") { settingsTap(px, py); return true; }
  if (state === "character") { characterTap(px, py); return true; }
  if (state === "paused") {
    if (homeBtnHit(px, py)) goHome();
    else resumeGame();
    return true;
  }
  if (state === "gameover") {
    if (homeBtnHit(px, py)) { goHome(); return true; }
    return false;
  }
  if (state === "playing") {
    if (py < 40 && px > W - 44) { pauseGame(); return true; }
    return false;
  }
  return false;
}

const SET_ROWS = [168, 222, 276, 330, 384];
function settingsTap(px, py) {
  if (py > 452 && py < 500) { savePrefs(); state = "title"; return; }
  let row = -1;
  for (let i = 0; i < 4; i++) if (Math.abs(py - SET_ROWS[i]) < 26) row = i;
  if (row === 0 && typeof window.prompt === "function") {
    const v = window.prompt("Username (max 10 characters):", settings.name);
    if (v && v.trim()) settings.name = v.trim().slice(0, 10).toUpperCase();
  } else if (row === 1) {
    settings.sfx = !settings.sfx;
  } else if (row === 2) {
    settings.music = !settings.music;
    if (!settings.music) { stopEagleSolo(); stopFinanceTune(); }
  } else if (row === 3) {
    settings.speed = cycle(Object.keys(SPEEDS), settings.speed, 1);
  }
  if (row >= 0) { savePrefs(); SND.coin(); }
}

const CHAR_ROWS = [238, 274, 310, 346, 382, 418, 454, 490];
function characterTap(px, py) {
  if (py > 520 && py < 568) { savePrefs(); state = "title"; return; }
  let row = -1;
  for (let i = 0; i < CHAR_ROWS.length; i++) if (Math.abs(py - CHAR_ROWS[i]) < 17) row = i;
  if (row < 0) return;
  const dir = px < W / 2 + 35 ? -1 : 1;
  if (px < 150) return; // taps on the labels do nothing
  if (row === 0) charCfg.hair = cycle(HAIRS, charCfg.hair, dir);
  else if (row === 1) charCfg.num = (charCfg.num + dir + 100) % 100;
  else {
    const k = ["jersey", "helmet", "gloves", "stick", "shorts", "shoes"][row - 2];
    charCfg[k] = cycle(PALETTE, charCfg[k], dir);
  }
  savePrefs();
  SND.coin();
}
window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (state !== "playing" && (e.key === " " || e.key === "Enter")) tryStart();
});
window.addEventListener("keyup", e => keys[e.key] = false);

function canvasPoint(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
}

// Taps on the farm: the retire button, eggs, and the rocking chair
function farmTap(cx, cy) {
  if (!farm) return false;
  if (cx >= 6 && cx <= 78 && cy >= 42 && cy <= 72) { retire(); return true; }
  const gy = farm.ground - cameraY;
  for (const g of farm.geese) {
    if (!g.egg || farm.carrying) continue;
    if (Math.hypot(g.x - cx, (gy - 44) - cy) < 30) {
      farm.carrying = { golden: g.egg.golden };
      g.egg = null;
      farm.chilling = false;
      callout("BRING IT HOME!");
      SND.coin();
      return true;
    }
  }
  if (Math.hypot(farm.chairX - cx, (gy - 28) - cy) < 42) {
    farm.chilling = true;
    return true;
  }
  farm.chilling = false; // tapping anywhere else gets you out of the chair
  return false;
}

// Tap a targeted defender (or the boss) to rip a shot at him (costs one ball)
function tryShoot(cx, cy) {
  if (state !== "playing" || phase === 4 || ammo <= 0) return false;
  if (phase === 2 || phase === 5) {
    if (!boss || boss.dead) return false;
    const dist = Math.hypot(boss.x - cx, (boss.y + boss.yOff - cameraY) - cy);
    if (dist > 74) return false;
    ammo--;
    shots.push({ x: player.x, y: player.y - 30, vx: 0, vy: -8, life: 140, target: null, hit: false });
    SND.shot();
    return true;
  }
  let bestD = Infinity, target = null;
  for (const d of defenders) {
    if (d.dead) continue;
    // never throw a second ball at a monster that already has one on the way — a
    // repeat tap on it falls through to steering instead (tryShoot returns false)
    if (shots.some(s => s.target === d)) continue;
    const dist = Math.hypot(d.x - cx, (d.y - cameraY) - cy);
    // a monster clearly below you needs a more precise (closer-to-center) tap so a
    // casual steering tap near it doesn't fire by accident; above/beside/nearby keep
    // the original, more forgiving reach.
    const reach = d.y > player.y + 18 ? 30 : 52;
    if (dist < reach && dist < bestD) { bestD = dist; target = d; }
  }
  if (!target) return false;
  ammo--;
  shots.push({ x: player.x + player.facing * 26, y: player.y - 30, vx: 0, vy: -8, life: 90, target, hit: false });
  SND.shot();
  return true;
}

let touchDir = 0;
window.addEventListener("touchstart", e => {
  e.preventDefault(); // stops browsers firing a duplicate mouse event after the touch
  isTouch = true;
  const tc = e.touches[0];
  const pt = canvasPoint(tc.clientX, tc.clientY);
  if (uiTap(pt.x, pt.y)) return;
  if (state !== "playing") { tryStart(); return; }
  if (phase === 4) { if (farmTap(pt.x, pt.y)) return; }
  else if (tryShoot(pt.x, pt.y)) return;
  touchDir = tc.clientX < window.innerWidth / 2 ? -1 : 1;
}, { passive: false });
window.addEventListener("touchmove", e => {
  if (e.touches.length) touchDir = e.touches[0].clientX < window.innerWidth / 2 ? -1 : 1;
  e.preventDefault();
}, { passive: false });
window.addEventListener("touchend", e => { if (!e.touches.length) touchDir = 0; });
window.addEventListener("mousedown", e => {
  const pt = canvasPoint(e.clientX, e.clientY);
  if (uiTap(pt.x, pt.y)) return;
  if (state !== "playing") { tryStart(); return; }
  if (phase === 4) farmTap(pt.x, pt.y);
  else tryShoot(pt.x, pt.y);
});

// Steering is tap-only (tilt was removed — it never worked reliably): tap the
// left or right half of the screen to move that way.

// ---------- Update ----------
function update() {
  t++;
  updateDecor();
  // particles & popups keep animating on overlays (e.g. record confetti)
  for (const q of parts) { q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--; }
  parts = parts.filter(q => q.life > 0);
  for (const f of floats) { f.y += f.dy; f.life--; }
  floats = floats.filter(f => f.life > 0);
  if (callOut && --callOut.life <= 0) callOut = null;
  // celebration confetti keeps falling on a new-record screen
  if ((state === "gameover" || state === "retired") && newBest && t % 18 === 0) {
    burst(rand(30, W - 30), cameraY + rand(40, 160), 7, CONFETTI[t % CONFETTI.length], 3.5, 0.12);
  }
  if (state !== "playing") return;

  // steering: keys or tap (left/right half of the screen)
  let dir = 0;
  if (keys["ArrowLeft"] || keys["a"]) dir = -1;
  else if (keys["ArrowRight"] || keys["d"]) dir = 1;
  else if (touchDir) dir = touchDir;

  player.vx += dir * MOVE_ACC;
  player.vx *= 0.94;
  player.vx = clamp(player.vx, -MAX_VX, MAX_VX);
  if (Math.abs(player.vx) > 0.3) player.facing = player.vx > 0 ? 1 : -1;

  if (player.eagle > 0) {
    player.eagle--;
    const fade = Math.min(1, player.eagle / 25);
    player.vy = -15 * fade - 4 * (1 - fade);
    if (phase === 6) {
      // sandy dust kicked up by the galloping chariot horses
      if (t % 3 === 0) {
        parts.push({ x: player.x + rand(-22, 22), y: player.y + rand(8, 22),
                     vx: rand(-0.6, 0.6), vy: rand(0.4, 1.4),
                     life: rand(16, 30), max: 30,
                     c: Math.random() < 0.6 ? "rgba(226,210,170,0.85)" : "rgba(200,180,140,0.7)",
                     r: rand(1.5, 3), g: 0.02 });
      }
    } else if (phase >= 3) {
      // faint jet exhaust drifting down behind the private jet (it draws its
      // own two contrails; this just adds a little depth)
      if (t % 3 === 0) {
        parts.push({ x: player.x + rand(-14, 6), y: player.y + rand(-14, 4),
                     vx: rand(-0.6, 0.1), vy: rand(0.5, 1.4),
                     life: rand(14, 26), max: 26,
                     c: "rgba(235,238,242,0.6)", r: rand(1.2, 2.6), g: 0.01 });
      }
    } else if (t % 4 === 0) {
      // drifting feathers
      parts.push({ x: player.x + rand(-18, 18), y: player.y - 40,
                   vx: rand(-0.8, 0.8), vy: rand(0.5, 1.5),
                   life: rand(20, 34), max: 34,
                   c: Math.random() < 0.5 ? "#7a5533" : "#f0ead8",
                   r: rand(1.5, 3), g: 0.02 });
    }
    if (player.eagle % 18 === 0) (phase === 6 ? SND.horse() : SND.flap());
  } else {
    stopEagleSolo();
    player.vy += GRAVITY;
  }
  if (player.shield > 0) player.shield--;

  player.x += player.vx;
  player.y += player.vy;
  if (player.x < -20) player.x = W + 20;
  if (player.x > W + 20) player.x = -20;

  if (phase === 2 || phase === 5) { updateBoss(); return; }
  if (phase === 4) { updateFarm(); return; }

  if (t % 600 === 0) saveBest(); // autosave the high score mid-run

  // platform collisions (only while falling, never during eagle flight)
  if (player.vy > 0 && player.eagle <= 0) {
    for (const p of platforms) {
      if (p.broken) continue;
      if (player.x > p.x - 12 && player.x < p.x + p.w + 12 &&
          player.y + 30 > p.y && player.y + 30 < p.y + PLAT_H + player.vy + 2) {
        player.y = p.y - 30;
        p.flash = 8;
        if (p.type === "net") {
          player.vy = NET_V;
          SND.net();
          burst(player.x, p.y, 6, phase === 6 ? "#ffd23b" : "#ffd23b", 2, 0.1);
          callout(phase === 6 ? "CISCO!" : phase >= 3 ? "INVESTED!" : "CHERISHED!");
        } else {
          player.vy = JUMP_V;
          if (p.type === "wood") {
            // wood gives you ONE bounce, then shatters
            p.broken = true;
            SND.wood();
            burst(p.x + PLAT_W / 2, p.y + 6, 10, "#8a5a2b", 3, 0.25);
            burst(p.x + PLAT_W / 2, p.y + 6, 5, "#c89058", 2.5, 0.25);
          } else {
            SND.bounce();
            burst(player.x, p.y + 4, 4, "rgba(255,255,255,0.8)", 1.4, 0.05);
          }
        }
        break;
      }
    }
  }

  // moving platforms
  for (const p of platforms) {
    if (p.flash > 0) p.flash--;
    if (p.type === "moving" && !p.broken) {
      p.x += p.vx;
      if (p.x < 4 || p.x > W - PLAT_W - 4) p.vx *= -1;
    }
  }

  // pipeline segue portals
  for (const p of platforms) {
    if (!p.portal || p.broken) continue;
    const px = p.x + PLAT_W / 2, py = p.y - 34;
    const dx = player.x - px, dy = player.y - py;
    if (dx * dx + dy * dy < 34 * 34) {
      p.portal = false;
      SND.portal();
      const inCol = phase === 6 ? "#ff9d5c" : "#b46cff";
      const outCol = phase === 6 ? "#ffd166" : "#5be1ff";
      burst(player.x, player.y, 18, inCol, 5, 0);
      const exitY = p.y - 1100;
      platforms.push(newPlatform(clamp(player.x - PLAT_W / 2, 8, W - PLAT_W - 8), exitY + 46, "normal"));
      player.y = exitY;
      player.vy = -6;
      cameraY = Math.min(cameraY, player.y - H * 0.42);
      score = Math.max(score, Math.floor(-cameraY));
      // never warp on top of a monster: clear any near the exit
      defenders = defenders.filter(dd => dd.dead ||
        !(Math.abs(dd.y - player.y) < 170 && Math.abs(dd.x - player.x) < 95));
      burst(player.x, player.y, 18, outCol, 5, 0);
      if (phase === 6) {
        // bike to 'sconset, pop out to a gorgeous sunset (a quiet point bump)
        score += 500;
        stats.cash += 500;
        callout("COOL SUNSET!");
        SND.bell();
      } else if (phase >= 3) {
        // sourced an LBO: a random 1-10 deal, worth digit x 100 points
        srcDigit = 1 + Math.floor(Math.random() * 10);
        score += srcDigit * 100;
        stats.cash += srcDigit * 100;
        callout("+$" + srcDigit + "B");
      } else {
        callout("PIPELINE!");
      }
    }
  }

  // item pickups (touch anywhere)
  for (const p of platforms) {
    if (!p.item || p.broken) continue;
    const ix = p.x + PLAT_W / 2, iy = p.y - 13;
    const dx = player.x - ix, dy = player.y - iy;
    if (dx * dx + dy * dy < 32 * 32) {
      if (p.item === "ball") {
        if (ammo < MAX_AMMO) ammo++;
        score += 50; // points added quietly; the popup only mentions the pickup
        if (phase >= 3) stats.cash += 50;
        popup(ix, iy, phase === 6 ? "+1 Shell" : phase >= 3 ? "+$$" : "+1 Ball");
        SND.coin();
        burst(ix, iy, 8, phase === 6 ? "#ffd9b0" : "#ffe34d", 2.5, 0.05);
      } else if (p.item === "shield") {
        player.shield = SHIELD_FRAMES;
        if (phase === 6) { callout("GOOD BOY!"); SND.bark(); setTimeout(() => SND.bark(), 240); }
        else { if (phase >= 3) callout("NICE VEST!"); SND.shield(); }
        burst(ix, iy, 12, phase === 6 ? "#f4c869" : "#5be1ff", 3, 0);
      } else if (p.item === "eagle") {
        player.eagle = EAGLE_FRAMES;
        // in phase 3 the finance tune is already playing — don't start the solo
        if (phase < 3) startEagleSolo();
        if (phase === 6) { SND.eagle(); callout("YOU CHARIOT!"); SND.horse(); }
        else if (phase === 3) { SND.jet(); callout("FLYING PRIVATE"); } // jet roars off the runway
        else { SND.eagle(); callout("FREE BIRD!"); }
        burst(ix, iy, 14, phase === 6 ? "#caa46a" : phase >= 3 ? "#fff" : "#7a5533", 4, 0);
      }
      p.item = null;
    }
  }

  // loose balls / cash / seashells: points + ammo for your stick
  for (const c of coins) {
    if (c.taken) continue;
    const dx = player.x - c.x, dy = player.y - c.y;
    if (dx * dx + dy * dy < 28 * 28) {
      c.taken = true;
      score += 50;
      if (phase >= 3) stats.cash += 50;
      if (ammo < MAX_AMMO) ammo++;
      SND.coin();
      burst(c.x, c.y, 8, phase === 6 ? "#ffd9b0" : "#ffd23b", 2.5, 0);
      popup(c.x, c.y, phase === 6 ? "+1 Shell" : phase >= 3 ? "+$$" : "+1 Ball");
    }
  }

  // shots fired at defenders
  for (const s of shots) {
    if (s.target && !s.target.dead) {
      const dx = s.target.x - s.x, dy = (s.target.y - s.y);
      const dist = Math.hypot(dx, dy) || 1;
      s.vx = dx / dist * 13;
      s.vy = dy / dist * 13;
      if (dist < 22) {
        s.hit = true;
        s.target.dead = true;
        score += 100;
        tallyKill();
        SND.ko();
        burst(s.target.x, s.target.y, 14, killColor(), 4, 0.2);
        burst(s.target.x, s.target.y - 10, 6, "#ffe34d", 3, 0.1);
        callout(killWord());
        popup(s.target.x, s.target.y - 6, "+100");
      }
    }
    s.x += s.vx; s.y += s.vy; s.life--;
    parts.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 8, max: 8, c: "rgba(255,227,77,0.6)", r: 2.5, g: 0 });
  }
  shots = shots.filter(s => !s.hit && s.life > 0);

  // defenders
  for (const d of defenders) {
    if (d.dead) continue;
    d.t += 0.035;
    d.x += Math.sin(d.t) * 1.3;
    const dx = player.x - d.x, dy = player.y - d.y;
    const d2 = dx * dx + dy * dy;
    // the golden retriever lunges at any monster that wanders close, protecting
    // you without being used up (it stays for the whole leash)
    if (phase === 6 && player.shield > 0 && d2 < 66 * 66) {
      d.dead = true; score += 100; tallyKill(); SND.bark();
      burst(d.x, d.y, 14, killColor(), 4, 0.2);
      burst(d.x, d.y - 10, 6, "#f4c869", 3, 0.1);
      callout(killWord()); popup(d.x, d.y - 18, "+100");
      continue;
    }
    // whales (phase 6) are wider but shorter — an elliptical hitbox makes them a
    // touch harder to slip past without being unfair
    const wHitX = phase === 6 ? 46 : 32, wHitY = phase === 6 ? 28 : 32;
    if ((dx * dx) / (wHitX * wHitX) + (dy * dy) / (wHitY * wHitY) < 1) {
      if (player.vy > 0 && (player.y < d.y + 2 || player.y - player.vy < d.y - 4)) {
        // stomp! bounce off the defender's head
        d.dead = true; score += 100;
        tallyKill();
        player.vy = -13;
        SND.ko();
        burst(d.x, d.y, 14, killColor(), 4, 0.2);
        burst(d.x, d.y - 12, 6, "#dfe3ec", 3, 0.2);
        callout(killWord());
        popup(d.x, d.y - 20, "+100");
      } else if (player.eagle > 0) {
        d.dead = true; score += 100; tallyKill(); SND.ko();
        burst(d.x, d.y, 14, killColor(), 4, 0.2);
        callout(killWord());
        popup(d.x, d.y - 20, "+100");
      } else if (player.shield > 0) {
        // the dog never gets used up; the vest / force field is spent on the hit
        d.dead = true; if (phase !== 6) player.shield = 0;
        score += 100; tallyKill();
        if (phase === 6) SND.bark(); else SND.ko();
        burst(d.x, d.y, 14, killColor(), 4, 0.2);
        burst(player.x, player.y, 16, phase === 6 ? "#f4c869" : "#5be1ff", 4, 0);
        callout(killWord());
        popup(d.x, d.y - 20, "+100");
      } else {
        gameOver();
      }
    }
  }

  // camera & score
  const targetCam = player.y - H * 0.42;
  if (targetCam < cameraY) {
    cameraY = targetCam;
    score = Math.max(score, Math.floor(-cameraY));
  }

  // sparks rain down from above as you close in on the buy side
  if (phase === 1 && score > BOSS_AT - 1500) {
    const heat = (score - (BOSS_AT - 1500)) / 1500;
    if (Math.random() < 0.12 + heat * 0.55) {
      const cols = ["#ffd23b", "#ff9d3b", "#e84a3a"];
      parts.push({ x: rand(0, W), y: cameraY - 8,
                   vx: rand(-0.6, 0.6), vy: rand(1.5, 3.5 + heat * 2.5),
                   life: rand(45, 85), max: 85,
                   c: cols[Math.floor(rand(0, 3))], r: rand(1, 2.5), g: 0.02 });
    }
  }

  // the buy side awaits
  if (phase === 1 && score >= BOSS_AT) { enterBoss("pe"); return; }

  // light-blue sparks fly in as the chicken box blackout nears
  if (phase === 3 && score > NAN_BOSS_AT - 1500) {
    const heat = (score - (NAN_BOSS_AT - 1500)) / 1500;
    if (Math.random() < 0.12 + heat * 0.6) {
      const cols = ["#cdeeff", "#8ed7ff", "#5bb8ee"];
      parts.push({ x: rand(0, W), y: cameraY - 8,
                   vx: rand(-0.6, 0.6), vy: rand(1.5, 3.5 + heat * 2.5),
                   life: rand(45, 85), max: 85,
                   c: cols[Math.floor(rand(0, 3))], r: rand(1, 2.5), g: 0.02 });
    }
  }
  if (phase === 3 && score >= NAN_BOSS_AT) { enterBoss("box"); return; }

  // golden sparks rage as retirement (the goose farm) approaches at the very top
  if (phase === 6 && score > FARM_AT - 1800) {
    const heat = (score - (FARM_AT - 1800)) / 1800;
    if (Math.random() < 0.25 + heat * 0.85) {
      parts.push({ x: rand(0, W), y: cameraY - 8,
                   vx: rand(-0.8, 0.8), vy: rand(2, 4.5 + heat * 3),
                   life: rand(45, 85), max: 85,
                   c: Math.random() < 0.7 ? "#ffd23b" : "#fff", r: rand(1.2, 3), g: 0.02 });
    }
  }
  if (phase === 6 && score >= FARM_AT) { enterFarm(); return; }

  // milestones fly by: blimps in lax, NYSE tickers in PE, plane/boat banners on ACK
  while (mileIdx < MILESTONES.length && score >= MILESTONES[mileIdx][0]) {
    const fromLeft = Math.random() < 0.5;
    if (phase === 6) {
      spawnBanner(MILESTONES[mileIdx][1]);
    } else if (phase >= 3) {
      tickers.push({ x: fromLeft ? -260 : W + 20, wy: rand(70, 280) + cameraY * 0.75, p: 0.75,
                     vx: fromLeft ? 1.1 : -1.1, msg: MILESTONES[mileIdx][1], up: 1 });
    } else {
      blimps.push({ x: fromLeft ? -90 : W + 90, wy: rand(80, 220) + cameraY * 0.7, p: 0.7,
                    vx: fromLeft ? 0.6 : -0.6, msg: MILESTONES[mileIdx][1] });
    }
    mileIdx++;
  }

  // recycle & spawn
  platforms = platforms.filter(p => p.y < cameraY + H + 40);
  coins = coins.filter(c => !c.taken && c.y < cameraY + H + 40);
  defenders = defenders.filter(d => !d.dead && d.y < cameraY + H + 60);
  let topY = Infinity;
  for (const p of platforms) if (p.y < topY) topY = p.y;
  if (topY === Infinity) topY = cameraY + H;
  while (topY > cameraY - 60) {
    topY -= rand(56, 84 + 38 * difficulty());
    spawnPlatformAt(topY);
  }

  if (player.y > cameraY + H + 60) gameOver();
}

function gameOver() {
  if (state !== "playing") return;
  state = "gameover";
  overAt = performance.now();
  overTitle = phase === 2 ? "INTERVIEW FAILED"
            : phase === 5 || phase === 6 ? "YOU DON'T BELONG HERE"
            : phase >= 3 ? "OUT OF CAPITAL" : "CHECKED!";
  stopAllTunes();
  SND.over();
  if (navigator.vibrate) navigator.vibrate(120);
  saveBest();
  recordScore();
  if (score > startBest) {
    newBest = true;
    // confetti for the new record
    for (let i = 0; i < 5; i++) {
      burst(rand(40, W - 40), cameraY + rand(80, 300), 12, CONFETTI[i % CONFETTI.length], 4, 0.12);
    }
  }
}

function retire() {
  saveBest();
  recordScore();
  newBest = score > startBest;
  overAt = performance.now();
  state = "retired";
  stopAllTunes();
  SND.shield();
}

// ---------- Boss arenas (PE buy side, then the Chicken Box blackout) ----------
function enterBoss(kind) {
  const box = kind === "box";
  phase = box ? 5 : 2;
  // the course shatters around you as the arena takes over
  for (const p of platforms) {
    if (p.broken) continue;
    const sy = p.y - cameraY;
    if (sy > -40 && sy < H + 20) {
      burst(p.x + p.w / 2, p.y + 6, 8, box ? "#8ed7ff" : "#8a8f99", 3, 0.2);
      burst(p.x + p.w / 2, p.y + 6, 4, box ? "#cdeeff" : "#ffd23b", 2.5, 0.2);
    }
  }
  SND.wood();
  platforms = []; coins = []; defenders = []; shots = []; bossShots = []; pickups = [];
  // one full-width floor — there is no way to fall
  const floor = newPlatform(-20, cameraY + H - 50, "floor");
  floor.w = W + 40;
  platforms.push(floor);
  // the boss descends from above before the fight begins. The bouncer is tougher
  // (20 hits) and throws faster and more often, with the odd ring of bottles. He
  // also hangs lower so he doesn't cover the bar signage up top.
  boss = { kind, x: W / 2, y: cameraY - 90, targetY: cameraY + (box ? 205 : 120), intro: 120,
           yOff: 0, hp: box ? BOX_HP : BOSS_HP, maxHp: box ? BOX_HP : BOSS_HP,
           t: 0, cool: box ? 90 : 110, ring: box ? 240 : 0, flash: 0, dead: false };
  if (box) {
    stopFinanceTune(); startBarTune();
    callout("FINAL BOSS: CHICKEN BOX BLACKOUT", 150);
    sfx(70, 1.0, "sawtooth", 0.07, -28);
  } else {
    callout("FINAL BOSS: PRIVATE EQUITY", 140);
    sfx(80, 0.9, "sawtooth", 0.07, -30);
  }
}

function updateBoss() {
  // floor bounce (a touch lower than the climb so the arena feels grounded)
  if (player.vy > 0) {
    for (const p of platforms) {
      if (player.x > p.x - 12 && player.x < p.x + p.w + 12 &&
          player.y + 30 > p.y && player.y + 30 < p.y + PLAT_H + player.vy + 2) {
        player.y = p.y - 30;
        player.vy = -9.5;
        SND.bounce();
      }
    }
  }

  if (boss && !boss.dead) {
    boss.t += 0.018;
    if (boss.flash > 0) boss.flash--;
    if (boss.intro > 0) {
      // gliding down into the arena — holds fire until he's in position
      boss.intro--;
      boss.y += (boss.targetY - boss.y) * 0.05;
    } else {
      boss.y = boss.targetY;
      const box = boss.kind === "box";
      boss.x = W / 2 + Math.sin(boss.t) * (box ? 120 : 130);
      boss.yOff = Math.sin(boss.t * 1.7) * 14;
      if (box) {
        // the bouncer chucks bottles at you — faster and more often than the PE boss
        if (--boss.cool <= 0) {
          boss.cool = 95;
          const bx = boss.x, by = boss.y + boss.yOff + 24;
          const dx = player.x - bx, dy = player.y - by;
          const dl = Math.hypot(dx, dy) || 1;
          bossShots.push({ x: bx, y: by, vx: dx / dl * 2.7, vy: dy / dl * 2.7, life: 700 });
          popup(clamp(bx, 112, W - 112), by + 46, BOX_PHRASES[Math.floor(rand(0, BOX_PHRASES.length))], 13, 120, 0.6);
          SND.shot();
        }
        // every so often he flings a ring of bottles that fans out — find a gap
        if (--boss.ring <= 0) {
          boss.ring = rand(300, 440);
          const bx = boss.x, by = boss.y + boss.yOff;
          const n = 9, off = rand(0, 6.28);
          for (let i = 0; i < n; i++) {
            const a = off + i / n * 6.28;
            bossShots.push({ x: bx, y: by, vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2, life: 240, ring: true });
          }
          callout(BOX_RING_PHRASE, 150);
          sfx(150, 0.5, "square", 0.05, -60);
        }
      } else {
        // PE: slow lacrosse balls lobbed at the player, each with a pop quiz
        if (--boss.cool <= 0) {
          boss.cool = 150;
          const bx = boss.x, by = boss.y + boss.yOff + 20;
          const dx = player.x - bx, dy = player.y - by;
          const dl = Math.hypot(dx, dy) || 1;
          bossShots.push({ x: bx, y: by, vx: dx / dl * 2.3, vy: dy / dl * 2.3, life: 700 });
          popup(clamp(bx, 95, W - 95), by + 50, INTERVIEW[Math.floor(rand(0, INTERVIEW.length))], 13, 130, 0.6);
          SND.shot();
        }
      }
    }
  }

  for (const b of bossShots) {
    b.x += b.vx; b.y += b.vy; b.life--;
    const dx = player.x - b.x, dy = player.y - b.y;
    if (dx * dx + dy * dy < 24 * 24) {
      if (player.shield > 0) {
        player.shield = 0; b.life = 0;
        burst(player.x, player.y, 14, "#5be1ff", 4, 0);
        SND.ko();
      } else {
        gameOver();
      }
    }
  }
  bossShots = bossShots.filter(b => b.life > 0 && b.x > -40 && b.x < W + 40 &&
                                    b.y > cameraY - 60 && b.y < cameraY + H + 60);

  // ammo keeps spawning around the arena (kept within jumping reach:
  // the arena bounce tops out ~140px above the floor)
  if (pickups.length < 4 && Math.random() < 0.014) {
    pickups.push({ x: rand(30, W - 30), y: cameraY + rand(H - 225, H - 100), taken: false });
  }
  for (const c of pickups) {
    const dx = player.x - c.x, dy = player.y - c.y;
    if (dx * dx + dy * dy < 28 * 28) {
      c.taken = true;
      if (ammo < MAX_AMMO) ammo++;
      SND.coin();
      burst(c.x, c.y, 8, boss && boss.kind === "box" ? "#3aa657" : "#ffd23b", 2.5, 0);
    }
  }
  pickups = pickups.filter(c => !c.taken);

  // player shots home in on the boss
  for (const s of shots) {
    if (boss && !boss.dead) {
      const tx = boss.x, ty = boss.y + boss.yOff;
      const dx = tx - s.x, dy = ty - s.y;
      const dist = Math.hypot(dx, dy) || 1;
      s.vx = dx / dist * 13;
      s.vy = dy / dist * 13;
      if (dist < 36) {
        s.hit = true;
        boss.hp--;
        boss.flash = 10;
        SND.ko();
        burst(tx, ty, 10, "#ffe34d", 3, 0.1);
        if (boss.hp <= 0) { defeatBoss(); return; }
      }
    }
    s.x += s.vx; s.y += s.vy; s.life--;
    parts.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 8, max: 8, c: "rgba(255,227,77,0.6)", r: 2.5, g: 0 });
  }
  shots = shots.filter(s => !s.hit && s.life > 0);
}

function defeatBoss() {
  const box = boss.kind === "box";
  burst(boss.x, boss.y + boss.yOff, 30, box ? "#ffe1a8" : "#ffd23b", 6, 0.1);
  burst(boss.x, boss.y + boss.yOff, 20, box ? "#7fb5d8" : "#16244a", 5, 0.15);
  boss = null;
  bossShots = []; pickups = []; shots = [];
  if (box) {
    phase = 6;
    stopBarTune(); startBeachTune();
    callout("WELCOME TO NANTUCKET", 230);
    sfx(520, 0.8, "triangle", 0.06, 400);
  } else {
    phase = 3;
    callout("EXITING BUY SIDE!", 220);
    sfx(400, 0.8, "triangle", 0.06, 500);
    startFinanceTune();
  }
  // the next course materializes upward from the arena floor (solid-ground start)
  lastPortalY = cameraY + H;
  let y = cameraY + H - 170;
  while (y > cameraY - 60) { spawnPlatformAt(y); y -= rand(56, 84); }
  for (const p of platforms) {
    if (p.type === "floor") continue;
    p.flash = 10;
    const sy = p.y - cameraY;
    if (sy > -20 && sy < H) burst(p.x + p.w / 2, p.y + 4, 6, box ? "#ffd9a0" : "#ffd23b", 2.5, 0.05);
  }
}

// ---------- The goose farm (retirement) ----------
function enterFarm() {
  phase = 4;
  stopAllTunes();
  startFarmTune(); // a very calm, relaxed lullaby for retirement
  // the gold course erupts one last time
  for (const p of platforms) {
    if (p.broken) continue;
    const sy = p.y - cameraY;
    if (sy > -40 && sy < H + 20) {
      burst(p.x + p.w / 2, p.y + 6, 10, "#ffd23b", 4, 0.15);
      burst(p.x + p.w / 2, p.y + 6, 6, "#fff", 3, 0.15);
    }
  }
  burst(W / 2, cameraY + H / 2, 40, "#ffd23b", 6, 0.08);
  platforms = []; coins = []; defenders = []; shots = []; tickers = []; pickups = [];
  player.eagle = 0; player.shield = 0;
  player.vy = 0;
  const ground = cameraY + H - 70;
  farm = {
    ground,
    houseX: 62,
    chairX: W - 46,
    carrying: null,
    chilling: false,
    geese: [],
  };
  for (let i = 0; i < 5; i++) {
    const golden = i === 4; // the golden goose
    farm.geese.push({
      x: rand(130, W - 110), dir: Math.random() < 0.5 ? -1 : 1,
      t: rand(0, 6.28), golden, egg: null,
      layCool: golden ? rand(1400, 2600) : rand(400, 1100),
    });
  }
  callout("WELCOME TO THE GOOSE FARM", 220);
  sfx(520, 0.5, "triangle", 0.05, 200);
}

function updateFarm() {
  // flat ground: walking only, no jumping, no dying
  player.vy = 0;
  player.y = farm.ground - 30;
  if (farm.chilling) {
    player.vx = 0;
    player.x += (farm.chairX - player.x) * 0.2;
    // cigar smoke drifting up
    if (t % 26 === 0) {
      parts.push({ x: player.x + player.facing * 14, y: player.y - 24,
                   vx: rand(-0.2, 0.3), vy: -rand(0.4, 0.9),
                   life: rand(40, 70), max: 70, c: "rgba(220,220,225,0.7)", r: rand(2, 4), g: -0.005 });
    }
  } else {
    player.x = clamp(player.x, 24, W - 24);
  }

  for (const g of farm.geese) {
    g.t += 0.05;
    g.x += g.dir * 0.35;
    if (g.x < 125 || g.x > W - 100 || Math.random() < 0.004) g.dir *= -1;
    if (!g.egg && --g.layCool <= 0) {
      g.egg = { golden: g.golden };
      g.layCool = g.golden ? rand(2200, 4000) : rand(700, 1600);
      sfx(700, 0.1, "triangle", 0.035, 150);
    }
  }
  // the occasional honk
  if (Math.random() < 0.002) sfx(520, 0.18, "square", 0.03, -180);

  // deliver a carried egg at the farmhouse door
  if (farm.carrying && Math.abs(player.x - farm.houseX) < 28) {
    const golden = farm.carrying.golden;
    farm.carrying = null;
    score += golden ? 10000 : 1000;
    stats.cash += golden ? 10000 : 1000;
    popup(farm.houseX + 30, farm.ground - 120, golden ? "+10,000" : "+1,000", 18, 80);
    burst(farm.houseX, farm.ground - 60, golden ? 20 : 10, "#ffd23b", 3.5, 0.1);
    SND.coin();
    if (golden) { SND.shield(); callout("GOLDEN EGG!"); }
    saveBest();
  }
}

// ---------- Scenery ----------
// Nantucket journey, split into scenery bands by altitude (beach → town →
// brewery → classic houses → open water). 0 = beach, 3 = over the water.
function nanBand(alt) {
  if (alt < 62000) return 0;
  if (alt < 76000) return 1;
  if (alt < 88000) return 2;
  return 3;
}
// a saying pulled by a banner plane (in town) or a boat (out over the water)
function spawnBanner(msg) {
  const alt = Math.max(0, -cameraY);
  const boat = nanBand(alt) >= 3;
  const fromLeft = Math.random() < 0.5;
  const span = msg.length * 8 + 110;
  // Start just off the edge (not a full span away) and cross at a steady clip, so
  // the banner is actually on screen for a good while instead of crawling in from
  // far off and getting left behind by the climb's parallax before you see it.
  banners.push({
    msg, kind: boat ? "boat" : "plane",
    p: boat ? 0.5 : 0.82,
    wy: (boat ? rand(250, 360) : rand(72, 188)) + cameraY * (boat ? 0.5 : 0.82),
    x: fromLeft ? -span * 0.45 : W + span * 0.45,
    vx: fromLeft ? 1.0 : -1.0,
  });
}

function updateDecor() {
  for (const c of clouds) c.x += c.vx;
  for (const b of birds) { b.x += b.vx; b.flap += 0.25; }
  for (const b of blimps) b.x += b.vx;
  for (const b of balloons) { b.x += b.vx; b.wy -= 0.08; }
  for (const b of banners) b.x += b.vx;

  const alt = Math.max(0, -cameraY);
  if (clouds.length < 9 && Math.random() < 0.04) {
    const p = rand(0.5, 0.8);
    clouds.push({ wy: -60 + cameraY * p, x: rand(-30, W + 30), s: rand(0.6, 1.4), p, vx: rand(0.05, 0.2) });
  }
  if (alt > 800 && alt < 10000 && birds.length < 3 && Math.random() < 0.006) {
    const fromLeft = Math.random() < 0.5;
    birds.push({ x: fromLeft ? -20 : W + 20, wy: rand(60, H * 0.6) + cameraY * 0.9, p: 0.9,
                 vx: fromLeft ? rand(0.8, 1.5) : -rand(0.8, 1.5), flap: rand(0, 6) });
  }
  for (const tk of tickers) tk.x += tk.vx;
  if (phase < 3 && alt > 2000 && alt < 11000 && blimps.length < 1 && Math.random() < 0.002) {
    const fromLeft = Math.random() < 0.5;
    blimps.push({ x: fromLeft ? -90 : W + 90, wy: rand(60, 200) + cameraY * 0.7, p: 0.7,
                  vx: fromLeft ? 0.35 : -0.35,
                  msg: BLIMP_MSGS[Math.floor(Math.random() * BLIMP_MSGS.length)] });
  }
  // NYSE-style ticker prints crawling across the buy side
  if (phase === 3 && tickers.length < 3 && Math.random() < 0.008) {
    const fromLeft = Math.random() < 0.5;
    const m = TICKER_MSGS[Math.floor(Math.random() * TICKER_MSGS.length)];
    tickers.push({ x: fromLeft ? -m[0].length * 9 - 30 : W + 20,
                   wy: rand(60, 360) + cameraY * 0.75, p: 0.75,
                   vx: fromLeft ? rand(0.8, 1.4) : -rand(0.8, 1.4),
                   msg: m[0], up: m[1] });
  }
  // lacrosse-ball hot air balloon (red / orange — never the old yellow)
  if (alt > 1500 && alt < 9500 && balloons.length < 1 && Math.random() < 0.0015) {
    const fromLeft = Math.random() < 0.5;
    balloons.push({ x: fromLeft ? -60 : W + 60, wy: rand(120, 320) + cameraY * 0.6, p: 0.6,
                    vx: fromLeft ? 0.25 : -0.25,
                    col: Math.random() < 0.5 ? "#d8332a" : "#ff7a1a" });
  }
  // Nantucket banner sayings, ambient (plane in town, boat over the water)
  if (phase === 6 && banners.length < 2 && Math.random() < 0.009) {
    spawnBanner(NAN_BANNER_MSGS[Math.floor(Math.random() * NAN_BANNER_MSGS.length)]);
  }
  clouds = clouds.filter(c => c.wy - cameraY * c.p < H + 90 && c.x > -120 && c.x < W + 120);
  birds = birds.filter(b => b.x > -40 && b.x < W + 40 && b.wy - cameraY * b.p < H + 40);
  blimps = blimps.filter(b => b.x > -140 && b.x < W + 140 && b.wy - cameraY * b.p < H + 80);
  balloons = balloons.filter(b => b.x > -110 && b.x < W + 110 && b.wy - cameraY * b.p < H + 110);
  tickers = tickers.filter(tk => tk.x > -tk.msg.length * 9 - 60 && tk.x < W + 60 &&
                                 tk.wy - cameraY * tk.p < H + 60);
  banners = banners.filter(b => { const s = b.msg.length * 8 + 160;
    return b.x > -s && b.x < W + s && b.wy - cameraY * b.p < H + 140; });
}

const SKY = [
  { h: 0,     top: [110, 190, 235], bot: [185, 232, 245] },
  { h: 5000,  top: [ 60, 130, 215], bot: [150, 205, 240] },
  { h: 9000,  top: [120,  80, 160], bot: [255, 170, 110] },
  { h: 13000, top: [ 28,  32,  86], bot: [ 95,  72, 134] },
  { h: 17000, top: [  6,  10,  40], bot: [ 32,  42,  92] },
];
function skyAt(alt) {
  let a = SKY[SKY.length - 1], b = a;
  for (let i = 0; i < SKY.length - 1; i++) {
    if (alt >= SKY[i].h && alt < SKY[i + 1].h) { a = SKY[i]; b = SKY[i + 1]; break; }
  }
  const f = a === b ? 0 : (alt - a.h) / (b.h - a.h);
  const mix = (u, v) => [0, 1, 2].map(i => Math.round(lerp(u[i], v[i], f)));
  return [mix(a.top, b.top), mix(a.bot, b.bot)];
}

const stars = [];
for (let i = 0; i < 90; i++) stars.push({ x: hash(i) * W, y: hash(i + 200) * H, tw: hash(i + 77) * 6.28 });

function drawBackground() {
  const alt = Math.max(0, -cameraY);
  const dark = phase === 2 || phase === 3 || phase === 5;
  // nantucket "journey" 0..1 (beach → open water), used for the sunset sky
  const nanJ = clamp((alt - NAN_BOSS_AT) / (FARM_AT - NAN_BOSS_AT), 0, 1);
  let [top, bot] = skyAt(alt);
  if (dark) { top = [9, 9, 13]; bot = [30, 28, 38]; }
  if (phase === 5) { top = [6, 8, 14]; bot = [20, 16, 28]; } // chicken box blackout
  if (phase === 4) { top = [125, 195, 235]; bot = [205, 235, 215]; }
  if (phase === 6) {
    // bright beach blue that stays blue most of the climb, then warms into a
    // 'sconset sunset only up high
    const warm = clamp((nanJ - 0.5) / 0.5, 0, 1);
    top = [Math.round(lerp(120, 250, warm)), Math.round(lerp(196, 150, warm)), Math.round(lerp(236, 96, warm))];
    bot = [Math.round(lerp(196, 255, warm)), Math.round(lerp(226, 206, warm)), Math.round(lerp(236, 150, warm))];
  }
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
  g.addColorStop(1, `rgb(${bot[0]},${bot[1]},${bot[2]})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // shiny diagonal sheen sweeping across the black PE backdrop
  if (dark) {
    const sx = (t * 0.7) % (W + 400) - 200;
    const sh = ctx.createLinearGradient(sx, 0, sx + 150, H);
    sh.addColorStop(0, "rgba(212,175,55,0)");
    sh.addColorStop(0.5, "rgba(212,175,55,0.08)");
    sh.addColorStop(1, "rgba(212,175,55,0)");
    ctx.fillStyle = sh;
    ctx.fillRect(0, 0, W, H);
  }

  // stars: night sky in phase 1, gold glitter in the PE phases (never on ACK)
  const starA = dark ? 0.9 : (phase === 4 || phase === 6) ? 0 : clamp((alt - 11000) / 3500, 0, 1);
  if (starA > 0) {
    for (const s of stars) {
      const sy = ((s.y - cameraY * 0.12) % H + H) % H;
      ctx.globalAlpha = starA * (0.5 + 0.5 * Math.sin(t * 0.05 + s.tw));
      ctx.fillStyle = dark ? "#d4af37" : "#fff";
      ctx.fillRect(s.x, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
    if (!dark) {
      ctx.globalAlpha = starA;
      ctx.fillStyle = "#f4f1de";
      ctx.beginPath(); ctx.arc(W - 80, 100, 26, 0, 6.28); ctx.fill();
      ctx.fillStyle = `rgb(${top[0]},${top[1]},${top[2]})`;
      ctx.beginPath(); ctx.arc(W - 70, 92, 22, 0, 6.28); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // sun (sets as you climb; always shining over the farm and the beach)
  const sunA = dark ? 0 : (phase === 4 || phase === 6) ? 1 : clamp(1 - (alt - 9500) / 3000, 0, 1);
  if (sunA > 0) {
    // on ACK the sun sinks toward the horizon and reddens into a sunset
    const sx = phase === 6 ? 78 : W - 75;
    const sy = phase === 4 ? 88 : phase === 6 ? lerp(96, H * 0.55, nanJ) : 95 + alt * 0.028;
    if (sy < H + 60) {
      ctx.globalAlpha = sunA * 0.35;
      ctx.fillStyle = phase === 6 ? (nanJ > 0.6 ? "#ffb066" : "#fff3b0") : "#fff3b0";
      ctx.beginPath(); ctx.arc(sx, sy, phase === 6 ? 58 : 52, 0, 6.28); ctx.fill();
      ctx.globalAlpha = sunA;
      ctx.fillStyle = phase === 4 ? "#ffe9a3"
                    : phase === 6 ? (nanJ > 0.55 ? "#ff9248" : "#ffe9a3")
                    : alt > 7000 ? "#ff9d3b" : "#ffe9a3";
      ctx.beginPath(); ctx.arc(sx, sy, 32, 0, 6.28); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // clouds (dark smoky wisps in the PE phases, bright and puffy on the beach)
  const cloudA = dark ? 0.45 : (phase !== 4 && phase !== 6 && alt > 13000 ? 0.3 : 0.8);
  for (const c of clouds) {
    const cy = c.wy - cameraY * c.p;
    ctx.globalAlpha = cloudA;
    ctx.fillStyle = dark ? "#23232d" : "#fff";
    ctx.beginPath();
    ctx.ellipse(c.x, cy, 34 * c.s, 13 * c.s, 0, 0, 6.28);
    ctx.ellipse(c.x - 22 * c.s, cy + 4 * c.s, 20 * c.s, 10 * c.s, 0, 0, 6.28);
    ctx.ellipse(c.x + 22 * c.s, cy + 4 * c.s, 22 * c.s, 11 * c.s, 0, 0, 6.28);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // blimp with banner
  for (const b of blimps) {
    const by = b.wy - cameraY * b.p;
    const f = b.vx > 0 ? 1 : -1;
    ctx.save(); ctx.translate(b.x, by); ctx.scale(f, 1);
    ctx.fillStyle = "#d8dde6";
    ctx.beginPath(); ctx.ellipse(0, 0, 46, 16, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#b6bdc9";
    ctx.beginPath(); ctx.moveTo(-44, 0); ctx.lineTo(-58, -10); ctx.lineTo(-58, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#8a93a3";
    ctx.fillRect(-8, 14, 16, 7);
    ctx.strokeStyle = "#666"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(46, 0); ctx.lineTo(78, 6); ctx.stroke();
    const msg = b.msg || "GO LAX!";
    const bw = Math.max(56, msg.length * 5.6 + 12);
    ctx.fillStyle = "#fff";
    ctx.fillRect(78, -2, bw, 16);
    ctx.strokeStyle = "#bbb"; ctx.lineWidth = 1;
    ctx.strokeRect(78, -2, bw, 16);
    ctx.scale(f, 1); // un-mirror so banner text reads correctly
    ctx.fillStyle = "#d8332a";
    ctx.font = "bold 9px Arial"; ctx.textAlign = "center";
    ctx.fillText(msg, f * (78 + bw / 2), 10);
    ctx.restore();
  }

  // hot air balloon shaped like a lacrosse ball (red / orange — not yellow)
  for (const b of balloons) {
    const by = b.wy - cameraY * b.p;
    const col = b.col || "#d8332a", dk = shade(col, 0.7);
    ctx.save(); ctx.translate(b.x, by);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, 6.28); ctx.fill();
    ctx.strokeStyle = dk; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-9, 0, 22, -1.1, 1.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(9, 0, 22, 2.04, 4.24); ctx.stroke();
    ctx.strokeStyle = "#7a5533"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-10, 24); ctx.lineTo(-7, 40); ctx.moveTo(10, 24); ctx.lineTo(7, 40); ctx.stroke();
    ctx.fillStyle = "#8a5a2b";
    ctx.fillRect(-9, 40, 18, 11);
    ctx.strokeStyle = "#5e3c1a"; ctx.strokeRect(-9, 40, 18, 11);
    ctx.restore();
  }

  // Nantucket banner sayings, towed by planes (in town) or boats (over water)
  for (const b of banners) drawBanner(b);

  // NYSE-style tickers crawling across the buy side
  for (const tk of tickers) {
    const ty = tk.wy - cameraY * tk.p;
    const txt = (tk.up ? "▲ " : "▼ ") + tk.msg;
    ctx.font = "bold 13px 'Courier New', monospace";
    ctx.textAlign = "left";
    // dark strip behind the print
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(tk.x - 6, ty - 12, txt.length * 8.2 + 12, 18);
    const col = tk.up ? "#2eff6e" : "#ff4d4d";
    ctx.globalAlpha = 0.35; // glow pass
    ctx.fillStyle = col;
    ctx.fillText(txt, tk.x + 1, ty + 2);
    ctx.globalAlpha = 1;
    ctx.fillText(txt, tk.x, ty + 1);
  }

  // birds
  ctx.strokeStyle = alt > 9000 ? "#3a3a55" : "#3a4a55";
  ctx.lineWidth = 2;
  for (const b of birds) {
    const by = b.wy - cameraY * b.p;
    const w = Math.sin(b.flap) * 5;
    ctx.beginPath();
    ctx.moveTo(b.x - 8, by - w);
    ctx.quadraticCurveTo(b.x - 3, by + 3, b.x, by);
    ctx.quadraticCurveTo(b.x + 3, by + 3, b.x + 8, by - w);
    ctx.stroke();
  }

  drawStadium();
  drawNantucketScene(alt, nanJ);
  drawChickenBoxScene();
  drawFarmScene();
}

// A banner saying towed across the Nantucket sky by a little plane, or out
// over the water behind a boat.
function drawBanner(b) {
  const by = b.wy - cameraY * b.p;
  const f = b.vx > 0 ? 1 : -1;
  const msg = b.msg;
  const bw = Math.max(64, msg.length * 7.2 + 16);
  ctx.save(); ctx.translate(b.x, by);
  if (b.kind === "boat") {
    // a little motorboat with a wake, towing the banner behind it
    ctx.save(); ctx.scale(f, 1);
    ctx.fillStyle = "#f2f4f7";
    ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.lineTo(12, 9); ctx.lineTo(-14, 9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#2f6fa8"; ctx.fillRect(-10, -7, 16, 7); // cabin
    ctx.fillStyle = "rgba(255,255,255,0.7)"; // wake
    ctx.beginPath(); ctx.moveTo(-20, 7); ctx.lineTo(-34, 11); ctx.lineTo(-20, 11); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#9aa6b2"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-20, -2); ctx.lineTo(-44, -2); ctx.stroke(); // tow line
    ctx.restore();
    const tx = -44 * f - (f > 0 ? bw : 0);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fillRect(tx, -9, bw, 15);
    ctx.strokeStyle = "#2f6fa8"; ctx.lineWidth = 1; ctx.strokeRect(tx, -9, bw, 15);
    ctx.fillStyle = "#1d4e7a"; ctx.font = "bold 10px Arial"; ctx.textAlign = "center";
    ctx.fillText(msg, tx + bw / 2, 1.5);
  } else {
    // banner plane
    ctx.save(); ctx.scale(f, 1);
    ctx.fillStyle = "#e8403a";
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 5, 0, 0, 6.28); ctx.fill(); // fuselage
    ctx.fillStyle = "#c5302b";
    ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(-6, -9); ctx.lineTo(-1, 0); ctx.closePath(); ctx.fill(); // tail
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(4, 1, 8, 3, 0, 0, 6.28); ctx.fill(); // wing
    ctx.fillStyle = "#1d1f2a"; ctx.beginPath(); ctx.arc(18, -1, 2, 0, 6.28); ctx.fill(); // prop nose
    ctx.strokeStyle = "#9aa6b2"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-26, 0); ctx.stroke();
    ctx.restore();
    const tx = -26 * f - (f > 0 ? bw : 0);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fillRect(tx, -9, bw, 16);
    ctx.strokeStyle = "#d8403a"; ctx.lineWidth = 1; ctx.strokeRect(tx, -9, bw, 16);
    ctx.fillStyle = "#d8403a"; ctx.font = "bold 10px Arial"; ctx.textAlign = "center";
    ctx.fillText(msg, tx + bw / 2, 2);
  }
  ctx.restore();
}

// The farm: grass, fence, barn-house, rocking chair

  if (phase !== 4 || !farm) return;

  ctx.fillStyle = "#d9b25e";

  // roof

  // window with frame + flower box (kept well to the left of the door)

    ctx.fillText("CHILL", farm.chairX, gy - 74 + bobC);

    ctx.moveTo(farm.chairX - 5, gy - 70 + bobC);

}

// ---------- Nantucket scenery (the third act's evolving vista) ----------
function nanHouse(x, base, w, h, roofCol) {
  // grey-shingled house with white trim
  ctx.fillStyle = "#bcbfc4";
  ctx.fillRect(x, base - h, w, h);
  ctx.strokeStyle = "rgba(120,124,130,0.5)"; ctx.lineWidth = 1;
  for (let yy = base - h + 5; yy < base; yy += 5) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke(); }
  ctx.fillStyle = roofCol || "#8a8f96";
  ctx.beginPath(); ctx.moveTo(x - 3, base - h); ctx.lineTo(x + w / 2, base - h - h * 0.42); ctx.lineTo(x + w + 3, base - h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fbf7ec";
  const cols = Math.max(2, Math.floor(w / 14));
  for (let i = 0; i < cols; i++) ctx.fillRect(x + 5 + i * (w - 8) / cols, base - h + 6, 5, 6);
  ctx.fillStyle = "#6e5a44"; ctx.fillRect(x + w / 2 - 3, base - 10, 6, 10); // door
}

  // Sankaty-style: white tower with a red band, lit lantern + sweeping beam
  const h = 56;
  ctx.fillStyle = "#f4f4ef";
  ctx.beginPath(); ctx.moveTo(x - 9, base); ctx.lineTo(x - 6, base - h); ctx.lineTo(x + 6, base - h); ctx.lineTo(x + 9, base); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#d8332a"; ctx.fillRect(x - 7.6, base - h * 0.58, 15.2, 12); // red band
  ctx.fillStyle = "#2b2f36"; ctx.fillRect(x - 7, base - h - 4, 14, 4);          // gallery
  ctx.fillStyle = "#3a3f48"; ctx.fillRect(x - 5, base - h - 12, 10, 9);         // lantern room
  ctx.fillStyle = "#fff0b0"; ctx.beginPath(); ctx.arc(x, base - h - 7, 3, 0, 6.28); ctx.fill();
  ctx.fillStyle = "#2b2f36"; ctx.beginPath(); ctx.moveTo(x - 6, base - h - 12); ctx.lineTo(x, base - h - 18); ctx.lineTo(x + 6, base - h - 12); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.14 + 0.12 * (0.5 + 0.5 * Math.sin(t * 0.05));
  ctx.fillStyle = "#fff6c8";
  ctx.beginPath(); ctx.moveTo(x, base - h - 7); ctx.lineTo(x - 78, base - h - 26); ctx.lineTo(x - 78, base - h + 12); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function nanBoat(x, y, s) {
  s = s || 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = "rgba(255,255,255,0.6)"; // wake
  ctx.beginPath(); ctx.moveTo(-16, 6); ctx.lineTo(-30, 9); ctx.lineTo(-16, 9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f0f2f5"; // hull
  ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.lineTo(10, 7); ctx.lineTo(-12, 7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#2f6fa8"; ctx.fillRect(-8, -6, 12, 6); // cabin
  ctx.fillStyle = "#fff"; // sail
  ctx.beginPath(); ctx.moveTo(2, -22); ctx.lineTo(2, -1); ctx.lineTo(13, -1); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#9aa6b2"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(2, -22); ctx.lineTo(2, 0); ctx.stroke();

// the four foreground gradients (sand / harbor / lane / open sea) are fixed —
// build them once instead of every frame
const NAN_HZ = Math.round(H * 0.66);
const NAN_FG = (() => {
  const mk = (c0, c1) => { const g = ctx.createLinearGradient(0, NAN_HZ, 0, H); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; };
  return [mk("#ecdcab", "#d6bf86"), mk("#86b6d4", "#5d97bd"), mk("#c7d49a", "#aebd7f"), mk("#6aa6cf", "#3f7cab")];
})();
function drawNantucketScene(alt, j) {
  if (phase !== 6) return;
  const horizon = NAN_HZ;
  const band = nanBand(alt);

  // foreground surface below the horizon: sand, lane, harbor or open sea
  ctx.fillStyle = NAN_FG[band]; ctx.fillRect(0, horizon, W, H - horizon);
  if (band === 0) { ctx.fillStyle = "#7fb0cf"; ctx.fillRect(0, horizon - 9, W, 9); } // sea behind the beach
  if (band === 1 || band === 3) { // water shimmer
    ctx.strokeStyle = "rgba(255,255,255,0.22)"; ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) { const yy = horizon + 12 + i * 16; ctx.beginPath(); ctx.moveTo(24 + (i % 2) * 26, yy); ctx.lineTo(W - 24 - (i % 2) * 26, yy); ctx.stroke(); }
  }

  if (band === 0) {
    nanLighthouse(W - 60, horizon);
    ctx.strokeStyle = "#c2ad62"; ctx.lineWidth = 1; // dune grass
    for (let i = 0; i < 22; i++) { const gx = 12 + i * 17; ctx.beginPath(); ctx.moveTo(gx, horizon + 17); ctx.lineTo(gx + Math.sin(i) * 2, horizon + 7); ctx.stroke(); }
  } else if (band === 1) {
    for (let i = 0; i < 6; i++) nanHouse(10 + i * 64, horizon, 46, 28 + (i % 3) * 9, "#7f858c");
    const tx = Math.round(W * 0.52); // South Church tower
    ctx.fillStyle = "#f3f1ea"; ctx.fillRect(tx - 9, horizon - 66, 18, 66);
    ctx.fillStyle = "#e7e3d8"; ctx.fillRect(tx - 11, horizon - 52, 22, 4);
    ctx.fillStyle = "#caa23c"; ctx.beginPath(); ctx.arc(tx, horizon - 66, 9, 3.14, 6.28); ctx.fill();
    ctx.fillStyle = "#2b2f36"; ctx.beginPath(); ctx.arc(tx, horizon - 50, 3.4, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#7a5a36"; ctx.fillRect(0, horizon + 2, W, 3); // wharf line
  } else if (band === 2) {
    // Cisco Brewers, then a row of classic grey-shingled houses
    ctx.fillStyle = "#a9744a"; ctx.fillRect(10, horizon - 34, 74, 34);
    ctx.fillStyle = "#8a5d39"; ctx.fillRect(8, horizon - 39, 78, 6);
    ctx.fillStyle = "#3c2c1c"; ctx.fillRect(32, horizon - 16, 12, 16);
    ctx.fillStyle = "#1c5a3a"; ctx.fillRect(14, horizon - 31, 66, 11);
    ctx.fillStyle = "#fff"; ctx.font = "bold 8px Arial"; ctx.textAlign = "center";
    ctx.fillText("CISCO BREWERS", 47, horizon - 23);
    ctx.fillStyle = "#9a6a3c"; for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.ellipse(54 + i * 12, horizon - 5, 4, 6, 0, 0, 6.28); ctx.fill(); }
    nanHouse(100, horizon, 48, 30, "#7f858c");
    nanHouse(156, horizon, 52, 34, "#6f757c");
    nanHouse(222, horizon, 46, 28, "#7f858c");
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; // picket fence + roses
    ctx.beginPath(); ctx.moveTo(0, horizon + 9); ctx.lineTo(W, horizon + 9); ctx.stroke();
    for (let x = 6; x < W; x += 10) { ctx.beginPath(); ctx.moveTo(x, horizon + 3); ctx.lineTo(x, horizon + 14); ctx.stroke(); }
    ctx.fillStyle = "#e36b86"; for (let x = 22; x < W; x += 46) { ctx.beginPath(); ctx.arc(x, horizon + 4, 2, 0, 6.28); ctx.fill(); }
  } else {
    // open water — boats driving by
    nanBoat((t * 0.5) % (W + 120) - 60, horizon + 22, 1.1);
    nanBoat((W + 80) - (t * 0.34) % (W + 160), horizon + 58, 1.35);
    nanBoat((t * 0.7) % (W + 120) - 60, horizon + 96, 1.6);
  }
}

// ---------- The Chicken Box: a dark cash-only dive bar with a live band ----------
function drawChickenBoxScene() {
  if (phase !== 5) return;
  // the whole static bar (wall, neon glow, stage, shelf, CASH ONLY, counter) is
  // baked once — this is a single drawImage instead of a per-frame shadowBlur
  ctx.drawImage(barCanvas, 0, 0, W, H);
  // faint light-blue blackout haze drifting through
  ctx.globalAlpha = 0.06 + 0.04 * Math.sin(t * 0.04);
  ctx.fillStyle = "#5be1ff"; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  // string-light bulbs flickering on the (baked) wire
  for (let i = 0; i <= 10; i++) {
    const lx = i / 10 * W, ly = 40 + Math.sin(i / 10 * 3.14) * 20;
    ctx.fillStyle = ["#ffd27a", "#ff8a8a", "#8ad7ff", "#b6ff8a"][i % 4];
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(t * 0.1 + i);
    ctx.beginPath(); ctx.arc(lx, ly, 2.4, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // the odd neon flicker — a cheap dim over the sign
  if ((t % 200) < 4) { ctx.fillStyle = "rgba(12,12,18,0.5)"; ctx.fillRect(W / 2 - 92, 102, 184, 44); }
}

function drawGoose(g) {
  const gy = farm.ground - cameraY;
  const y = gy - 11 + Math.sin(g.t * 2) * 1.2;
  ctx.save();
  ctx.translate(g.x, y);
  ctx.scale(g.dir, 1);
  // legs waddling
  ctx.strokeStyle = "#f0a929"; ctx.lineWidth = 2;
  const step = Math.sin(g.t * 4) * 3;
  ctx.beginPath();
  ctx.moveTo(-3, 6); ctx.lineTo(-3 + step, 11);
  ctx.moveTo(3, 6); ctx.lineTo(3 - step, 11);
  ctx.stroke();
  // body
  ctx.fillStyle = g.golden ? "#f5cf5a" : "#fafafa";
  ctx.beginPath(); ctx.ellipse(0, 0, 13, 8, 0, 0, 6.28); ctx.fill();
  ctx.strokeStyle = g.golden ? "#c8a020" : "#cfcfcf"; ctx.lineWidth = 1; ctx.stroke();
  // tail nub + wing line
  ctx.fillStyle = g.golden ? "#e3ba3c" : "#e8e8e8";
  ctx.beginPath(); ctx.moveTo(-12, -3); ctx.lineTo(-18, -7); ctx.lineTo(-11, 1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-2, -1, 7, 4.5, -0.2, 0, 6.28); ctx.fill();
  // neck + head
  ctx.strokeStyle = g.golden ? "#f5cf5a" : "#fafafa"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(8, -4); ctx.quadraticCurveTo(13, -10, 13, -16); ctx.stroke();
  ctx.fillStyle = g.golden ? "#f5cf5a" : "#fafafa";
  ctx.beginPath(); ctx.arc(13, -18, 4.5, 0, 6.28); ctx.fill();
  ctx.fillStyle = "#f0a929";
  ctx.beginPath(); ctx.moveTo(16, -19); ctx.lineTo(22, -17.5); ctx.lineTo(16, -16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath(); ctx.arc(14, -19, 1.1, 0, 6.28); ctx.fill();
  ctx.restore();

  // a fresh egg hovering overhead, ready to tap
  if (g.egg) {
    const ey = gy - 44 + Math.sin(t * 0.15) * 3;
    ctx.globalAlpha = 0.5 + 0.25 * Math.sin(t * 0.2);
    ctx.strokeStyle = g.egg.golden ? "#ffd23b" : "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(g.x, ey, 14, 0, 6.28); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = g.egg.golden ? "#ffd23b" : "#fdfdf5";
    ctx.beginPath(); ctx.ellipse(g.x, ey, 6, 8, 0, 0, 6.28); ctx.fill();
    ctx.strokeStyle = g.egg.golden ? "#c8a020" : "#ccc"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath(); ctx.arc(g.x - 2, ey - 3, 1.8, 0, 6.28); ctx.fill();
  }
}

// The stadium scene at the bottom of the world (scrolls away as you climb).
// Baked to an offscreen canvas once — ~200 crowd/net draws per frame was a
// major cost while the stadium is on screen.
const STADIUM_TOP = 164; // turf line's y inside the baked canvas
const STADIUM_H = 410;
const stadiumCanvas = document.createElement("canvas");
(function bakeStadium() {
  stadiumCanvas.width = W * 2;
  stadiumCanvas.height = STADIUM_H * 2;
  const c = stadiumCanvas.getContext("2d");
  c.scale(2, 2);
  const gy = STADIUM_TOP;

  // bleachers
  c.fillStyle = "#8d96a3";
  c.fillRect(0, gy - 150, W, 132);
  for (let r = 0; r < 6; r++) {
    c.fillStyle = r % 2 ? "#7d8693" : "#98a1ae";
    c.fillRect(0, gy - 150 + r * 22, W, 22);
    for (let i = 0; i < 26; i++) {
      const cidx = r * 26 + i;
      const palette = ["#d8332a", "#1c2f5e", "#f0c419", "#3aa657", "#e8e8e8", "#7a4fbf"];
      c.fillStyle = palette[Math.floor(hash(cidx) * palette.length)];
      c.beginPath();
      c.arc(8 + i * 15 + hash(cidx + 500) * 8, gy - 150 + r * 22 + 9 + hash(cidx + 900) * 5, 4, 0, 6.28);
      c.fill();
    }
  }
  // pennant string above the crowd
  c.strokeStyle = "#555"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, gy - 152); c.lineTo(W, gy - 156); c.stroke();
  for (let i = 0; i < 14; i++) {
    const px = 10 + i * 29, py = gy - 153 - i * 0.28;
    c.fillStyle = i % 2 ? "#d8332a" : "#1c2f5e";
    c.beginPath(); c.moveTo(px, py); c.lineTo(px + 12, py); c.lineTo(px + 6, py + 12); c.closePath(); c.fill();
  }

  // ad board
  c.fillStyle = "#fff";
  c.fillRect(0, gy - 18, W, 18);
  c.fillStyle = "#1c7a3c";
  c.font = "bold 12px Arial"; c.textAlign = "center";
  for (let i = 0; i < 4; i++) c.fillText("🥍 LAX JUMP 🥍", 50 + i * 105, gy - 5);

  // turf
  for (let i = 0; i < 6; i++) {
    c.fillStyle = i % 2 ? "#74bd49" : "#7ec850";
    c.fillRect(0, gy + i * 40, W, 40);
  }
  c.strokeStyle = "rgba(255,255,255,0.6)";
  c.lineWidth = 3;
  c.beginPath(); c.moveTo(0, gy + 90); c.lineTo(W, gy + 90); c.stroke();
  c.beginPath(); c.arc(W / 2, gy + 90, 45, 0, 6.28); c.stroke();

  // lacrosse goal on the turf
  c.save();
  c.translate(W / 2, gy + 52);
  c.strokeStyle = "#ff7a1a"; c.lineWidth = 4;
  c.beginPath(); c.moveTo(-34, 26); c.lineTo(-34, -26); c.lineTo(34, -26); c.lineTo(34, 26); c.stroke();
  c.strokeStyle = "rgba(255,255,255,0.75)"; c.lineWidth = 1;
  for (let i = -3; i <= 3; i++) {
    c.beginPath(); c.moveTo(i * 10, -26); c.lineTo(i * 6, 24); c.stroke();
  }
  for (let j = 0; j < 4; j++) {
    c.beginPath(); c.moveTo(-34 + j * 3, -26 + j * 13); c.lineTo(34 - j * 3, -26 + j * 13); c.stroke();
  }
  c.restore();
})();

function drawStadium() {
  // turf line sits higher so the whole goal cage is visible at the start
  const gy = H - 84 - cameraY;
  if (gy - STADIUM_TOP > H || gy + (STADIUM_H - STADIUM_TOP) < 0) return;
  ctx.drawImage(stadiumCanvas, 0, gy - STADIUM_TOP, W, STADIUM_H);
}

// The Chicken Box bar, baked once (the neon's shadowBlur is the priciest op in
// the game — doing it per frame can hitch on phones, so we render it a single

(function bakeBar() {
  barCanvas.width = W * 2; barCanvas.height = H * 2;
  const c = barCanvas.getContext("2d"); c.scale(2, 2);

  c.strokeStyle = "rgba(0,0,0,0.4)"; c.lineWidth = 1;

  c.strokeStyle = "rgba(180,150,90,0.5)"; c.lineWidth = 1; // string-light wire
  c.beginPath(); c.moveTo(0, 40); c.quadraticCurveTo(W / 2, 60, W, 40); c.stroke();
  // neon sign (glow baked in)
  c.fillStyle = "#0c0c12"; c.fillRect(W / 2 - 92, 102, 184, 44);

  // stage + band
  const sx = 40, sy = 232;
  c.fillStyle = "#0e0b08"; c.fillRect(sx - 28, sy, 96, 30);
  c.fillStyle = "#15110c";
  for (let i = 0; i < 3; i++) {
    const mx = sx - 14 + i * 28;
    c.beginPath(); c.arc(mx, sy - 4, 4, 0, 6.28); c.fill();
    c.beginPath(); c.moveTo(mx - 5, sy); c.lineTo(mx, sy - 2); c.lineTo(mx + 5, sy); c.lineTo(mx, sy + 2); c.fill();
  }
  c.strokeStyle = "rgba(255,210,120,0.5)"; c.lineWidth = 1;

  // bottle shelf
