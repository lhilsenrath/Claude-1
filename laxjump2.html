<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lax Jump 2 💼</title>
<!-- Apple home-screen web app support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lax Jump 2">
<meta name="theme-color" content="#0e0e12">
<link rel="apple-touch-icon" sizes="180x180" href="icon2.png">
<link rel="icon" type="image/png" href="icon2.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0a2a14;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    position: fixed;
    width: 100%;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  #game { display: block; }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(() => {
"use strict";

// ---------- Canvas setup ----------
const W = 400, H = 640;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

if (typeof CanvasRenderingContext2D !== "undefined" &&
    !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (typeof r === "number") r = [r, r, r, r];
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y); this.arcTo(x + w, y, x + w, y + r[1], r[1]);
    this.lineTo(x + w, y + h - r[2]); this.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
    this.lineTo(x + r[3], y + h); this.arcTo(x, y + h, x, y + h - r[3], r[3]);
    this.lineTo(x, y + r[0]); this.arcTo(x, y, x + r[0], y, r[0]);
    return this;
  };
}

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  // cap pixel density at 2x: 3x retina more than doubles the pixels drawn
  // per frame for no visible gain in this art style
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W * scale + "px";
  canvas.style.height = H * scale + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);
resize();

// gradients are position-independent (local coords), so build them once
const GRADS = (() => {
  const mk = (y0, y1, c0, c1) => {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, c0); g.addColorStop(1, c1);
    return g;
  };
  const stick = ctx.createLinearGradient(12, 8, 26, -24);
  stick.addColorStop(0, "#9a9a9a"); stick.addColorStop(1, "#d8d8d8");
  return {
    platNormal: mk(5, 14, "#e8e8e8", "#9d9d9d"),
    platMoving: mk(5, 14, "#6aa9ee", "#2c66bd"),
    platWood:   mk(5, 14, "#b07a40", "#7c4f22"),
    jersey:     mk(-10, 10, "#e8433a", "#b3221b"),
    defJersey:  mk(-8, 14, "#33508f", "#16244a"),
    gold:       mk(4, 15, "#f7e08a", "#b8860b"),
    platinum:   mk(4, 15, "#e8ecf2", "#8d97a8"),
    junk:       mk(4, 15, "#8a8f99", "#52565e"),
    suit:       mk(-9, 10, "#34343e", "#0f0f14"),
    building:   mk(-16, 18, "#9aa0aa", "#5e646e"),
    stick,
  };
})();

// ---------- Helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, f) => a + (b - a) * f;
const hash = i => { const x = Math.sin(i * 127.1) * 43758.5453; return x - Math.floor(x); };

// ---------- Audio ----------
let actx = null;
function initAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.resume) actx.resume();
  } catch (e) { actx = null; }
}
function sfx(freq, dur, type, vol, slide) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), actx.currentTime + dur);
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
// Original southern-rock style solo for the eagle flight (a Free Bird homage —
// the real recording is copyrighted, so this riff is our own).
let soloTimer = null;
const SOLO = [330, 392, 440, 392, 440, 494, 587, 494,
              440, 494, 587, 659, 587, 494, 440, 392,
              330, 392, 440, 587, 659, 784, 659, 587];
function startEagleSolo() {
  if (!actx || soloTimer) return;
  let i = 0;
  soloTimer = setInterval(() => {
    sfx(SOLO[i % SOLO.length], 0.22, "sawtooth", 0.030, 0);
    sfx(SOLO[i % SOLO.length] / 2, 0.22, "triangle", 0.020, 0);
    i++;
  }, 150);
}
function stopEagleSolo() {
  if (soloTimer) { clearInterval(soloTimer); soloTimer = null; }
}

// Slick minor-key "finance" groove: walking bass + sparse lead. Kicks in when
// the boss falls and loops through the whole private equity climb.
let financeTimer = null;
const FIN_BASS = [110, 110, 131, 131, 147, 147, 131, 131,
                  110, 110, 131, 131, 165, 165, 147, 131];
const FIN_LEAD = [0, 440, 0, 523, 0, 587, 523, 0,
                  440, 0, 523, 0, 659, 0, 587, 523];
function startFinanceTune() {
  if (!actx || financeTimer) return;
  stopEagleSolo();
  let i = 0;
  financeTimer = setInterval(() => {
    sfx(FIN_BASS[i % 16], 0.20, "triangle", 0.045, 0);
    const lead = FIN_LEAD[i % 16];
    if (lead) sfx(lead, 0.14, "square", 0.018, 0);
    if (i % 4 === 2) sfx(2200, 0.04, "square", 0.008, 0); // hi-hat tick
    i++;
  }, 165);
}
function stopFinanceTune() {
  if (financeTimer) { clearInterval(financeTimer); financeTimer = null; }
}

const SND = {
  bounce: () => sfx(300, 0.10, "square", 0.030, 150),
  wood:   () => sfx(120, 0.16, "sawtooth", 0.050, -60),
  shot:   () => sfx(500, 0.18, "square", 0.045, 400),
  net:    () => sfx(420, 0.20, "triangle", 0.050, 250),
  coin:   () => sfx(880, 0.08, "triangle", 0.040, 200),
  shield: () => sfx(660, 0.30, "sine", 0.050, 220),
  eagle:  () => sfx(1100, 0.28, "sawtooth", 0.035, -550),
  flap:   () => sfx(180, 0.12, "triangle", 0.028, 60),
  portal: () => sfx(180, 0.60, "sine", 0.060, 900),
  ko:     () => sfx(180, 0.15, "square", 0.050, -80),
  over:   () => sfx(240, 0.50, "sawtooth", 0.055, -180),
};

// ---------- Constants ----------
const GRAVITY = 0.32;
const JUMP_V = -11.5;
const NET_V = -17.5;
const EAGLE_FRAMES = 140;
const SHIELD_FRAMES = 600;
const MOVE_ACC = 0.6;
const MAX_VX = 6.5;
const MAX_AMMO = 5;
const PLAT_W = 78, PLAT_H = 16;
const BOSS_AT = 20000;
const BOSS_HP = 10;

// milestone sayings fly by on blimp signs (lax slang below 20k, PE above)
const MILESTONES = [
  [1000,  "RIPPING IT!"],
  [2500,  "TOP SHELF!"],
  [5000,  "...WHERE MOMMA HIDES THE COOKIES"],
  [7500,  "BAR DOWN!"],
  [10000, "FULL FLOW MODE"],
  [15000, "LAX LEGEND"],
  [25000, "EBITDA POSITIVE"],
  [30000, "2 AND 20"],
  [40000, "FUND IV CLOSED"],
  [60000, "PE LEGEND"],
];
const BLIMP_MSGS = ["GO LAX!", "BAR DOWN!", "RIP IT!", "FLOW CHECK"];
const BLIMP_MSGS_PE = ["BUY LOW", "SELL HIGH", "DRY POWDER", "LBO SZN"];

// ---------- State ----------
let state = "title"; // title | playing | gameover
let player, platforms, coins, defenders, parts, shots, floats;
let clouds, birds, blimps, balloons;
let cameraY, score, ammo, newBest, overAt, lastPortalY, mileIdx, t = 0;
// phase 1 = lacrosse climb, 2 = Joe Dowling boss arena, 3 = private equity climb
let phase, boss, bossShots, pickups, srcDigit;
let best = +(localStorage.getItem("laxjump2_best") || 0);
let tiltX = 0, tiltSeen = false, isTouch = false;

function newPlatform(x, y, type) {
  return {
    x, y, type, // normal | moving | wood | net | floor
    w: PLAT_W,
    vx: type === "moving" ? (Math.random() < 0.5 ? -1.5 : 1.5) : 0,
    broken: false,
    item: null, // ball | shield | eagle
    portal: false,
    flash: 0,
  };
}

function difficulty() { return clamp(score / 15000, 0, 1); }

function spawnPlatformAt(y) {
  const d = difficulty();
  let type = "normal";
  const r = Math.random();
  if (score > 400 && r < 0.12 + 0.18 * d) type = "moving";
  else if (score > 600 && r < 0.27 + 0.38 * d) type = "wood";
  else if (score > 800 && r < 0.33 + 0.38 * d) type = "net";
  const p = newPlatform(rand(8, W - PLAT_W - 8), y, type);

  if (type === "normal") {
    const ir = Math.random();
    if (ir < 0.012) p.item = "eagle";
    else if (ir < 0.05) p.item = "shield";
    else if (ir < 0.14) p.item = "ball";
  }
  // pipeline segue portal (a few per run)
  if (type === "normal" && y < lastPortalY - 2000 && Math.random() < 0.03) {
    p.portal = true;
    p.item = null;
    lastPortalY = y;
  }
  platforms.push(p);

  if (Math.random() < 0.12) {
    coins.push({ x: rand(25, W - 25), y: y - rand(25, 65), taken: false });
  }
  if (score > 1200 && Math.random() < 0.05 + 0.05 * d) {
    defenders.push({ x: rand(45, W - 45), y: y - 65, t: Math.random() * 6.28, dead: false });
  }
}

function reset() {
  player = { x: W / 2, y: H - 130, vx: 0, vy: JUMP_V, facing: 1, eagle: 0, shield: 0,
             // 1-in-20 tribute to the legendary #22 (Gait / Powell at Syracuse)
             num: Math.random() < 0.05 ? "22" : "1" };
  platforms = []; coins = []; defenders = []; parts = []; shots = []; floats = [];
  clouds = []; birds = []; blimps = []; balloons = [];
  cameraY = 0; score = 0; ammo = 0; newBest = false; mileIdx = 0;
  lastPortalY = H;
  callOut = null;
  phase = 1; boss = null; bossShots = []; pickups = []; srcDigit = 0;
  stopEagleSolo();
  stopFinanceTune();

  platforms.push(newPlatform(W / 2 - PLAT_W / 2, H - 90, "normal"));
  let y = H - 160;
  while (y > -H) { spawnPlatformAt(y); y -= rand(58, 92); }

  for (let i = 0; i < 6; i++) {
    clouds.push({ wy: rand(-40, H * 0.8), x: rand(0, W), s: rand(0.6, 1.3), p: rand(0.5, 0.8), vx: rand(0.05, 0.2) });
  }
}

// ---------- Particles & popups ----------
function burst(x, y, n, color, speed, grav) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), v = rand(speed * 0.3, speed);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1,
                 life: rand(18, 36), max: 36, c: color, r: rand(1.5, 3.5), g: grav });
  }
}
function popup(x, y, txt, size) {
  floats.push({ x, y, txt, size: size || 13, life: 50, max: 50 });
}
// One big front-and-center saying at a time; a new one replaces the old
let callOut = null;
function callout(txt, life) { callOut = { txt, life: life || 70, max: life || 70 }; }

// ---------- Input ----------
const keys = {};
function tryStart() {
  if (state === "playing") return;
  if (state === "gameover" && performance.now() - overAt < 700) return;
  initAudio();
  enableTilt();
  reset();
  state = "playing";
}
window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (state !== "playing" && (e.key === " " || e.key === "Enter")) tryStart();
});
window.addEventListener("keyup", e => keys[e.key] = false);

function canvasPoint(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
}

// Tap a targeted defender (or the boss) to rip a shot at him (costs one ball)
function tryShoot(cx, cy) {
  if (state !== "playing" || ammo <= 0) return false;
  if (phase === 2) {
    if (!boss || boss.dead) return false;
    const dist = Math.hypot(boss.x - cx, (boss.y + boss.yOff - cameraY) - cy);
    if (dist > 70) return false;
    ammo--;
    shots.push({ x: player.x, y: player.y - 30, vx: 0, vy: -8, life: 140, target: null, hit: false });
    SND.shot();
    return true;
  }
  let bestD = 52, target = null;
  for (const d of defenders) {
    if (d.dead) continue;
    const dist = Math.hypot(d.x - cx, (d.y - cameraY) - cy);
    if (dist < bestD) { bestD = dist; target = d; }
  }
  if (!target) return false;
  ammo--;
  shots.push({ x: player.x + player.facing * 26, y: player.y - 30, vx: 0, vy: -8, life: 90, target, hit: false });
  SND.shot();
  return true;
}

let touchDir = 0;
window.addEventListener("touchstart", e => {
  isTouch = true;
  if (state !== "playing") { tryStart(); return; }
  const tc = e.touches[0];
  const pt = canvasPoint(tc.clientX, tc.clientY);
  if (tryShoot(pt.x, pt.y)) return;
  touchDir = tc.clientX < window.innerWidth / 2 ? -1 : 1;
}, { passive: false });
window.addEventListener("touchmove", e => {
  if (e.touches.length) touchDir = e.touches[0].clientX < window.innerWidth / 2 ? -1 : 1;
  e.preventDefault();
}, { passive: false });
window.addEventListener("touchend", e => { if (!e.touches.length) touchDir = 0; });
window.addEventListener("mousedown", e => {
  if (state !== "playing") { tryStart(); return; }
  const pt = canvasPoint(e.clientX, e.clientY);
  tryShoot(pt.x, pt.y);
});

// Tilt: iOS 13+ requires permission requested from a user gesture.
// tryStart() runs inside the touchstart handler, so the prompt is allowed.
let tiltListening = false;
function enableTilt() {
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission()
      .then(p => { if (p === "granted") listenTilt(); })
      .catch(() => {});
  } else {
    listenTilt();
  }
}
function listenTilt() {
  if (tiltListening) return;
  tiltListening = true;
  window.addEventListener("deviceorientation", e => {
    if (e.gamma == null) return;
    let angle = 0;
    if (screen.orientation && typeof screen.orientation.angle === "number") angle = screen.orientation.angle;
    else if (typeof window.orientation === "number") angle = window.orientation;
    let g;
    if (angle === 90) g = e.beta;
    else if (angle === -90 || angle === 270) g = -e.beta;
    else if (angle === 180) g = -e.gamma;
    else g = e.gamma;
    tiltSeen = true;
    const target = clamp(g / 15, -1, 1);
    tiltX = tiltX * 0.6 + target * 0.4;
  });
}

// ---------- Update ----------
function update() {
  t++;
  updateDecor();
  // particles & popups keep animating on overlays (e.g. record confetti)
  for (const q of parts) { q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--; }
  parts = parts.filter(q => q.life > 0);
  for (const f of floats) { f.y -= 0.7; f.life--; }
  floats = floats.filter(f => f.life > 0);
  if (callOut && --callOut.life <= 0) callOut = null;
  if (state !== "playing") return;

  // steering: keys > touch > tilt
  let dir = 0;
  if (keys["ArrowLeft"] || keys["a"]) dir = -1;
  else if (keys["ArrowRight"] || keys["d"]) dir = 1;
  else if (touchDir) dir = touchDir;
  else dir = tiltX;

  player.vx += dir * MOVE_ACC;
  player.vx *= 0.94;
  player.vx = clamp(player.vx, -MAX_VX, MAX_VX);
  if (Math.abs(player.vx) > 0.3) player.facing = player.vx > 0 ? 1 : -1;

  if (player.eagle > 0) {
    player.eagle--;
    const fade = Math.min(1, player.eagle / 25);
    player.vy = -15 * fade - 4 * (1 - fade);
    // drifting feathers (phase 3: white powder spraying off the player)
    if (t % (phase >= 3 ? 2 : 4) === 0) {
      parts.push({ x: player.x + rand(-18, 18), y: player.y - (phase >= 3 ? rand(-10, 30) : 40),
                   vx: rand(-0.8, 0.8), vy: rand(0.5, 1.5),
                   life: rand(20, 34), max: 34,
                   c: phase >= 3 ? "rgba(255,255,255,0.9)" : (Math.random() < 0.5 ? "#7a5533" : "#f0ead8"),
                   r: rand(1.5, 3), g: 0.02 });
    }
    if (player.eagle % 18 === 0) SND.flap();
  } else {
    stopEagleSolo();
    player.vy += GRAVITY;
  }
  if (player.shield > 0) player.shield--;

  player.x += player.vx;
  player.y += player.vy;
  if (player.x < -20) player.x = W + 20;
  if (player.x > W + 20) player.x = -20;

  if (phase === 2) { updateBoss(); return; }

  // platform collisions (only while falling, never during eagle flight)
  if (player.vy > 0 && player.eagle <= 0) {
    for (const p of platforms) {
      if (p.broken) continue;
      if (player.x > p.x - 12 && player.x < p.x + p.w + 12 &&
          player.y + 30 > p.y && player.y + 30 < p.y + PLAT_H + player.vy + 2) {
        player.y = p.y - 30;
        p.flash = 8;
        if (p.type === "net") {
          player.vy = NET_V;
          SND.net();
          burst(player.x, p.y, 6, "#ffd23b", 2, 0.1);
          callout(phase >= 3 ? "INVESTED!" : "CHERISHED!");
        } else {
          player.vy = JUMP_V;
          if (p.type === "wood") {
            // wood gives you ONE bounce, then shatters
            p.broken = true;
            SND.wood();
            burst(p.x + PLAT_W / 2, p.y + 6, 10, "#8a5a2b", 3, 0.25);
            burst(p.x + PLAT_W / 2, p.y + 6, 5, "#c89058", 2.5, 0.25);
          } else {
            SND.bounce();
            burst(player.x, p.y + 4, 4, "rgba(255,255,255,0.8)", 1.4, 0.05);
          }
        }
        break;
      }
    }
  }

  // moving platforms
  for (const p of platforms) {
    if (p.flash > 0) p.flash--;
    if (p.type === "moving" && !p.broken) {
      p.x += p.vx;
      if (p.x < 4 || p.x > W - PLAT_W - 4) p.vx *= -1;
    }
  }

  // pipeline segue portals
  for (const p of platforms) {
    if (!p.portal || p.broken) continue;
    const px = p.x + PLAT_W / 2, py = p.y - 34;
    const dx = player.x - px, dy = player.y - py;
    if (dx * dx + dy * dy < 34 * 34) {
      p.portal = false;
      SND.portal();
      burst(player.x, player.y, 18, "#b46cff", 5, 0);
      const exitY = p.y - 1100;
      platforms.push(newPlatform(clamp(player.x - PLAT_W / 2, 8, W - PLAT_W - 8), exitY + 46, "normal"));
      player.y = exitY;
      player.vy = -6;
      cameraY = Math.min(cameraY, player.y - H * 0.42);
      score = Math.max(score, Math.floor(-cameraY));
      burst(player.x, player.y, 18, "#5be1ff", 5, 0);
      if (phase >= 3) {
        // sourced a deal: rotating 1-9, worth digit x 100 points
        srcDigit = (srcDigit % 9) + 1;
        score += srcDigit * 100;
        callout("+$" + srcDigit + "B");
      } else {
        callout("PIPELINE!");
      }
    }
  }

  // item pickups (touch anywhere)
  for (const p of platforms) {
    if (!p.item || p.broken) continue;
    const ix = p.x + PLAT_W / 2, iy = p.y - 13;
    const dx = player.x - ix, dy = player.y - iy;
    if (dx * dx + dy * dy < 32 * 32) {
      if (p.item === "ball") {
        if (ammo < MAX_AMMO) { ammo++; popup(ix, iy, "+1 ball"); }
        SND.coin();
        burst(ix, iy, 8, "#ffe34d", 2.5, 0.05);
      } else if (p.item === "shield") {
        player.shield = SHIELD_FRAMES;
        SND.shield();
        burst(ix, iy, 12, "#5be1ff", 3, 0);
      } else if (p.item === "eagle") {
        player.eagle = EAGLE_FRAMES;
        SND.eagle();
        // in phase 3 the finance tune is already playing — don't start the solo
        if (phase < 3) startEagleSolo();
        callout(phase >= 3 ? "RACKED!" : "FREE BIRD!");
        burst(ix, iy, 14, phase >= 3 ? "#fff" : "#7a5533", 4, 0);
      }
      p.item = null;
    }
  }

  // golden balls: points + ammo for your stick
  for (const c of coins) {
    if (c.taken) continue;
    const dx = player.x - c.x, dy = player.y - c.y;
    if (dx * dx + dy * dy < 28 * 28) {
      c.taken = true;
      score += 50;
      if (ammo < MAX_AMMO) ammo++;
      SND.coin();
      burst(c.x, c.y, 8, "#ffd23b", 2.5, 0);
      popup(c.x, c.y, "+50");
    }
  }

  // shots fired at defenders
  for (const s of shots) {
    if (s.target && !s.target.dead) {
      const dx = s.target.x - s.x, dy = (s.target.y - s.y);
      const dist = Math.hypot(dx, dy) || 1;
      s.vx = dx / dist * 13;
      s.vy = dy / dist * 13;
      if (dist < 22) {
        s.hit = true;
        s.target.dead = true;
        score += 100;
        SND.ko();
        burst(s.target.x, s.target.y, 14, "#1c2f5e", 4, 0.2);
        burst(s.target.x, s.target.y - 10, 6, "#ffe34d", 3, 0.1);
        callout(phase >= 3 ? "ACQUIRED!" : "SQUID!");
        popup(s.target.x, s.target.y - 6, "+100");
      }
    }
    s.x += s.vx; s.y += s.vy; s.life--;
    parts.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 8, max: 8, c: "rgba(255,227,77,0.6)", r: 2.5, g: 0 });
  }
  shots = shots.filter(s => !s.hit && s.life > 0);

  // defenders
  for (const d of defenders) {
    if (d.dead) continue;
    d.t += 0.035;
    d.x += Math.sin(d.t) * 1.3;
    const dx = player.x - d.x, dy = player.y - d.y;
    if (dx * dx + dy * dy < 32 * 32) {
      if (player.vy > 0 && player.y < d.y - 6) {
        // stomp! bounce off the defender's head
        d.dead = true; score += 100;
        player.vy = -13;
        SND.ko();
        burst(d.x, d.y, 14, "#1c2f5e", 4, 0.2);
        burst(d.x, d.y - 12, 6, "#dfe3ec", 3, 0.2);
        popup(d.x, d.y - 20, "+100");
      } else if (player.eagle > 0) {
        d.dead = true; score += 100; SND.ko();
        burst(d.x, d.y, 14, "#1c2f5e", 4, 0.2);
        popup(d.x, d.y - 20, "+100");
      } else if (player.shield > 0) {
        d.dead = true; player.shield = 0; score += 100; SND.ko();
        burst(d.x, d.y, 14, "#1c2f5e", 4, 0.2);
        burst(player.x, player.y, 16, "#5be1ff", 4, 0);
        popup(d.x, d.y - 20, "+100");
      } else {
        gameOver();
      }
    }
  }

  // camera & score
  const targetCam = player.y - H * 0.42;
  if (targetCam < cameraY) {
    cameraY = targetCam;
    score = Math.max(score, Math.floor(-cameraY));
  }

  // the buy side awaits
  if (phase === 1 && score >= BOSS_AT) { enterBoss(); return; }

  // milestones fly by on blimp signs in the background
  while (mileIdx < MILESTONES.length && score >= MILESTONES[mileIdx][0]) {
    const fromLeft = Math.random() < 0.5;
    blimps.push({ x: fromLeft ? -90 : W + 90, wy: rand(80, 220) + cameraY * 0.7, p: 0.7,
                  vx: fromLeft ? 0.6 : -0.6, msg: MILESTONES[mileIdx][1] });
    mileIdx++;
  }

  // recycle & spawn
  platforms = platforms.filter(p => p.y < cameraY + H + 40);
  coins = coins.filter(c => !c.taken && c.y < cameraY + H + 40);
  defenders = defenders.filter(d => !d.dead && d.y < cameraY + H + 60);
  let topY = Infinity;
  for (const p of platforms) if (p.y < topY) topY = p.y;
  if (topY === Infinity) topY = cameraY + H;
  while (topY > cameraY - 60) {
    topY -= rand(58, 92 + 50 * difficulty());
    spawnPlatformAt(topY);
  }

  if (player.y > cameraY + H + 60) gameOver();
}

function gameOver() {
  if (state !== "playing") return;
  state = "gameover";
  overAt = performance.now();
  stopEagleSolo();
  stopFinanceTune();
  SND.over();
  if (navigator.vibrate) navigator.vibrate(120);
  if (score > best) {
    best = score; newBest = true;
    localStorage.setItem("laxjump_best", best);
    // confetti for the new record
    const colors = ["#d8332a", "#ffd23b", "#5be1ff", "#3aa657", "#fff", "#b46cff"];
    for (let i = 0; i < 5; i++) {
      burst(rand(40, W - 40), cameraY + rand(80, 300), 12, colors[i % colors.length], 4, 0.12);
    }
  }
}

// ---------- The buy side boss ----------
function enterBoss() {
  phase = 2;
  platforms = []; coins = []; defenders = []; shots = []; bossShots = []; pickups = [];
  // one full-width floor — there is no way to fall
  const floor = newPlatform(-20, cameraY + H - 50, "floor");
  floor.w = W + 40;
  platforms.push(floor);
  boss = { x: W / 2, y: cameraY + 120, yOff: 0, hp: BOSS_HP, t: 0, cool: 110, flash: 0, dead: false };
  callout("FINAL BOSS: PRIVATE EQUITY", 140);
  sfx(80, 0.9, "sawtooth", 0.07, -30);
}

function updateBoss() {
  // floor bounce
  if (player.vy > 0) {
    for (const p of platforms) {
      if (player.x > p.x - 12 && player.x < p.x + p.w + 12 &&
          player.y + 30 > p.y && player.y + 30 < p.y + PLAT_H + player.vy + 2) {
        player.y = p.y - 30;
        player.vy = JUMP_V;
        SND.bounce();
      }
    }
  }

  if (boss && !boss.dead) {
    boss.t += 0.018;
    boss.x = W / 2 + Math.sin(boss.t) * 130;
    boss.yOff = Math.sin(boss.t * 1.7) * 14;
    if (boss.flash > 0) boss.flash--;
    // slow lacrosse balls lobbed at the player
    if (--boss.cool <= 0) {
      boss.cool = 150;
      const bx = boss.x, by = boss.y + boss.yOff + 20;
      const dx = player.x - bx, dy = player.y - by;
      const dl = Math.hypot(dx, dy) || 1;
      bossShots.push({ x: bx, y: by, vx: dx / dl * 2.3, vy: dy / dl * 2.3, life: 700 });
      SND.shot();
    }
  }

  for (const b of bossShots) {
    b.x += b.vx; b.y += b.vy; b.life--;
    const dx = player.x - b.x, dy = player.y - b.y;
    if (dx * dx + dy * dy < 24 * 24) {
      if (player.shield > 0) {
        player.shield = 0; b.life = 0;
        burst(player.x, player.y, 14, "#5be1ff", 4, 0);
        SND.ko();
      } else {
        gameOver();
      }
    }
  }
  bossShots = bossShots.filter(b => b.life > 0 && b.x > -40 && b.x < W + 40 &&
                                    b.y > cameraY - 60 && b.y < cameraY + H + 60);

  // ammo balls keep spawning around the arena
  if (pickups.length < 4 && Math.random() < 0.014) {
    pickups.push({ x: rand(30, W - 30), y: cameraY + rand(H - 330, H - 95), taken: false });
  }
  for (const c of pickups) {
    const dx = player.x - c.x, dy = player.y - c.y;
    if (dx * dx + dy * dy < 28 * 28) {
      c.taken = true;
      if (ammo < MAX_AMMO) ammo++;
      SND.coin();
      burst(c.x, c.y, 8, "#ffd23b", 2.5, 0);
    }
  }
  pickups = pickups.filter(c => !c.taken);

  // player shots home in on the boss
  for (const s of shots) {
    if (boss && !boss.dead) {
      const tx = boss.x, ty = boss.y + boss.yOff;
      const dx = tx - s.x, dy = ty - s.y;
      const dist = Math.hypot(dx, dy) || 1;
      s.vx = dx / dist * 13;
      s.vy = dy / dist * 13;
      if (dist < 36) {
        s.hit = true;
        boss.hp--;
        boss.flash = 10;
        SND.ko();
        burst(tx, ty, 10, "#ffe34d", 3, 0.1);
        if (boss.hp <= 0) { defeatBoss(); return; }
      }
    }
    s.x += s.vx; s.y += s.vy; s.life--;
    parts.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 8, max: 8, c: "rgba(255,227,77,0.6)", r: 2.5, g: 0 });
  }
  shots = shots.filter(s => !s.hit && s.life > 0);
}

function defeatBoss() {
  burst(boss.x, boss.y + boss.yOff, 30, "#ffd23b", 6, 0.1);
  burst(boss.x, boss.y + boss.yOff, 20, "#16244a", 5, 0.15);
  boss = null;
  bossShots = []; pickups = []; shots = [];
  phase = 3;
  callout("EXITING BUY SIDE!", 220);
  sfx(400, 0.8, "triangle", 0.06, 500);
  startFinanceTune();
  // build the golden course upward from the arena floor
  lastPortalY = cameraY + H;
  let y = cameraY + H - 170;
  while (y > cameraY - 60) { spawnPlatformAt(y); y -= rand(58, 95); }
}

// ---------- Scenery ----------
function updateDecor() {
  for (const c of clouds) c.x += c.vx;
  for (const b of birds) { b.x += b.vx; b.flap += 0.25; }
  for (const b of blimps) b.x += b.vx;
  for (const b of balloons) { b.x += b.vx; b.wy -= 0.08; }

  const alt = Math.max(0, -cameraY);
  if (clouds.length < 9 && Math.random() < 0.04) {
    const p = rand(0.5, 0.8);
    clouds.push({ wy: -60 + cameraY * p, x: rand(-30, W + 30), s: rand(0.6, 1.4), p, vx: rand(0.05, 0.2) });
  }
  if (alt > 800 && alt < 10000 && birds.length < 3 && Math.random() < 0.006) {
    const fromLeft = Math.random() < 0.5;
    birds.push({ x: fromLeft ? -20 : W + 20, wy: rand(60, H * 0.6) + cameraY * 0.9, p: 0.9,
                 vx: fromLeft ? rand(0.8, 1.5) : -rand(0.8, 1.5), flap: rand(0, 6) });
  }
  if (((alt > 2000 && alt < 11000) || phase >= 3) && blimps.length < 1 && Math.random() < 0.002) {
    const fromLeft = Math.random() < 0.5;
    const msgs = phase >= 3 ? BLIMP_MSGS_PE : BLIMP_MSGS;
    blimps.push({ x: fromLeft ? -90 : W + 90, wy: rand(60, 200) + cameraY * 0.7, p: 0.7,
                  vx: fromLeft ? 0.35 : -0.35,
                  msg: msgs[Math.floor(Math.random() * msgs.length)] });
  }
  // lacrosse-ball hot air balloon
  if (alt > 1500 && alt < 9500 && balloons.length < 1 && Math.random() < 0.0015) {
    const fromLeft = Math.random() < 0.5;
    balloons.push({ x: fromLeft ? -60 : W + 60, wy: rand(120, 320) + cameraY * 0.6, p: 0.6,
                    vx: fromLeft ? 0.25 : -0.25 });
  }
  clouds = clouds.filter(c => c.wy - cameraY * c.p < H + 90 && c.x > -120 && c.x < W + 120);
  birds = birds.filter(b => b.x > -40 && b.x < W + 40 && b.wy - cameraY * b.p < H + 40);
  blimps = blimps.filter(b => b.x > -140 && b.x < W + 140 && b.wy - cameraY * b.p < H + 80);
  balloons = balloons.filter(b => b.x > -110 && b.x < W + 110 && b.wy - cameraY * b.p < H + 110);
}

const SKY = [
  { h: 0,     top: [110, 190, 235], bot: [185, 232, 245] },
  { h: 5000,  top: [ 60, 130, 215], bot: [150, 205, 240] },
  { h: 9000,  top: [120,  80, 160], bot: [255, 170, 110] },
  { h: 13000, top: [ 28,  32,  86], bot: [ 95,  72, 134] },
  { h: 17000, top: [  6,  10,  40], bot: [ 32,  42,  92] },
];
function skyAt(alt) {
  let a = SKY[SKY.length - 1], b = a;
  for (let i = 0; i < SKY.length - 1; i++) {
    if (alt >= SKY[i].h && alt < SKY[i + 1].h) { a = SKY[i]; b = SKY[i + 1]; break; }
  }
  const f = a === b ? 0 : (alt - a.h) / (b.h - a.h);
  const mix = (u, v) => [0, 1, 2].map(i => Math.round(lerp(u[i], v[i], f)));
  return [mix(a.top, b.top), mix(a.bot, b.bot)];
}

const stars = [];
for (let i = 0; i < 90; i++) stars.push({ x: hash(i) * W, y: hash(i + 200) * H, tw: hash(i + 77) * 6.28 });

function drawBackground() {
  const alt = Math.max(0, -cameraY);
  let [top, bot] = skyAt(alt);
  if (phase >= 2) { top = [9, 9, 13]; bot = [30, 28, 38]; }
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
  g.addColorStop(1, `rgb(${bot[0]},${bot[1]},${bot[2]})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // shiny diagonal sheen sweeping across the black PE backdrop
  if (phase >= 2) {
    const sx = (t * 0.7) % (W + 400) - 200;
    const sh = ctx.createLinearGradient(sx, 0, sx + 150, H);
    sh.addColorStop(0, "rgba(212,175,55,0)");
    sh.addColorStop(0.5, "rgba(212,175,55,0.08)");
    sh.addColorStop(1, "rgba(212,175,55,0)");
    ctx.fillStyle = sh;
    ctx.fillRect(0, 0, W, H);
  }

  // stars: night sky in phase 1, gold glitter in the PE phases
  const starA = phase >= 2 ? 0.9 : clamp((alt - 11000) / 3500, 0, 1);
  if (starA > 0) {
    for (const s of stars) {
      const sy = ((s.y - cameraY * 0.12) % H + H) % H;
      ctx.globalAlpha = starA * (0.5 + 0.5 * Math.sin(t * 0.05 + s.tw));
      ctx.fillStyle = phase >= 2 ? "#d4af37" : "#fff";
      ctx.fillRect(s.x, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
    if (phase < 2) {
      ctx.globalAlpha = starA;
      ctx.fillStyle = "#f4f1de";
      ctx.beginPath(); ctx.arc(W - 80, 100, 26, 0, 6.28); ctx.fill();
      ctx.fillStyle = `rgb(${top[0]},${top[1]},${top[2]})`;
      ctx.beginPath(); ctx.arc(W - 70, 92, 22, 0, 6.28); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // sun (sets as you climb)
  const sunA = phase >= 2 ? 0 : clamp(1 - (alt - 9500) / 3000, 0, 1);
  if (sunA > 0) {
    const sy = 95 + alt * 0.028;
    if (sy < H + 60) {
      ctx.globalAlpha = sunA * 0.35;
      ctx.fillStyle = "#fff3b0";
      ctx.beginPath(); ctx.arc(W - 75, sy, 52, 0, 6.28); ctx.fill();
      ctx.globalAlpha = sunA;
      ctx.fillStyle = alt > 7000 ? "#ff9d3b" : "#ffe9a3";
      ctx.beginPath(); ctx.arc(W - 75, sy, 32, 0, 6.28); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // clouds (dark smoky wisps in the PE phases)
  const cloudA = phase >= 2 ? 0.45 : (alt > 13000 ? 0.3 : 0.8);
  for (const c of clouds) {
    const cy = c.wy - cameraY * c.p;
    ctx.globalAlpha = cloudA;
    ctx.fillStyle = phase >= 2 ? "#23232d" : "#fff";
    ctx.beginPath();
    ctx.ellipse(c.x, cy, 34 * c.s, 13 * c.s, 0, 0, 6.28);
    ctx.ellipse(c.x - 22 * c.s, cy + 4 * c.s, 20 * c.s, 10 * c.s, 0, 0, 6.28);
    ctx.ellipse(c.x + 22 * c.s, cy + 4 * c.s, 22 * c.s, 11 * c.s, 0, 0, 6.28);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // blimp with banner
  for (const b of blimps) {
    const by = b.wy - cameraY * b.p;
    const f = b.vx > 0 ? 1 : -1;
    ctx.save(); ctx.translate(b.x, by); ctx.scale(f, 1);
    ctx.fillStyle = "#d8dde6";
    ctx.beginPath(); ctx.ellipse(0, 0, 46, 16, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#b6bdc9";
    ctx.beginPath(); ctx.moveTo(-44, 0); ctx.lineTo(-58, -10); ctx.lineTo(-58, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#8a93a3";
    ctx.fillRect(-8, 14, 16, 7);
    ctx.strokeStyle = "#666"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(46, 0); ctx.lineTo(78, 6); ctx.stroke();
    const msg = b.msg || "GO LAX!";
    const bw = Math.max(56, msg.length * 5.6 + 12);
    ctx.fillStyle = "#fff";
    ctx.fillRect(78, -2, bw, 16);
    ctx.strokeStyle = "#bbb"; ctx.lineWidth = 1;
    ctx.strokeRect(78, -2, bw, 16);
    ctx.scale(f, 1); // un-mirror so banner text reads correctly
    ctx.fillStyle = "#d8332a";
    ctx.font = "bold 9px Arial"; ctx.textAlign = "center";
    ctx.fillText(msg, f * (78 + bw / 2), 10);
    ctx.restore();
  }

  // hot air balloon shaped like a lacrosse ball
  for (const b of balloons) {
    const by = b.wy - cameraY * b.p;
    ctx.save(); ctx.translate(b.x, by);
    ctx.fillStyle = "#ffe34d";
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = "rgba(200,168,0,0.8)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(-9, 0, 22, -1.1, 1.1); ctx.stroke();
    ctx.beginPath(); ctx.arc(9, 0, 22, 2.04, 4.24); ctx.stroke();
    ctx.strokeStyle = "#7a5533"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-10, 24); ctx.lineTo(-7, 40); ctx.moveTo(10, 24); ctx.lineTo(7, 40); ctx.stroke();
    ctx.fillStyle = "#8a5a2b";
    ctx.fillRect(-9, 40, 18, 11);
    ctx.strokeStyle = "#5e3c1a"; ctx.strokeRect(-9, 40, 18, 11);
    ctx.restore();
  }

  // birds
  ctx.strokeStyle = alt > 9000 ? "#3a3a55" : "#3a4a55";
  ctx.lineWidth = 2;
  for (const b of birds) {
    const by = b.wy - cameraY * b.p;
    const w = Math.sin(b.flap) * 5;
    ctx.beginPath();
    ctx.moveTo(b.x - 8, by - w);
    ctx.quadraticCurveTo(b.x - 3, by + 3, b.x, by);
    ctx.quadraticCurveTo(b.x + 3, by + 3, b.x + 8, by - w);
    ctx.stroke();
  }

  drawStadium();
}

// The stadium scene at the bottom of the world (scrolls away as you climb).
// Baked to an offscreen canvas once — ~200 crowd/net draws per frame was a
// major cost while the stadium is on screen.
const STADIUM_TOP = 164; // turf line's y inside the baked canvas
const STADIUM_H = 410;
const stadiumCanvas = document.createElement("canvas");
(function bakeStadium() {
  stadiumCanvas.width = W * 2;
  stadiumCanvas.height = STADIUM_H * 2;
  const c = stadiumCanvas.getContext("2d");
  c.scale(2, 2);
  const gy = STADIUM_TOP;

  // bleachers
  c.fillStyle = "#8d96a3";
  c.fillRect(0, gy - 150, W, 132);
  for (let r = 0; r < 6; r++) {
    c.fillStyle = r % 2 ? "#7d8693" : "#98a1ae";
    c.fillRect(0, gy - 150 + r * 22, W, 22);
    for (let i = 0; i < 26; i++) {
      const cidx = r * 26 + i;
      const palette = ["#d8332a", "#1c2f5e", "#f0c419", "#3aa657", "#e8e8e8", "#7a4fbf"];
      c.fillStyle = palette[Math.floor(hash(cidx) * palette.length)];
      c.beginPath();
      c.arc(8 + i * 15 + hash(cidx + 500) * 8, gy - 150 + r * 22 + 9 + hash(cidx + 900) * 5, 4, 0, 6.28);
      c.fill();
    }
  }
  // pennant string above the crowd
  c.strokeStyle = "#555"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, gy - 152); c.lineTo(W, gy - 156); c.stroke();
  for (let i = 0; i < 14; i++) {
    const px = 10 + i * 29, py = gy - 153 - i * 0.28;
    c.fillStyle = i % 2 ? "#d8332a" : "#1c2f5e";
    c.beginPath(); c.moveTo(px, py); c.lineTo(px + 12, py); c.lineTo(px + 6, py + 12); c.closePath(); c.fill();
  }

  // ad board
  c.fillStyle = "#fff";
  c.fillRect(0, gy - 18, W, 18);
  c.fillStyle = "#1c7a3c";
  c.font = "bold 12px Arial"; c.textAlign = "center";
  for (let i = 0; i < 4; i++) c.fillText("🥍 LAX JUMP 🥍", 50 + i * 105, gy - 5);

  // turf
  for (let i = 0; i < 6; i++) {
    c.fillStyle = i % 2 ? "#74bd49" : "#7ec850";
    c.fillRect(0, gy + i * 40, W, 40);
  }
  c.strokeStyle = "rgba(255,255,255,0.6)";
  c.lineWidth = 3;
  c.beginPath(); c.moveTo(0, gy + 90); c.lineTo(W, gy + 90); c.stroke();
  c.beginPath(); c.arc(W / 2, gy + 90, 45, 0, 6.28); c.stroke();

  // lacrosse goal on the turf
  c.save();
  c.translate(W / 2, gy + 52);
  c.strokeStyle = "#ff7a1a"; c.lineWidth = 4;
  c.beginPath(); c.moveTo(-34, 26); c.lineTo(-34, -26); c.lineTo(34, -26); c.lineTo(34, 26); c.stroke();
  c.strokeStyle = "rgba(255,255,255,0.75)"; c.lineWidth = 1;
  for (let i = -3; i <= 3; i++) {
    c.beginPath(); c.moveTo(i * 10, -26); c.lineTo(i * 6, 24); c.stroke();
  }
  for (let j = 0; j < 4; j++) {
    c.beginPath(); c.moveTo(-34 + j * 3, -26 + j * 13); c.lineTo(34 - j * 3, -26 + j * 13); c.stroke();
  }
  c.restore();
})();

function drawStadium() {
  const gy = H - 46 - cameraY; // turf line, world-fixed
  if (gy - STADIUM_TOP > H || gy + (STADIUM_H - STADIUM_TOP) < 0) return;
  ctx.drawImage(stadiumCanvas, 0, gy - STADIUM_TOP, W, STADIUM_H);
}

// ---------- Entity drawing ----------
function drawPlatform(p) {
  if (p.broken) return;
  const y = p.y - cameraY;
  if (y < -90 || y > H + 30) return;
  ctx.save();
  ctx.translate(p.x, y + (p.flash > 0 ? p.flash * 0.4 : 0));

  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.13)";
  ctx.beginPath(); ctx.ellipse(p.w / 2, 16, p.w / 2 - 6, 4, 0, 0, 6.28); ctx.fill();

  if (phase >= 2) {
    // ----- private equity platforms -----
    ctx.fillStyle = p.type === "moving" ? GRADS.platinum :
                    p.type === "wood" ? GRADS.junk : GRADS.gold;
    ctx.beginPath(); ctx.roundRect(0, 4, p.w, 11, 3); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 1; ctx.stroke();
    // glossy highlight
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillRect(3, 5.5, p.w - 6, 2);
    // gold bar notches
    if (p.type !== "wood") {
      ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.lineWidth = 1;
      for (let i = 1; i < Math.floor(p.w / 26); i++) {
        ctx.beginPath(); ctx.moveTo(i * 26, 5); ctx.lineTo(i * 26, 14); ctx.stroke();
      }
    } else {
      // junk bond: cracked concrete
      ctx.strokeStyle = "rgba(20,20,25,0.6)"; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(10, 7); ctx.lineTo(24, 10); ctx.moveTo(40, 6); ctx.lineTo(50, 12);
      ctx.moveTo(32, 5); ctx.lineTo(34, 14);
      ctx.stroke();
    }
    // trampoline: a poor soul on hands and knees holding money up for you
    if (p.type === "net") {
      const cxm = p.w / 2;
      ctx.strokeStyle = "#c98c5a"; ctx.lineWidth = 4; // arms & legs
      ctx.beginPath();
      ctx.moveTo(cxm - 8, -2); ctx.lineTo(cxm - 9, 4);
      ctx.moveTo(cxm + 9, -2); ctx.lineTo(cxm + 10, 4);
      ctx.stroke();
      ctx.strokeStyle = "#6e6e76"; ctx.lineWidth = 7; // hunched back (worn gray shirt)
      ctx.beginPath(); ctx.moveTo(cxm - 10, -5); ctx.quadraticCurveTo(cxm, -12, cxm + 11, -5); ctx.stroke();
      ctx.fillStyle = "#c98c5a"; // head, looking down
      ctx.beginPath(); ctx.arc(cxm - 14, -4, 4.5, 0, 6.28); ctx.fill();
      // a hand holding bills up
      ctx.strokeStyle = "#c98c5a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cxm + 6, -8); ctx.lineTo(cxm + 9, -16); ctx.stroke();
      ctx.fillStyle = "#3aa657";
      ctx.fillRect(cxm + 4, -22, 12, 7);
      ctx.strokeStyle = "#1e6e35"; ctx.lineWidth = 1; ctx.strokeRect(cxm + 4, -22, 12, 7);
      ctx.fillStyle = "#bfe8c9"; ctx.font = "bold 6px Arial"; ctx.textAlign = "center";
      ctx.fillText("$", cxm + 10, -16.5);
    }
  } else {
    // ----- lacrosse stick platforms -----
    ctx.fillStyle = p.type === "moving" ? GRADS.platMoving :
                    p.type === "wood" ? GRADS.platWood : GRADS.platNormal;
    ctx.beginPath(); ctx.roundRect(0, 5, PLAT_W - 16, 9, 4); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1; ctx.stroke();

    // butt-end cap and tape wrap on the shaft
    ctx.fillStyle = p.type === "wood" ? "#5e3c1a" : "#d8332a";
    ctx.beginPath(); ctx.roundRect(0, 4, 5, 11, 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fillRect(14, 5, 3, 9);
    ctx.fillRect(20, 5, 3, 9);

    if (p.type === "wood") {
      ctx.strokeStyle = "rgba(60,35,10,0.55)"; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(8, 8); ctx.lineTo(26, 8);
      ctx.moveTo(34, 11); ctx.lineTo(52, 11);
      ctx.moveTo(30, 5); ctx.lineTo(33, 14);
      ctx.stroke();
    }
    if (p.type === "moving") {
      ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1;
      const off = (t * p.vx * 0.8) % 12;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(8 + i * 14 + off, 7); ctx.lineTo(14 + i * 14 + off, 7); ctx.stroke();
      }
    }

    // stick head
    ctx.fillStyle = "#f7f7f7"; ctx.strokeStyle = "#8a8a8a"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(PLAT_W - 16, 1);
    ctx.quadraticCurveTo(PLAT_W + 6, -3, PLAT_W + 2, 9);
    ctx.quadraticCurveTo(PLAT_W + 6, 21, PLAT_W - 16, 17);
    ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = "#c4c4c4"; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(PLAT_W - 13 + i * 5, 2); ctx.lineTo(PLAT_W - 13 + i * 5, 16); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(PLAT_W - 14, 9); ctx.lineTo(PLAT_W + 1, 9); ctx.stroke();

    // trampoline goal on net platforms
    if (p.type === "net") {
      ctx.strokeStyle = "#ff7a1a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(14, 4); ctx.lineTo(14, -20); ctx.lineTo(PLAT_W - 30, -20); ctx.lineTo(PLAT_W - 30, 4); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(14 + i * 8, -20); ctx.lineTo(14 + i * 8, 3); ctx.stroke();
      }
      for (let j = 1; j < 3; j++) {
        ctx.beginPath(); ctx.moveTo(14, -20 + j * 8); ctx.lineTo(PLAT_W - 30, -20 + j * 8); ctx.stroke();
      }
    }
  }

  // pipeline segue portal hovering over the platform
  if (p.portal) {
    const px = PLAT_W / 2, py = -34 + Math.sin(t * 0.07 + p.x) * 2;
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = "#b46cff";
    ctx.beginPath(); ctx.arc(px, py, 25, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#1a0533";
    ctx.beginPath(); ctx.arc(px, py, 12, 0, 6.28); ctx.fill();
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = k % 2 ? "#5be1ff" : "#b46cff";
      ctx.lineWidth = 3 - k * 0.5;
      ctx.beginPath();
      ctx.arc(px, py, 17 - k * 4, t * 0.1 + k * 2.1, t * 0.1 + k * 2.1 + 4.2);
      ctx.stroke();
    }
    // sparkle orbiting the portal
    const sx = px + Math.cos(t * 0.13) * 20, sy2 = py + Math.sin(t * 0.13) * 20;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(sx, sy2, 2, 0, 6.28); ctx.fill();

    // label + arrow pointing at it
    const lbl = phase >= 3 ? "SOURCED" : "PIPELINE SEGUE";
    ctx.font = "bold 11px Arial"; ctx.textAlign = "center";
    ctx.lineWidth = 3; ctx.strokeStyle = "#3d1166";
    ctx.strokeText(lbl, px, py - 38);
    ctx.fillStyle = "#fff";
    ctx.fillText(lbl, px, py - 38);
    const bobA = Math.sin(t * 0.15) * 2;
    ctx.fillStyle = "#ffe34d";
    ctx.beginPath();
    ctx.moveTo(px - 5, py - 33 + bobA);
    ctx.lineTo(px + 5, py - 33 + bobA);
    ctx.lineTo(px, py - 25 + bobA);
    ctx.closePath(); ctx.fill();
  }

  // item resting on the platform
  if (p.item) {
    const ix = PLAT_W / 2, iy = -10 + Math.sin(t * 0.08 + p.x) * 2;
    if (p.item === "ball" && phase >= 3) {
      drawCashStack(ix, iy);
    } else if (p.item === "shield" && phase >= 3) {
      // Peter Millar vest on a hanger
      ctx.save(); ctx.translate(ix, iy);
      ctx.fillStyle = "#1f3a5f";
      ctx.beginPath();
      ctx.moveTo(-7, -6); ctx.lineTo(-3, -9); ctx.lineTo(3, -9); ctx.lineTo(7, -6);
      ctx.lineTo(7, 8); ctx.lineTo(-7, 8); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#cfd8e8"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, 8); ctx.stroke(); // zipper
      ctx.beginPath(); ctx.moveTo(-3, -9); ctx.lineTo(0, -5); ctx.lineTo(3, -9); ctx.stroke(); // collar
      ctx.restore();
    } else if (p.item === "eagle" && phase >= 3) {
      // the little baggie
      ctx.save(); ctx.translate(ix, iy);
      ctx.fillStyle = "rgba(245,245,250,0.92)";
      ctx.beginPath(); ctx.roundRect(-6, -7, 12, 14, 3); ctx.fill();
      ctx.strokeStyle = "#aaa"; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.fillRect(-6, -8, 12, 3);
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.beginPath(); ctx.arc(-1, 2, 3.5, 0, 6.28); ctx.arc(2, 0, 3, 0, 6.28); ctx.fill();
      ctx.restore();
    } else if (p.item === "ball") {
      ctx.fillStyle = "#ffe34d";
      ctx.beginPath(); ctx.arc(ix, iy, 7, 0, 6.28); ctx.fill();
      ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.beginPath(); ctx.arc(ix - 2, iy - 2, 2, 0, 6.28); ctx.fill();
    } else if (p.item === "shield") {
      ctx.globalAlpha = 0.8 + 0.2 * Math.sin(t * 0.15);
      ctx.fillStyle = "#5be1ff";
      ctx.beginPath(); ctx.arc(ix, iy, 8, 0, 6.28); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ix, iy, 11, 0, 6.28); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (p.item === "eagle") {
      ctx.save(); ctx.translate(ix, iy);
      const fl = Math.sin(t * 0.3) * 4;
      ctx.fillStyle = "#7a5533";
      ctx.beginPath(); ctx.moveTo(-3, 0); ctx.quadraticCurveTo(-14, -6 - fl, -20, -1 - fl); ctx.quadraticCurveTo(-12, 4, -3, 3); ctx.fill();
      ctx.beginPath(); ctx.moveTo(3, 0); ctx.quadraticCurveTo(14, -6 - fl, 20, -1 - fl); ctx.quadraticCurveTo(12, 4, 3, 3); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, 1, 8, 5, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#f5f5f5";
      ctx.beginPath(); ctx.arc(7, -2, 4, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#f0a929";
      ctx.beginPath(); ctx.moveTo(10, -3); ctx.lineTo(14, -1); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#222";
      ctx.beginPath(); ctx.arc(8, -3, 1, 0, 6.28); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

// a banded stack of bills
function drawCashStack(x, y) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "#2e8a47";
  ctx.fillRect(-9, 0, 18, 4);
  ctx.fillStyle = "#3aa657";
  ctx.fillRect(-9, -4, 18, 4);
  ctx.fillStyle = "#46b865";
  ctx.fillRect(-9, -8, 18, 4);
  ctx.strokeStyle = "#1e6e35"; ctx.lineWidth = 1;
  ctx.strokeRect(-9, -8, 18, 12);
  ctx.fillStyle = "#e8d9a0"; // band
  ctx.fillRect(-3, -8, 6, 12);
  ctx.fillStyle = "#1e6e35";
  ctx.font = "bold 7px Arial"; ctx.textAlign = "center";
  ctx.fillText("$", 0, 1);
  ctx.restore();
}

function drawCoin(c) {
  const y = c.y - cameraY;
  if (y < -20 || y > H + 20) return;
  const bob = Math.sin(t * 0.1 + c.x) * 3;
  if (phase >= 3) { drawCashStack(c.x, y + bob); return; }
  ctx.fillStyle = "#ffd23b";
  ctx.beginPath(); ctx.arc(c.x, y + bob, 8, 0, 6.28); ctx.fill();
  ctx.strokeStyle = "#c89000"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = "rgba(200,144,0,0.7)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(c.x - 2, y + bob, 5, -0.6, 0.9); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.beginPath(); ctx.arc(c.x - 3, y + bob - 3, 2, 0, 6.28); ctx.fill();
}

function drawPlayerSprite(x, y, f) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(f, 1);

  if (phase >= 3) {
    // ----- the buy side fit: black suit, shades -----
    // legs: suit trousers + polished shoes
    ctx.strokeStyle = "#15151b"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-4, 14); ctx.lineTo(-8, 26); ctx.moveTo(4, 14); ctx.lineTo(9, 24); ctx.stroke();
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.roundRect(-15, 26, 10, 5, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(6, 24, 10, 5, 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)"; // shine on the shoes
    ctx.fillRect(-13, 27, 4, 1.5);
    ctx.fillRect(8, 25, 4, 1.5);

    // suit jacket
    ctx.fillStyle = GRADS.suit;
    ctx.beginPath(); ctx.roundRect(-11, -9, 22, 25, 5); ctx.fill();
    // white shirt + gold tie
    ctx.fillStyle = "#f2f2f2";
    ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(3, -8); ctx.lineTo(2, 8); ctx.lineTo(-2, 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c9a227";
    ctx.beginPath(); ctx.moveTo(-1.5, -7); ctx.lineTo(1.5, -7); ctx.lineTo(1, 6); ctx.lineTo(0, 8); ctx.lineTo(-1, 6); ctx.closePath(); ctx.fill();
    // lapels
    ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(-7, -1); ctx.moveTo(3, -8); ctx.lineTo(7, -1); ctx.stroke();
    // pocket square
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.moveTo(5, -3); ctx.lineTo(9, -3); ctx.lineTo(7, 0); ctx.closePath(); ctx.fill();

    // arms
    ctx.strokeStyle = "#15151b"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(8, -3); ctx.lineTo(16, 4); ctx.moveTo(-8, -3); ctx.lineTo(-13, 5); ctx.stroke();
    ctx.fillStyle = "#e8b88a"; // hands
    ctx.beginPath(); ctx.arc(17, 6, 3, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(-14, 7, 3, 0, 6.28); ctx.fill();

    // head: slicked hair + shades + smug chin
    ctx.fillStyle = "#e8b88a";
    ctx.beginPath(); ctx.arc(0, -17, 9.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#181210"; // slicked-back hair
    ctx.beginPath(); ctx.arc(0, -19, 9.5, 3.34, 6.0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-9, -20); ctx.quadraticCurveTo(-11, -14, -8, -11); ctx.lineTo(-6, -16); ctx.closePath(); ctx.fill();
    // shades
    ctx.fillStyle = "#0a0a0c";
    ctx.beginPath(); ctx.roundRect(-1, -20, 6, 5, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(6, -20, 6, 5, 2); ctx.fill();
    ctx.strokeStyle = "#0a0a0c"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(5, -18); ctx.lineTo(6, -18); ctx.moveTo(-1, -18); ctx.lineTo(-4, -19); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.45)"; // lens glint
    ctx.fillRect(7, -19, 2, 1.5);
    ctx.fillRect(0, -19, 2, 1.5);

    ctx.restore();
    return;
  }

  // legs + socks + cleats
  ctx.strokeStyle = "#e8b88a"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-4, 14); ctx.lineTo(-8, 24); ctx.moveTo(4, 14); ctx.lineTo(9, 22); ctx.stroke();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-8, 23); ctx.lineTo(-9, 27); ctx.moveTo(9, 21); ctx.lineTo(10, 25); ctx.stroke();
  ctx.fillStyle = "#222";
  ctx.beginPath(); ctx.roundRect(-15, 26, 10, 5, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(6, 24, 10, 5, 2); ctx.fill();

  // shorts
  ctx.fillStyle = "#1c2f5e";
  ctx.beginPath(); ctx.roundRect(-10, 8, 20, 9, 3); ctx.fill();

  // jersey
  ctx.fillStyle = GRADS.jersey;
  ctx.beginPath(); ctx.roundRect(-11, -9, 22, 19, 5); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillRect(-11, -7, 22, 2.5);
  ctx.font = "bold 11px Arial"; ctx.textAlign = "center";
  ctx.fillText((player && player.num) || "1", 0, 7);

  // arms + gloves
  ctx.strokeStyle = "#e8b88a"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(8, -3); ctx.lineTo(17, -11); ctx.moveTo(6, 5); ctx.lineTo(15, 1); ctx.stroke();
  ctx.fillStyle = "#d8332a";
  ctx.beginPath(); ctx.arc(18, -12, 3.5, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(16, 1, 3.5, 0, 6.28); ctx.fill();

  // stick
  ctx.strokeStyle = GRADS.stick; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(12, 9); ctx.lineTo(25, -24); ctx.stroke();
  ctx.strokeStyle = "#f0f0f0"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(28, -31, 7, 11, 0.45, 0, 6.28); ctx.stroke();
  ctx.strokeStyle = "#cfcfcf"; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(24, -37); ctx.lineTo(32, -25);
  ctx.moveTo(32, -37); ctx.lineTo(24, -25);
  ctx.moveTo(23, -31); ctx.lineTo(33, -31);
  ctx.stroke();

  // short blonde hair peeking out under the helmet
  ctx.fillStyle = "#f0c95c";
  ctx.beginPath(); ctx.ellipse(-7, -10, 5, 3.5, 0.5, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(1, -9.5, 2.5, 2, 0, 0, 6.28); ctx.fill();
  ctx.strokeStyle = "#d9a93a"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-9, -12); ctx.lineTo(-11, -7); ctx.moveTo(-6, -11); ctx.lineTo(-7, -7); ctx.stroke();

  // helmet: red shell, white stripe, visor, chrome cage, chin guard
  ctx.fillStyle = "#d8332a";
  ctx.beginPath(); ctx.arc(0, -17, 10.5, 0, 6.28); ctx.fill();
  ctx.strokeStyle = "#8f1812"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, -17, 9.5, -2.65, -0.5); ctx.stroke();
  // small brim over the eyes
  ctx.fillStyle = "#8f1812";
  ctx.beginPath(); ctx.roundRect(2, -24, 10, 3, 1.5); ctx.fill();
  // dark visor opening
  ctx.fillStyle = "#1d1f2a";
  ctx.beginPath(); ctx.roundRect(1, -21, 10, 6, 3); ctx.fill();
  // chrome facemask cage
  ctx.strokeStyle = "#d7dde8"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(3, -27); ctx.quadraticCurveTo(16, -20, 7, -7); ctx.stroke();
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(4 + i, -21 + i * 4.5); ctx.lineTo(12 - i * 0.7, -21.5 + i * 4.5); ctx.stroke();
  }
  // chin guard + strap
  ctx.fillStyle = "#e8e8e8";
  ctx.beginPath(); ctx.roundRect(5, -11, 7, 5, 2); ctx.fill();
  ctx.strokeStyle = "#999"; ctx.lineWidth = 1; ctx.stroke();

  ctx.restore();
}

function drawPlayer() {
  const x = player.x, y = player.y - cameraY;

  // phase 3: the little baggie hovers over you, spraying as it lifts
  if (player.eagle > 0 && phase >= 3) {
    ctx.save();
    ctx.translate(x, y - 44 + Math.sin(t * 0.3) * 2);
    ctx.fillStyle = "rgba(245,245,250,0.92)";
    ctx.beginPath(); ctx.roundRect(-8, -9, 16, 18, 4); ctx.fill();
    ctx.strokeStyle = "#aaa"; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.fillRect(-8, -11, 16, 4);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.beginPath(); ctx.arc(-2, 3, 5, 0, 6.28); ctx.arc(3, 0, 4, 0, 6.28); ctx.fill();
    ctx.restore();
  }

  // eagle carrying the player
  if (player.eagle > 0 && phase < 3) {
    ctx.save();
    ctx.translate(x, y - 48);
    ctx.scale(player.facing, 1);
    const flap = Math.sin(t * 0.45);
    // wings
    ctx.fillStyle = "#6b4a2b";
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.quadraticCurveTo(-30, -10 - flap * 14, -46, -2 - flap * 20);
    ctx.quadraticCurveTo(-27, 9, -6, 6);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(6, 0);
    ctx.quadraticCurveTo(30, -10 - flap * 14, 46, -2 - flap * 20);
    ctx.quadraticCurveTo(27, 9, 6, 6);
    ctx.closePath(); ctx.fill();
    // tail
    ctx.fillStyle = "#5e3f23";
    ctx.beginPath(); ctx.moveTo(-12, 3); ctx.lineTo(-22, 10); ctx.lineTo(-12, 9); ctx.closePath(); ctx.fill();
    // body
    ctx.fillStyle = "#7a5533";
    ctx.beginPath(); ctx.ellipse(0, 3, 14, 8, 0, 0, 6.28); ctx.fill();
    // white head + beak + eye
    ctx.fillStyle = "#f5f5f5";
    ctx.beginPath(); ctx.arc(13, -2, 6.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#f0a929";
    ctx.beginPath(); ctx.moveTo(18, -4); ctx.lineTo(25, -1); ctx.lineTo(18, 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(14, -4, 1.3, 0, 6.28); ctx.fill();
    // talons gripping the player
    ctx.strokeStyle = "#f0a929"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-5, 10); ctx.lineTo(-5, 19); ctx.moveTo(5, 10); ctx.lineTo(5, 19); ctx.stroke();
    ctx.restore();
  }

  drawPlayerSprite(x, y, player.facing);

  // the Peter Millar vest, worn over the suit while the shield is active
  if (player.shield > 0 && phase >= 3) {
    const fade = player.shield < 120 ? (Math.sin(t * 0.4) * 0.4 + 0.6) : 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(player.facing, 1);
    ctx.globalAlpha = fade;
    ctx.fillStyle = "#1f3a5f";
    ctx.beginPath(); ctx.roundRect(-10, -8, 20, 22, 5); ctx.fill();
    ctx.strokeStyle = "#cfd8e8"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, 13); ctx.stroke(); // zipper
    ctx.beginPath(); ctx.moveTo(-5, -8); ctx.lineTo(0, -3); ctx.lineTo(5, -8); ctx.stroke(); // collar
    ctx.fillStyle = "#cfd8e8"; // zipper pull
    ctx.fillRect(-1, -4, 2, 3);
    // shimmer so you can tell it's protecting you
    ctx.strokeStyle = "rgba(91,225,255," + (0.5 * fade) + ")"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(-11.5, -9.5, 23, 25, 6); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // loaded ammo: cash in hand (PE) or ball in the stick pocket (lax)
  if (ammo > 0) {
    if (phase >= 3) {
      ctx.save();
      ctx.translate(x + player.facing * 18, y + 4);
      ctx.scale(0.7, 0.7);
      drawCashStack(0, 0);
      ctx.restore();
    } else {
      ctx.fillStyle = "#ffe34d";
      ctx.beginPath(); ctx.arc(x + player.facing * 28, y - 31, 4.5, 0, 6.28); ctx.fill();
      ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  // force field bubble (lacrosse phases)
  if (player.shield > 0 && phase < 3) {
    const fade = player.shield < 120 ? (Math.sin(t * 0.4) * 0.5 + 0.5) : 1;
    const r = 40 + Math.sin(t * 0.15) * 2;
    ctx.globalAlpha = 0.16 * fade;
    ctx.fillStyle = "#5be1ff";
    ctx.beginPath(); ctx.arc(x, y - 4, r, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 0.75 * fade;
    ctx.strokeStyle = "#9aefff"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y - 4, r, 0, 6.28); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawDefender(d) {
  const x = d.x, y = d.y - cameraY;
  if (y < -50 || y > H + 50) return;
  const swing = Math.sin(d.t * 2) * 0.22;
  ctx.save();
  ctx.translate(x, y);

  if (phase >= 3) {
    // ----- a public firm, embodied: grumpy office tower with legs -----
    ctx.rotate(Math.sin(d.t * 1.5) * 0.05);
    // little legs
    ctx.strokeStyle = "#3c3f46"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-6, 18); ctx.lineTo(-7, 24); ctx.moveTo(6, 18); ctx.lineTo(7, 24); ctx.stroke();
    // tower
    ctx.fillStyle = GRADS.building;
    ctx.beginPath(); ctx.roundRect(-13, -18, 26, 36, 2); ctx.fill();
    ctx.strokeStyle = "#3c3f46"; ctx.lineWidth = 1.5; ctx.stroke();
    // antenna
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, -25); ctx.stroke();
    ctx.fillStyle = "#d8332a";
    ctx.beginPath(); ctx.arc(0, -26, 1.8, 0, 6.28); ctx.fill();
    // lit windows
    for (let r = 0; r < 4; r++) for (let cI = 0; cI < 3; cI++) {
      ctx.fillStyle = hash(r * 3 + cI + d.y) < 0.5 ? "#ffd23b" : "#2b2e35";
      ctx.fillRect(-10 + cI * 7.5, -8 + r * 6, 5, 4);
    }
    // angry eyes + frown above the windows
    ctx.fillStyle = "#fff";
    ctx.fillRect(-9, -16, 7, 4.5);
    ctx.fillRect(2, -16, 7, 4.5);
    ctx.fillStyle = "#111";
    ctx.fillRect(-7, -15, 3, 2.5);
    ctx.fillRect(4, -15, 3, 2.5);
    ctx.strokeStyle = "#111"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-9, -18.5); ctx.lineTo(-3, -16.5); ctx.moveTo(9, -18.5); ctx.lineTo(3, -16.5); ctx.stroke();
    // ticker sign
    ctx.fillStyle = "#16244a";
    ctx.fillRect(-9, 12, 18, 5);
    ctx.fillStyle = "#5be1ff"; ctx.font = "bold 4.5px Arial"; ctx.textAlign = "center";
    ctx.fillText("PUBCO", 0, 16);

    // red target reticle — same as ever
    const pulse2 = 0.45 + 0.3 * Math.sin(t * 0.18);
    ctx.globalAlpha = ammo > 0 ? pulse2 + 0.25 : pulse2 * 0.6;
    ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, 6.28); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -23); ctx.lineTo(0, -13);
    ctx.moveTo(0, 13); ctx.lineTo(0, 23);
    ctx.moveTo(-23, 0); ctx.lineTo(-13, 0);
    ctx.moveTo(13, 0); ctx.lineTo(23, 0);
    ctx.stroke();
    ctx.fillStyle = "#ff3b30";
    ctx.beginPath(); ctx.arc(0, 0, 2, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }

  // long defensive pole (swinging)
  ctx.save();
  ctx.rotate(swing);
  ctx.strokeStyle = "#b5b5b5"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-32, 5); ctx.lineTo(32, -3); ctx.stroke();
  ctx.strokeStyle = "#eee"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(35, -4, 5, 8, 1.4, 0, 6.28); ctx.stroke();
  ctx.restore();

  // legs
  ctx.strokeStyle = "#e8b88a"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-4, 14); ctx.lineTo(-7, 22); ctx.moveTo(4, 14); ctx.lineTo(7, 22); ctx.stroke();

  // jersey
  ctx.fillStyle = GRADS.defJersey;
  ctx.beginPath(); ctx.roundRect(-11, -7, 22, 21, 5); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 10px Arial"; ctx.textAlign = "center";
  ctx.fillText("X", 0, 8);

  // helmet
  ctx.fillStyle = "#dfe3ec";
  ctx.beginPath(); ctx.arc(0, -15, 9, 0, 6.28); ctx.fill();
  ctx.strokeStyle = "#888"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "#2b2b34";
  ctx.beginPath(); ctx.roundRect(-9, -19, 9, 5, 2); ctx.fill();
  ctx.strokeStyle = "#16244a"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, -15, 8.5, -2.4, -0.7); ctx.stroke();

  // red target reticle — tap to shoot when you have a ball loaded
  const pulse = 0.45 + 0.3 * Math.sin(t * 0.18);
  ctx.globalAlpha = ammo > 0 ? pulse + 0.25 : pulse * 0.6;
  ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -2, 15, 0, 6.28); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -21); ctx.lineTo(0, -13);
  ctx.moveTo(0, 9); ctx.lineTo(0, 17);
  ctx.moveTo(-19, -2); ctx.lineTo(-11, -2);
  ctx.moveTo(11, -2); ctx.lineTo(19, -2);
  ctx.stroke();
  ctx.fillStyle = "#ff3b30";
  ctx.beginPath(); ctx.arc(0, -2, 2, 0, 6.28); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawShots() {
  for (const s of shots) {
    const y = s.y - cameraY;
    if (phase >= 3) {
      ctx.save();
      ctx.translate(s.x, y);
      ctx.rotate(t * 0.3);
      ctx.scale(0.7, 0.7);
      drawCashStack(0, 4);
      ctx.restore();
      continue;
    }
    ctx.fillStyle = "#ffe34d";
    ctx.beginPath(); ctx.arc(s.x, y, 5, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = "rgba(255,227,77,0.5)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(s.x - s.vx, y - s.vy); ctx.lineTo(s.x - s.vx * 2.2, y - s.vy * 2.2); ctx.stroke();
  }
}

// ---------- Boss arena drawing ----------
function drawBoss() {
  if (!boss) return;
  const x = boss.x, y = boss.y + boss.yOff - cameraY;
  ctx.save();
  ctx.translate(x, y);
  const f = player.x < boss.x ? -1 : 1;
  ctx.scale(1.8 * f, 1.8);

  // suit trousers + shoes
  ctx.strokeStyle = "#15151b"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-4, 14); ctx.lineTo(-7, 25); ctx.moveTo(4, 14); ctx.lineTo(8, 24); ctx.stroke();
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.roundRect(-13, 25, 9, 4, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(5, 23, 9, 4, 2); ctx.fill();

  // suit jacket (charcoal) + red power tie
  ctx.fillStyle = GRADS.suit;
  ctx.beginPath(); ctx.roundRect(-12, -9, 24, 26, 5); ctx.fill();
  ctx.fillStyle = "#f2f2f2";
  ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(3, -8); ctx.lineTo(2, 9); ctx.lineTo(-2, 9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#b3221b";
  ctx.beginPath(); ctx.moveTo(-1.5, -7); ctx.lineTo(1.5, -7); ctx.lineTo(1, 7); ctx.lineTo(0, 9); ctx.lineTo(-1, 7); ctx.closePath(); ctx.fill();

  // arm cradling a lacrosse stick (his weapon)
  ctx.strokeStyle = "#15151b"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(9, -3); ctx.lineTo(16, -10); ctx.stroke();
  ctx.strokeStyle = "#b5b5b5"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(22, -22); ctx.stroke();
  ctx.strokeStyle = "#eee"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(24, -27, 5, 8, 0.45, 0, 6.28); ctx.stroke();

  // head: gray slicked hair, shades, scowl
  ctx.fillStyle = "#e3b491";
  ctx.beginPath(); ctx.arc(0, -17, 9.5, 0, 6.28); ctx.fill();
  ctx.fillStyle = "#9aa0a8";
  ctx.beginPath(); ctx.arc(0, -19, 9.5, 3.34, 6.0); ctx.fill();
  ctx.fillStyle = "#0a0a0c";
  ctx.beginPath(); ctx.roundRect(-1, -20, 6, 5, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(6, -20, 6, 5, 2); ctx.fill();
  ctx.strokeStyle = "#111"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(2, -11); ctx.lineTo(8, -12); ctx.stroke(); // scowl

  // white flash when hit
  if (boss.flash > 0) {
    ctx.globalAlpha = boss.flash / 10 * 0.6;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(0, -2, 26, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // target reticle on the boss
  const pulse = 0.45 + 0.3 * Math.sin(t * 0.18);
  ctx.globalAlpha = ammo > 0 ? pulse + 0.25 : pulse * 0.6;
  ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(x, y - 4, 34, 0, 6.28); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y - 46); ctx.lineTo(x, y - 30);
  ctx.moveTo(x, y + 22); ctx.lineTo(x, y + 38);
  ctx.moveTo(x - 46, y - 4); ctx.lineTo(x - 30, y - 4);
  ctx.moveTo(x + 30, y - 4); ctx.lineTo(x + 46, y - 4);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawBossHUD() {
  if (!boss) return;
  ctx.fillStyle = "#fff";
  ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
  ctx.fillText("PRIVATE EQUITY", W / 2, 56);
  const bw = 180, bx = W / 2 - bw / 2, byy = 62;
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(bx - 2, byy - 2, bw + 4, 12);
  for (let i = 0; i < BOSS_HP; i++) {
    ctx.fillStyle = i < boss.hp ? "#d8332a" : "rgba(255,255,255,0.15)";
    ctx.fillRect(bx + i * (bw / BOSS_HP) + 1, byy, bw / BOSS_HP - 2, 8);
  }
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "11px Arial";
  ctx.fillText("grab balls · tap him to shoot · 10 hits", W / 2, 86);
}

function drawBossShots() {
  for (const b of bossShots) {
    const y = b.y - cameraY;
    ctx.fillStyle = "#ffe34d";
    ctx.beginPath(); ctx.arc(b.x, y, 7, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = "rgba(255,227,77,0.4)"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(b.x - b.vx * 2, y - b.vy * 2); ctx.lineTo(b.x - b.vx * 5, y - b.vy * 5); ctx.stroke();
  }
}

function drawPickups() {
  for (const c of pickups) {
    const y = c.y - cameraY + Math.sin(t * 0.1 + c.x) * 3;
    ctx.fillStyle = "#ffe34d";
    ctx.beginPath(); ctx.arc(c.x, y, 8, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath(); ctx.arc(c.x - 3, y - 3, 2, 0, 6.28); ctx.fill();
  }
}

function drawParticles() {
  for (const q of parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y - cameraY, q.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloats() {
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    ctx.font = "bold " + f.size + "px Arial"; ctx.textAlign = "center";
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(20,40,20,0.8)";
    ctx.strokeText(f.txt, f.x, f.y - cameraY);
    ctx.fillStyle = "#fff";
    ctx.fillText(f.txt, f.x, f.y - cameraY);
  }
  ctx.globalAlpha = 1;
}

// ---------- HUD & overlays ----------
function drawHUD() {
  ctx.fillStyle = "rgba(10,20,12,0.35)";
  ctx.fillRect(0, 0, W, 38);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px Arial"; ctx.textAlign = "left";
  ctx.fillText("🥍 " + score, 12, 27);
  ctx.textAlign = "right";
  ctx.font = "13px Arial"; ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.fillText("BEST " + best, W - 12, 25);

  // ammo loaded: balls (lax) or cash stacks (PE)
  for (let i = 0; i < ammo; i++) {
    const ax = W / 2 - (MAX_AMMO - 1) * 8 + i * 16;
    if (phase >= 3) {
      ctx.save(); ctx.translate(ax, 21); ctx.scale(0.6, 0.6); drawCashStack(0, 4); ctx.restore();
    } else {
      ctx.fillStyle = "#ffe34d";
      ctx.beginPath(); ctx.arc(ax, 19, 6, 0, 6.28); ctx.fill();
      ctx.strokeStyle = "#c8a800"; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  if (phase === 2) drawBossHUD();

  // active power-up bars
  let by = 48;
  if (player && player.shield > 0) {
    ctx.fillStyle = "rgba(91,225,255,0.9)";
    ctx.font = "13px Arial"; ctx.textAlign = "left";
    ctx.fillText("🛡", 10, by + 4);
    ctx.fillStyle = "rgba(91,225,255,0.4)"; ctx.fillRect(30, by - 5, 70, 7);
    ctx.fillStyle = "#5be1ff"; ctx.fillRect(30, by - 5, 70 * player.shield / SHIELD_FRAMES, 7);
    by += 20;
  }
  if (player && player.eagle > 0) {
    ctx.font = "13px Arial"; ctx.textAlign = "left"; ctx.fillStyle = "#caa472";
    ctx.fillText(phase >= 3 ? "💨" : "🦅", 10, by + 4);
    ctx.fillStyle = "rgba(122,85,51,0.4)"; ctx.fillRect(30, by - 5, 70, 7);
    ctx.fillStyle = "#a87b46"; ctx.fillRect(30, by - 5, 70 * player.eagle / EAGLE_FRAMES, 7);
  }

  if (isTouch && !tiltSeen && score < 400) {
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.font = "13px Arial"; ctx.textAlign = "center";
    ctx.fillText("tilt not detected — touch left/right side to steer", W / 2, H - 16);
  }
}

function bigText(txt, x, y, size, fill, stroke) {
  ctx.font = "900 " + size + "px Arial";
  ctx.textAlign = "center";
  if (stroke) { ctx.lineWidth = size / 9; ctx.strokeStyle = stroke; ctx.strokeText(txt, x, y); }
  ctx.fillStyle = fill;
  ctx.fillText(txt, x, y);
}

function drawTitle() {
  ctx.fillStyle = "rgba(8,30,16,0.5)";
  ctx.fillRect(0, 0, W, H);

  const bob = Math.sin(t * 0.06) * 5;
  bigText("LAX", W / 2, 175 + bob * 0.4, 76, "#fff", "#14532d");
  bigText("JUMP 2", W / 2, 243 + bob * 0.4, 56, "#ffd23b", "#7a4d00");
  ctx.fillStyle = "#d4af37";
  ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
  ctx.fillText("now with a buy side", W / 2, 272);

  // sprite is right-heavy (the stick), so nudge left to center its visual mass
  drawPlayerSprite(W / 2 - 9, 350 + bob, 1);

  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.font = "15px Arial"; ctx.textAlign = "center";
  ctx.fillText("tilt or touch to steer  ·  tap defenders to shoot", W / 2, 432);

  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 0.12);
  bigText("TAP TO START", W / 2, 510, 26, "#fff", "#14532d");
  ctx.globalAlpha = 1;

  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.font = "13px Arial";
  ctx.fillText("best  " + best, W / 2, 552);
}

function drawGameOver() {
  ctx.fillStyle = "rgba(8,30,16,0.55)";
  ctx.fillRect(0, 0, W, H);

  bigText("CHECKED!", W / 2, 190, 52, "#ffd23b", "#7a2d00");
  ctx.fillStyle = "#fff";
  ctx.font = "bold 30px Arial"; ctx.textAlign = "center";
  ctx.fillText(score + "", W / 2, 260);
  ctx.font = "15px Arial"; ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillText("points", W / 2, 285);

  if (newBest) {
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 0.2);
    bigText("🏆 NEW RECORD!", W / 2, 340, 26, "#ffd23b");
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "16px Arial";
    ctx.fillText("best: " + best, W / 2, 335);
  }

  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 0.12);
  bigText("TAP TO PLAY AGAIN", W / 2, 440, 24, "#fff", "#14532d");
  ctx.globalAlpha = 1;
}

// ---------- Main draw ----------
function draw() {
  drawBackground();
  if (state !== "title") {
    for (const c of coins) drawCoin(c);
    for (const p of platforms) drawPlatform(p);
    for (const d of defenders) drawDefender(d);
    if (phase === 2) { drawPickups(); drawBoss(); drawBossShots(); }
    drawShots();
    drawParticles();
    drawPlayer();
    drawFloats();
    drawHUD();
    if (callOut && state === "playing") {
      ctx.globalAlpha = clamp(callOut.life / 20, 0, 1);
      bigText(callOut.txt, W / 2, 160, 34, "#ffd23b", "#7a2d00");
      ctx.globalAlpha = 1;
    }
  }
  if (state === "title") drawTitle();
  if (state === "gameover") drawGameOver();
}

// ---------- Loop ----------
// Fixed timestep: game logic always runs at 60 steps/sec regardless of the
// display refresh rate (120Hz phones were running double speed; slow frames
// were slowing the game down instead of staying constant).
const STEP = 1000 / 60;
let lastT = 0, acc = 0;
function loop(now) {
  if (now === undefined) now = lastT + STEP;
  let dt = now - lastT;
  lastT = now;
  if (dt < 0) dt = 0;
  if (dt > 250) dt = 250; // tab was backgrounded; don't fast-forward
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n === 5) acc = 0; // device can't catch up: drop the backlog, stay smooth
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);

// debug/test hook (harmless in production)
window.__lax2 = {
  getPhase: () => phase,
  getBossHp: () => boss ? boss.hp : -1,
  jumpTo: alt => {
    if (state !== "playing") return;
    cameraY = -alt;
    player.y = cameraY + 200;
    player.vy = 0;
    score = Math.max(score, Math.floor(alt));
    platforms.push(newPlatform(clamp(player.x - PLAT_W / 2, 8, W - PLAT_W - 8), player.y + 60, "normal"));
  },
  forceWin: () => { if (phase === 2 && boss && !boss.dead) defeatBoss(); },
  giveAmmo: () => { ammo = MAX_AMMO; },
};

})();
</script>
